<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MEMORY TRAP</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Courier New",monospace;font-weight:900}
body{background:#000;color:#fff;display:flex;flex-direction:column;min-height:100vh;padding:20px}
#top{width:100%;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #fff;padding-bottom:12px;font-size:18px;letter-spacing:2px}
#levelNum{color:#555}
#lives{font-size:16px;white-space:nowrap}
#box{flex:1;width:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px;text-transform:uppercase;text-align:center}
.btn{width:100%;max-width:400px;padding:18px;margin:10px 0;border:3px solid #fff;background:#fff;color:#000;font-size:20px;cursor:pointer;text-transform:uppercase;font-family:inherit;font-weight:900}
.btn:active{transform:translate(4px,4px)}
.btnB{background:#000;color:#fff}
input{width:100%;max-width:400px;padding:16px;background:#000;color:#fff;border:3px solid #fff;font-size:22px;font-family:inherit;font-weight:900;text-transform:uppercase;outline:none;margin-bottom:15px;text-align:center}
input:focus{box-shadow:4px 4px 0 #fff}
#tapBox{width:180px;height:180px;background:#fff;border:4px solid #000;display:flex;align-items:center;justify-content:center;color:#000;font-size:24px;box-shadow:6px 6px 0 #000;cursor:pointer;user-select:none}
.shake{animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
#msg{color:#777;font-size:14px;min-height:24px;text-align:center;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}
.hall{width:100%;max-width:450px;margin-top:15px;text-align:left;font-size:12px;max-height:200px;overflow-y:auto;line-height:18px}
.big{font-size:50px;letter-spacing:4px;margin:20px 0}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;width:100%;max-width:400px}
</style>
</head>
<body>
  <header id="top">
    <span id="levelNum"></span>
    <span id="lives"></span>
  </header>
  <section id="box"></section>
  <div id="msg"></div>

<script>
"use strict";

const MAX_LIVES = 5;
const NO_NUM = [7, 27, 47, 67, 87];
const COLORS = ["VERMELHO", "AZUL", "VERDE", "AMARELO", "ROXO"];

let level = 1, lives = 5, deaths = 0;
let memColors = [];
let timers = [];
let busy = false;
let level44Clicks = 0;

const $ = id => document.getElementById(id);

function clearTimers() { timers.forEach(clearTimeout); timers = []; busy = false; }
function later(fn, ms) { const t = setTimeout(() => { timers = timers.filter(x => x !== t); fn(); }, ms); timers.push(t); return t; }

function render() {
  $("levelNum").textContent = NO_NUM.includes(level) ? "" : "LVL " + level;
  $("lives").textContent = "❤️".repeat(Math.max(0, lives));
}

function message(t, ms = 900) {
  $("msg").textContent = t;
  later(() => { $("msg").textContent = ""; }, ms);
}

function fail(text = "ERROU") {
  const box = $("box");
  box.classList.remove("shake");
  void box.offsetWidth;
  box.classList.add("shake");
  if (navigator.vibrate) navigator.vibrate(200);
  message(text);
  lives--; deaths++; render();
  
  if (lives <= 0) {
    lives = MAX_LIVES;
    level = level <= 50 ? 1 : 50;
    render(); load(); return;
  }
  if (level !== 44) load();
}

function pass() {
  level++;
  if (level > 100) win();
  else load();
}

function load() {
  clearTimers();
  render();
  const box = $("box");
  box.style.background = "#000";
  box.style.color = "#fff";
  box.innerHTML = "";
  box.onclick = null;

  // 1 ao 6: Fácil para viciar
  if (level >= 1 && level <= 6) {
    box.innerHTML = `<p style="margin-bottom:20px">TOQUE NO BOTÃO CORRETO</p><button class="btn" onclick="pass()">SEGUIR</button><button class="btn btnB" onclick="fail('ERRADO')">ARMADILHA</button>`;
    return;
  }

  // Nível 7: Sem número
  if (level === 7) {
    box.innerHTML = `<p style="margin-bottom:20px">PRIMEIRA TRAP<br>QUAL O SEU PRÓXIMO PASSO?</p><button class="btn" onclick="pass()">CONTINUAR</button>`;
    return;
  }

  // Nível 9: As 5 cores
  if (level === 9) {
    memColors = [...COLORS];
    box.innerHTML = `<p style="margin-bottom:15px">DECORE AS 5 CORES (5s)</p>` + memColors.map((c, i) => `<p style="margin:6px">${i+1}. ${c}</p>`).join("");
    busy = true;
    later(() => {
      busy = false;
      box.innerHTML = `<p style="margin-bottom:15px">QUAL ERA A 2ª COR?</p>` + memColors.map(c => `<button class="btn btnB" onclick="if('${c}'==='${memColors[1]}')pass();else fail('ESQUECEU')">${c}</button>`).join("");
    }, 5000);
    return;
  }

  // Nível 10: Figura quebrada
  if (level === 10) {
    box.innerHTML = `<p style="margin-bottom:15px">FIGURA QUEBRADA<br>QUAL PEÇA ENCAIXA?</p><button class="btn btnB" onclick="fail('QUEBROU')">[ | ]</button><button class="btn" onclick="pass()">[ | | ]</button><button class="btn btnB" onclick="fail('FALTOU PEDAÇO')">[ / ]</button>`;
    return;
  }

  // Nível 27: Sem número
  if (level === 27) {
    box.innerHTML = `<p style="margin-bottom:20px">MAIS UM SEM NÚMERO</p><button class="btn" onclick="pass()">SEGUIR EM FRENTE</button>`;
    return;
  }

  // Nível 39: 3ª cor do nível 9
  if (level === 39) {
    box.innerHTML = `<p style="margin-bottom:15px">MEMÓRIA DO LVL 9<br>QUAL ERA A 3ª COR?</p>` + memColors.map(c => `<button class="btn btnB" onclick="if('${c}'==='${memColors[2]}')pass();else fail('ESQUECEU')">${c}</button>`).join("");
    return;
  }

  // Nível 40: Tela Branca Traumatizante
  if (level === 40) {
    box.style.background = "#fff";
    box.style.color = "#000";
    box.innerHTML = `<p style="font-size:24px;margin-bottom:15px">TOQUE NA TELA</p><p style="font-size:12px;color:#555">a pegadinha é não ter pegadinha?</p>`;
    box.onclick = () => { pass(); };
    return;
  }

  // Nível 44: Caixa da Ansiedade
  if (level === 44) {
    level44Clicks = 0;
    busy = true;
    box.innerHTML = `<div id="tapBox">APERTE</div><p id="ct" style="margin-top:15px">0/5</p>`;
    $("tapBox").onclick = () => {
      if (!busy || level44Clicks >= 5) return;
      level44Clicks++;
      if (level44Clicks === 5) {
        busy = false;
        box.innerHTML = `<div id="tapBox" style="background:#555;color:#fff">ESPERE</div><p style="margin-top:15px">5s sem tocar...</p>`;
        box.onclick = () => {
          if (busy) return;
          busy = true;
          lives--; deaths++; render();
          message("PERDEU 1 VIDA ESCONDIDA", 1200);
          level = 45; load();
        };
        later(() => { if (level !== 44) return; level = 45; load(); }, 5000);
      } else {
        $("ct").textContent = level44Clicks + "/5";
      }
    };
    return;
  }

  // Nível 47: Sem número + Pergunta
  if (level === 47) {
    box.innerHTML = `<p style="margin-bottom:15px">QUAL OUTRO NÍVEL ESTAVA SEM NÚMERO?</p><button class="btn btnB" onclick="pass()">7</button><button class="btn btnB" onclick="pass()">27</button><button class="btn btnB" onclick="fail('ERRADO')">15</button>`;
    return;
  }

  // Nível 48: Pisca rápido 0.3s
  if (level === 48) {
    let secret = Math.floor(Math.random() * 90) + 10;
    box.innerHTML = `<p class="big">${secret}</p>`;
    busy = true;
    later(() => {
      busy = false;
      box.innerHTML = `<p style="margin-bottom:15px">QUAL NÚMERO PISCOU?</p><input id="ans" type="number"><button class="btn" id="sub">ENVIAR</button>`;
      const check = () => { if (parseInt($("ans").value) === secret) pass(); else fail(); };
      $("sub").onclick = check;
      $("ans").onkeydown = e => { if(e.key==="Enter") check(); };
      $("ans").focus();
    }, 300);
    return;
  }

  // Nível 49: Prova final fase 1
  if (level === 49) {
    box.innerHTML = `<p style="margin-bottom:15px">PROVA DE MEMÓRIA<br>QUAL ERA A 3ª COR DO LVL 9?</p>` + memColors.map(c => `<button class="btn btnB" onclick="if('${c}'==='${memColors[2]}')pass();else fail('ERROU')">${c}</button>`).join("");
    return;
  }

  // Nível 50: O Portão
  if (level === 50) {
    if (lives < 5) {
      box.innerHTML = `<p style="font-size:26px;margin-bottom:15px">PORTÃO FECHADO</p><p style="margin-bottom:20px">Você chegou com ${lives}/5 vidas.<br>Exige 5 cheias. Volta ao LVL 1.</p><button class="btn" onclick="level=1;lives=5;load()">RECOMEÇAR</button>`;
    } else {
      box.innerHTML = `<p style="font-size:26px;margin-bottom:15px">PORTÃO ABERTO</p><p style="margin-bottom:20px">CHECKPOINT CONQUISTADO</p><button class="btn" onclick="pass()">ENTRAR</button>`;
    }
    return;
  }

  // Nível 67: Sem número
  if (level === 67) {
    box.innerHTML = `<p style="margin-bottom:15px">MAIS UM SEM NÚMERO</p><button class="btn" onclick="pass()">AVANÇAR</button>`;
    return;
  }

  // Nível 87: Chefão dos sem número
  if (level === 87) {
    box.innerHTML = `<p style="margin-bottom:15px">CHEFE: QUAIS NÍVEIS ESTAVAM SEM NÚMERO?</p><input id="ans87" placeholder="EX: 7,27,47,67"><button class="btn" onclick="val87()">ENVIAR</button>`;
    return;
  }

  // Nível 100: Boss Final
  if (level === 100) {
    box.innerHTML = `<p style="font-size:22px;margin-bottom:15px">BOSS FINAL<br>QUAL ERA A 1ª COR DO LVL 9?</p>` + memColors.map(c => `<button class="btn btnB" onclick="if('${c}'==='${memColors[0]}')pass();else fail('NO FINAL ERROU')">${c}</button>`).join("");
    return;
  }

  // Níveis intermediários / fáceis (sem contas)
  let type = level % 4;
  if (type === 0) {
    box.innerHTML = `<p style="margin-bottom:15px">ESCOLHA COM CUIDADO</p><button class="btn btnB" onclick="fail('ARMADILHA')">ERRADO</button><button class="btn" onclick="pass()">CERTO</button>`;
  } else if (type === 1) {
    let syms = ["#", "@", "$", "%"];
    let chosen = syms[Math.floor(Math.random()*syms.length)];
    box.innerHTML = `<p>MEMÓRIA RÁPIDA</p><p class="big">${chosen}</p>`;
    busy = true;
    later(() => {
      busy = false;
      box.innerHTML = `<p style="margin-bottom:15px">QUAL SÍMBOLO APARECEU?</p>` + syms.map(s => `<button class="btn btnB" onclick="if('${s}'==='${chosen}')pass();else fail()">${s}</button>`).join("");
    }, 500);
  } else if (type === 2) {
    box.innerHTML = `<p style="margin-bottom:15px">TOQUE NO BOTÃO DEBAIXO</p><button class="btn btnB" onclick="fail('ERRADO')">ESTE</button><button class="btn" onclick="pass()">E ESTE</button>`;
  } else {
    box.innerHTML = `<p style="margin-bottom:15px">TOQUE RÁPIDO</p><button class="btn" onclick="pass()">AGORA</button>`;
  }
}

function val87() {
  let v = $("ans87").value.replace(/\s/g, "");
  if (v === "7,27,47,67" || v === "7,27,47,67,87") pass();
  else fail("FALTOU ALGUM");
}

function getHall() {
  try { const x = JSON.parse(localStorage.getItem("memoryTrapHall") || "[]"); return Array.isArray(x) ? x : []; } catch { return []; }
}

function saveHall(code) {
  let name = ($("pname").value || "ANON").trim().toUpperCase();
  let hall = getHall();
  hall.push({ nome: name, mortes: deaths, codigo: code, data: new Date().toLocaleDateString("pt-BR") });
  localStorage.setItem("memoryTrapHall", JSON.stringify(hall));
  renderHall();
  message("SALVO NO HALL", 1200);
}

function renderHall() {
  let d = $("hallList");
  if (!d) return;
  let h = getHall();
  d.innerHTML = `<p style="color:#fff;margin-bottom:6px">HALL DA FAMA:</p>` + (h.length ? h.slice(-15).reverse().map((x, i) => `${i+1}. ${x.nome} — ${x.mortes}M [${x.codigo}]`).join("<br>") : "<span style='color:#777'>NENHUM REGISTRO.</span>");
}

function win() {
  clearTimers();
  let code = "TRAP-" + Math.floor(1000 + Math.random() * 9000);
  $("levelNum").textContent = "HALL";
  $("box").innerHTML = `
    <p style="font-size:26px;color:#fff;margin-bottom:10px">VOCÊ QUEBROU A TRAP</p>
    <p style="font-size:12px;color:#777;margin-bottom:15px">CÓDIGO: ${code} | MORTES: ${deaths}</p>
    <input id="pname" maxlength="20" placeholder="SEU NOME">
    <button class="btn" onclick="saveHall('${code}')">SALVAR NO HALL</button>
    <div id="hallList" class="hall"></div>
    <button class="btn btnB" style="margin-top:15px;font-size:14px;padding:12px" onclick="if(confirm('Apagar Hall?')){localStorage.removeItem('memoryTrapHall');renderHall()}">RESETAR HALL</button>
  `;
  renderHall();
}

load();
</script>
</body>
</html>
