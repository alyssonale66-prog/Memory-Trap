<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>MEMORY TRAP</title>
<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
}
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
    touch-action: none;
    position: fixed;
    inset: 0;
}
button {
    font: inherit;
    color: inherit;
    border: 0;
    outline: 0;
    background: none;
    touch-action: none;
}
#app {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}
.screen {
    position: absolute;
    inset: 0;
    display: none;
    width: 100%;
    height: 100%;
    overflow: hidden;
}
.screen.active {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}
#homeScreen {
    justify-content: center;
    align-items: center;
    gap: 24px;
    padding: calc(env(safe-area-inset-top) + 25px) 20px calc(env(safe-area-inset-bottom) + 20px);
}
.logo {
    text-align: center;
    line-height: 1.1;
    pointer-events: none;
    margin: 0;
}
.logo-main {
    display: block;
    font-size: clamp(38px, 11vw, 64px);
    font-weight: 900;
    letter-spacing: .10em;
    line-height: .90;
}
.logo-sub {
    display: block;
    margin-top: 14px;
    font-size: clamp(14px, 3.8vw, 22px);
    font-weight: 700;
    letter-spacing: .55em;
    padding-left: .55em;
    line-height: 1;
}
.logo-line {
    width: min(200px, 50vw);
    height: 1px;
    margin: 18px auto 0;
    background: rgba(255,255,255,.45);
}
.lives {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
}
.heart {
    position: relative;
    width: 22px;
    height: 22px;
    transform: rotate(-45deg);
    border-radius: 3px;
    background: #ff3b30;
}
.heart::before, .heart::after {
    content: "";
    position: absolute;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #ff3b30;
}
.heart::before { top: -11px; left: 0; }
.heart::after { top: 0; left: 11px; }
.heart.empty, .heart.empty::before, .heart.empty::after { background: #333; }
.start-button {
    position: relative;
    width: min(320px, 82vw);
    min-height: 68px;
    padding: 12px 20px;
    border: 1px solid rgba(255,255,255,.75);
    border-radius: 6px;
    background: #050505;
}
.start-title {
    display: block;
    font-size: 22px;
    font-weight: 900;
    letter-spacing: .15em;
}
.start-subtitle {
    display: block;
    margin-top: 3px;
    font-size: 10px;
    letter-spacing: .25em;
    opacity: .55;
}
.hall {
    position: relative;
    width: min(370px, 90vw);
    height: 110px;
    overflow: hidden;
    border-top: 1px solid rgba(255,255,255,.12);
    border-bottom: 1px solid rgba(255,255,255,.12);
}
.hall-title {
    position: absolute;
    top: 6px;
    left: 0;
    right: 0;
    z-index: 3;
    text-align: center;
    font-size: 10px;
    letter-spacing: .25em;
    opacity: .5;
}
.hall-mask {
    position: absolute;
    inset: 0;
    overflow: hidden;
    padding-top: 24px;
}
.hall-list {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
}
.hall-name {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .12em;
    opacity: .82;
}
.hall-empty {
    margin-top: 20px;
    font-size: 10px;
    letter-spacing: .15em;
    opacity: .28;
}
.home-menu {
    position: absolute;
    right: 20px;
    bottom: calc(env(safe-area-inset-bottom) + 10px);
    width: 40px;
    height: 40px;
    border: 1px solid rgba(255,255,255,.22);
    border-radius: 50%;
    font-size: 18px;
    opacity: .7;
}
#gameScreen {
    justify-content: flex-start;
    background: #000;
}
.game-header {
    position: relative;
    width: 100%;

    padding-top: calc(env(safe-area-inset-top) + 15px);
    z-index: 20;
}
.level-number {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: .15em;
}
.level-question {
    width: 90%;
    margin: 8px auto 0;
    text-align: center;
    font-size: clamp(15px, 3.8vw, 19px);
    font-weight: 700;
    line-height: 1.3;
}
.level-content {
    position: relative;
    width: 100%;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 10px 12px 70px;
    gap: 15px;
}
.game-lives {
    position: absolute;
    left: 0;
    right: 0;
    bottom: calc(env(safe-area-inset-bottom) + 15px);
    z-index: 30;
}
.options-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
    width: min(380px, 94vw);
    margin: 0 auto;
}
.blue-choice {
    min-height: 65px;
    background: #246bff;
    border: 1px solid rgba(255,255,255,.25);
    border-radius: 14px;
    font-size: 18px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px;
    text-align: center;
}
.broken-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    width: 100%;
    justify-content: flex-start;
    padding-top: 10px;
}
.broken-top {
    width: min(42vw, 165px);
    height: min(28vw, 110px);
    background: #246bff;
    border-radius: 8px 8px 4px 4px;
    clip-path: polygon(0% 0%, 100% 0%, 100% 52%, 88% 100%, 76% 62%, 63% 100%, 51% 60%, 37% 100%, 25% 60%, 12% 100%, 0% 52%);
    transition: all 0.3s ease;
    box-shadow: 0 0 0 1px rgba(255,255,255,.15) inset;
}
.broken-top.filled { clip-path: none; }
.broken-pieces-pool {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    width: min(92vw, 360px);
    justify-items: center;
}
.puzzle-piece {
    width: min(42vw, 165px);
    height: min(28vw, 110px);
    background: #246bff;
    border-radius: 8px;
    touch-action: none;
    cursor: grab;
    transition: transform 0.38s cubic-bezier(.2,.8,.3,1.2);
    border: 1px solid rgba(255,255,255,.12);
}
.puzzle-piece.dragging {
    transition: none;
    z-index: 50;
    scale: 1.08;
    box-shadow: 0 8px 24px rgba(0,0,0,.6);
}
.puzzle-piece.wrong-shake { animation: shakeWrong 0.4s ease; }
@keyframes shakeWrong {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-6px); }
    80% { transform: translateX(6px); }
}
.grid2-large {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    grid-template-rows: repeat(2, 75px);
    gap: 14px;
    width: min(380px, 94vw);
}
.shape-field-full {
    position: absolute;
    inset: 0 0 95px 0;
    pointer-events: none;
}
.geo-shape { position: absolute; background: #fff; }
.geo-circle { border-radius: 50%; }
.geo-square { border-radius: 4px; }
.geo-rect { border-radius: 3px; }
.geo-pentagon { clip-path: polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%); }
.geo-hexagon { clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%); }
.click-circle {
    position: absolute;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: #246bff;
    border: 1.5px solid #fff;
}
.rats-wrap {
    position: relative;
    width: 260px;
    height: 260px;
    margin-bottom: 10px;
}
.orbit-center {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 10px;
    height: 10px;
    transform: translate(-5%, -5%);
    animation: spin 4s linear infinite;
}
.circling-rat {
    position: absolute;
    font-size: 26px;
    transform-origin: center;
}
@keyframes spin { 100% { transform: translate(-50%, -50%) rotate(360deg); } }
.question-with-rat { position: relative; display: inline-block; padding: 0 15px; }
.small-hiding-rat {
    position: absolute;
    font-size: 14px;
    top: -15px;
    left: -30px;
    animation: ratArcRun 1.5s linear infinite;
}
@keyframes ratArcRun {
    0% { transform: translate(0, 15px) scale(0.6); opacity: 0; }
    50% { transform: translate(90px, -15px) scale(0.6); opacity: 1; }
    100% { transform: translate(180px, 15px) scale(0.6); opacity: 0; }
}
.color-bar-container {
    display: flex;
    justify-content: space-evenly;
    align-items: center;
    width: min(390px, 96vw);
    height: 180px;
    margin: 0 auto;
}
.color-segment { width: 26px; height: 155px; border-radius: 6px; }
.c-red { background: #ff3030; }
.c-blue { background: #3080ff; }
.c-green { background: #35c96b; }
.c-yellow { background: #ffd83d; }
.c-purple { background: #9c55ff; }
.c-orange { background: #ff8a30; }
.arrow-sequence-display {
    display: flex;
    gap: 16px;
    font-size: 40px;
    font-weight: 900;
    margin: 15px 0;
}
.red-trap-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
    width: min(380px, 94vw);
}
.red-trap-btn {
    min-height: 65px;
    border: 1px solid rgba(255,255,255,.25);
    border-radius: 14px;
}
.arrow-labyrinth-11 {
    position: relative;
    width: min(360px, 92vw);
    height: min(420px, 72vh);
    background: #000000;
    margin: 0 auto;
    overflow: hidden;
    border-radius: 8px;
}
.maze-line {
    position: absolute;
    background: rgba(255,255,255,.9);
    border-radius: 2px;
    transition: opacity 0.4s ease;
}
.lab-arrow-node {
    position: absolute;
    width: 28px;
    height: 28px;
    background: transparent;
    border: none;
    font-size: 22px;
    font-weight: 900;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 10;
    line-height: 1;
    transition: transform 0.7s cubic-bezier(.2,.8,.2,1), opacity 0.4s;
}
@keyframes shake11 {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
}
.hold-btn-12 {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    background: #246bff;
    border: 4px solid #fff;
    font-size: 16px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
}
.rhythm-target-13 {
    position: relative;
    width: 120px;
    height: 120px;
    border-radius: 50%;
    border: 3px dashed #246bff;
    display: flex;
    align-items: center;
    justify-content: center;
}
.rhythm-pulse-13 {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #ff3b30;
    animation: pulseAnim 1.2s infinite ease-in-out;
}
@keyframes pulseAnim {
    0% { transform: scale(0.5); opacity: 0.5; }
    50% { transform: scale(1.4); opacity: 1; }
    100% { transform: scale(0.5); opacity: 0.5; }
}
.reverse-grid-14 {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
    width: min(300px, 90vw);
}
.rev-btn-14 {
    height: 75px;
    background: #333;
    border-radius: 12px;
    font-size: 22px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid rgba(255,255,255,0.2);
}
.rev-btn-14.lit {
    background: #246bff;
    border-color: #fff;
}
.blind-pixel-area-15 { position: absolute; inset: 0; }
.blind-pixel-15 {
    position: absolute;
    top: 15px;
    right: 15px;
    width: 14px;
    height: 14px;
    background: transparent;
    cursor: pointer;
}
.drag-out-btn-16 {
    width: 140px;
    height: 60px;
    background: #246bff;
    border-radius: 10px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;

}
.exclusion-field-17 {
    position: relative;
    width: min(360px, 92vw);
    height: 260px;
    border: 1px dashed rgba(255,255,255,0.2);
    border-radius: 12px;
    overflow: hidden;
}
.exc-item {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 14px;
}
.exc-circle {
    width: 40px;

    border-radius: 50%;
    background: #246bff;
}
.exc-square {
    width: 40px;
    height: 40px;
    border-radius: 6px;
    background: #ff3b30;
}
.escaping-btn-18 {
    width: 130px;
    height: 60px;
    background: #246bff;
    border-radius: 12px;
    font-weight: bold;
    position: absolute;
    transition: transform 0.15s ease;
    display: flex;
    align-items: center;
    justify-content: center;
}
.intruder-grid-19 {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    width: min(320px, 90vw);
}
.intruder-cell {
    aspect-ratio: 1;
    background: #1c1c1e;
    border-radius: 6px;
    font-size: 20px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(255,255,255,0.8);
}
.recall-grid-20 {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
    width: min(340px, 90vw);
}
.recall-shape-btn {
    height: 100px;
    background: #1c1c1e;
    border: 2px solid rgba(255,255,255,.2);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
}
.recall-mini-shape {
    width: 70px;
    height: 40px;
    background: #246bff;
    border-radius: 6px;
}
#overlay {
    position: absolute;
    inset: 0;
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;

}
#overlay.active { display: flex; }
.overlay-content { width: min(340px, 86vw); text-align: center; }
.overlay-title { font-size: 28px; font-weight: 900; letter-spacing: .1em; }
.overlay-text { margin-top: 12px; font-size: 14px; line-height: 1.4; opacity: .7; }
.overlay-button {
    margin-top: 24px;
    padding: 14px 26px;
    border: 1px solid rgba(255,255,255,.5);
    border-radius: 8px;
}
#settingsScreen {

    align-items: center;
    justify-content: flex-start;
    padding: calc(env(safe-area-inset-top) + 40px) 25px 25px;
}
.settings-title { font-size: 24px; font-weight: 900; letter-spacing: .15em; }
.setting-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: min(360px, 90vw);
    margin-top: 22px;
    padding: 16px 0;
    border-bottom: 1px solid rgba(255,255,255,.12);
}
.setting-button {
    min-width: 70px;
    padding: 8px 14px;
    border: 1px solid rgba(255,255,255,.3);
    border-radius: 8px;
}
.back-button {
    position: absolute;
    left: 20px;
    top: calc(env(safe-area-inset-top) + 15px);
    padding: 10px;
    opacity: .6;
}
</style>
</head>
<body>
<div id="app">
    <section id="homeScreen" class="screen active">
        <div class="logo">
            <span class="logo-main">MEMORY</span>
            <span class="logo-sub">TRAP</span>
            <div class="logo-line"></div>
        </div>
        <div id="homeLives" class="lives home-lives"></div>
        <button id="startButton" class="start-button">
            <span class="start-title">INICIAR</span>
            <span class="start-subtitle">MEMORY TRAP</span>
        </button>
        <div class="hall">
            <div class="hall-title">HALL DOS SOBREVIVENTES</div>
            <div class="hall-mask">
                <div id="hallList" class="hall-list"></div>
            </div>
        </div>
        <button id="menuButton" class="home-menu">☰</button>
    </section>

    <section id="gameScreen" class="screen">
        <div class="game-header">
            <div id="levelNumber" class="level-number"></div>
            <div id="levelQuestion" class="level-question"></div>
        </div>
        <div id="levelContent" class="level-content"></div>
        <div id="gameLives" class="lives game-lives"></div>
    </section>

    <section id="settingsScreen" class="screen">
        <button id="backButton" class="back-button">←</button>
        <div class="settings-title">CONFIGURAÇÕES</div>
        <div class="setting-row"><span>SOM</span><button id="soundButton" class="setting-button">ON</button></div>
        <div class="setting-row"><span>VIBRAÇÃO</span><button id="vibrationButton" class="setting-button">ON</button></div>
    </section>

    <div id="overlay">
        <div class="overlay-content">
            <div id="overlayTitle" class="overlay-title"></div>
            <div id="overlayText" class="overlay-text"></div>
            <button id="overlayButton" class="overlay-button"></button>
        </div>
    </div>
</div>

<script>
"use strict";

/* ============================================================
   CONFIGURAÇÃO
   ============================================================ */

const CONFIG = {
    TOTAL_LEVELS: 100,
    STARTING_LIVES: 5,
    SOUND_ENABLED: true,
    VIBRATION_ENABLED: true,
    SURVIVORS_KEY: "memory_trap_survivors_v1"
};

const GAME = {
    currentLevel: 0,
    lives: CONFIG.STARTING_LIVES,
    totalAttempts: 0,
    mistakes: 0,
    levelTimers: [],
    state: {},
    finished: false
};


/* ============================================================
   DOM
   ============================================================ */

const DOM = {
    homeScreen: document.getElementById("homeScreen"),
    gameScreen: document.getElementById("gameScreen"),
    settingsScreen: document.getElementById("settingsScreen"),
    homeLives: document.getElementById("homeLives"),
    gameLives: document.getElementById("gameLives"),
    levelNumber: document.getElementById("levelNumber"),
    levelQuestion: document.getElementById("levelQuestion"),
    levelContent: document.getElementById("levelContent"),
    startButton: document.getElementById("startButton"),
    menuButton: document.getElementById("menuButton"),
    backButton: document.getElementById("backButton"),
    soundButton: document.getElementById("soundButton"),
    vibrationButton: document.getElementById("vibrationButton"),
    hallList: document.getElementById("hallList"),
    overlay: document.getElementById("overlay"),
    overlayTitle: document.getElementById("overlayTitle"),
    overlayText: document.getElementById("overlayText"),
    overlayButton: document.getElementById("overlayButton")
};


/* ============================================================
   NÍVEIS
   ============================================================ */

const LEVELS = {
    1: { type: "broken-shape" },
    2: { type: "grid" },
    3: { type: "direct-answer" },
    4: { type: "pi" },
    5: { type: "count-circles" },
    6: { type: "appearing-circles" },
    7: { type: "no-number-rats", hiddenNumber: true },
    8: { type: "color-memory" },
    9: { type: "arrow-memory" },
    10: { type: "camouflaged-command" },
    11: { type: "labyrinth-arrows" },
    12: { type: "hold-two-seconds" },
    13: { type: "circle-rhythm" },
    14: { type: "reverse-order" },
    15: { type: "blind-pixel" },
    16: { type: "drag-outside" },
    17: { type: "circle-exclusion" },
    18: { type: "escaping-button" },
    19: { type: "letter-intruder" },
    20: { type: "level1-recall" }
};

for (let i = 21; i <= 100; i++) {
    LEVELS[i] = {
        name: "Nível " + i,
        type: "unimplemented"
    };
}


/* ============================================================
   TIMERS
   ============================================================ */

function clearLevelTimers() {
    GAME.levelTimers.forEach(t => {
        clearTimeout(t);
        clearInterval(t);
    });

    GAME.levelTimers = [];
}

function addLevelTimer(t) {
    if (t != null) {
        GAME.levelTimers.push(t);
    }

    return t;
}

function levelTimeout(callback, delay, level = GAME.currentLevel) {
    const timer = setTimeout(() => {

        if (GAME.finished) return;
        if (GAME.currentLevel !== level) return;

        callback();

    }, delay);

    addLevelTimer(timer);

    return timer;
}


/* ============================================================
   ÁUDIO
   ============================================================ */

let audioContext = null;

function getAudioContext() {
    if (!audioContext) {
        const Ctx = window.AudioContext || window.webkitAudioContext;

        if (Ctx) {
            try {
                audioContext = new Ctx();
            } catch (e) {
                audioContext = null;
            }
        }
    }

    return audioContext;
}

function playTone(f, d, ty = "sine", v = 0.035) {

    if (!CONFIG.SOUND_ENABLED) return;

    const ctx = getAudioContext();

    if (!ctx) return;

    if (ctx.state === "suspended") {
        ctx.resume().catch(() => {});
    }

    try {
        const o = ctx.createOscillator();
        const g = ctx.createGain();

        o.type = ty;
        o.frequency.setValueAtTime(f, ctx.currentTime);

        g.gain.setValueAtTime(v, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(
            0.001,
            ctx.currentTime + d
        );

        o.connect(g);
        g.connect(ctx.destination);

        o.start();
        o.stop(ctx.currentTime + d);
    } catch (e) {}
}

function soundCorrect() {
    playTone(720, 0.08, "sine", 0.035);

    /*

   ============================================================ */

function getSurvivors() {

    try {
        const r = localStorage.getItem(
            CONFIG.SURVIVORS_KEY
        );

        return r ? JSON.parse(r) : [];

    } catch {
        return [];
    }
}

function renderHall() {

    const s = getSurvivors();

    DOM.hallList.innerHTML = "";

    if (s.length === 0) {

        const e = document.createElement("div");

        e.className = "hall-empty";
        e.textContent = "NENHUM SOBREVIVENTE";

        DOM.hallList.appendChild(e);

        return;
    }

    s
        .slice(-20)
        .reverse()
        .forEach(p => {

            const n = document.createElement("div");

            n.className = "hall-name";
            n.textContent = String(
                p.name ?? ""
            )
                .slice(0, 20)
                .toUpperCase();

            DOM.hallList.appendChild(n);
        });
}

let hallAnim = null;
let hallPos = 0;

function startHallAnimation() {

    if (hallAnim) {
        cancelAnimationFrame(hallAnim);
        hallAnim = null;
    }

    hallPos = 0;

    function animate() {

        if (
            !DOM.homeScreen.classList.contains("active")
        ) {
            hallAnim = null;
            return;
        }

        const h = DOM.hallList.offsetHeight;
        const v = DOM.hallList.parentElement.offsetHeight;

        if (h > v) {

            hallPos += 0.18;

            if (
                hallPos >
                h - v + 25
            ) {
                hallPos = 0;
            }

            DOM.hallList.style.transform =
                `translateY(-${hallPos}px)`;
        }

        hallAnim =
            requestAnimationFrame(animate);
    }

    animate();
}


/* ============================================================
   JOGO
   ============================================================ */

function startGame() {

    clearLevelTimers();

    closeOverlay();

    GAME.currentLevel = 1;
    GAME.lives = CONFIG.STARTING_LIVES;
    GAME.totalAttempts = 0;
    GAME.mistakes = 0;
    GAME.finished = false;
    GAME.state = {};

    updateLives();

    showScreen(DOM.gameScreen);

    loadLevel(1);
}

function loadLevel(n) {

    clearLevelTimers();

    GAME.currentLevel = n;
    GAME.state = {};

    const l = LEVELS[n];

    if (!l) {
        finishGame();
        return;
    }

    DOM.levelNumber.textContent =
        l.hiddenNumber ? "" : n;

    DOM.levelQuestion.innerHTML = "";
    DOM.levelContent.innerHTML = "";

    renderLevel(n, l);

    updateLives();
}

function failLevel() {

    if (GAME.finished) return;

    /*
     * Evita duas perdas de vida disparadas no mesmo frame/
     * mesmo evento.
     */
    if (GAME.state.failLock) return;

    GAME.state.failLock = true;

    GAME.totalAttempts++;
    GAME.mistakes++;
    GAME.lives--;

    feedbackLifeLost();
    updateLives();

    if (GAME.lives <= 0) {

        clearLevelTimers();

        showOverlay(
            "SEM VIDAS",
            "Você perdeu as 5 vidas. O jogo será reiniciado.",
            "RECOMEÇAR",
            () => {

                GAME.lives =
                    CONFIG.STARTING_LIVES;

                GAME.finished = false;
                GAME.state = {};

                updateLives();
                closeOverlay();

                loadLevel(1);
            }
        );

        return;
    }

    clearLevelTimers();

    /*
     * Pequena pausa visual antes de reconstruir o nível.
     * O timer é protegido contra nível antigo.
     */
    levelTimeout(() => {
        loadLevel(GAME.currentLevel);
    }, 80, GAME.currentLevel);
}

function completeLevel() {

    if (GAME.finished) return;
    if (GAME.state.completeLock) return;

    GAME.state.completeLock = true;

    feedbackCorrect();

    const next =
        GAME.currentLevel + 1;

    if (
        GAME.currentLevel === CONFIG.TOTAL_LEVELS ||
        !LEVELS[next]
    ) {
        finishGame();
        return;
    }

    const current =
        GAME.currentLevel;

    levelTimeout(() => {

        if (GAME.currentLevel !== current) return;

        loadLevel(next);

    }, 180, current);
}

   ============================================================ */

function renderLevel1() {

    DOM.levelQuestion.textContent =
        "Complete a figura.";

    const wrap =
        document.createElement("div");

    wrap.className =
        "broken-container";

    wrap.innerHTML = `
        <div class="broken-top" id="targetArea"></div>

        <div class="broken-pieces-pool">

            <div
                class="puzzle-piece"
                data-correct="false"
                style="clip-path:polygon(
                    0% 100%,100% 100%,100% 28%,
                    86% 2%,77% 32%,61% 4%,
                    50% 32%,36% 3%,25% 32%,
                    11% 2%,0% 28%
                )"
            ></div>

            <div
                class="puzzle-piece"
                data-correct="true"
                style="clip-path:polygon(
                    0% 100%,100% 100%,100% 48%,
                    88% 0%,78% 38%,63% 2%,
                    52% 40%,38% 0%,26% 36%,
                    12% 0%,0% 48%
                )"
            ></div>

            <div
                class="puzzle-piece"
                data-correct="false"
                style="clip-path:polygon(
                    0% 100%,100% 100%,100% 32%,
                    88% 8%,78% 34%,63% 10%,
                    52% 36%,38% 8%,26% 32%,
                    12% 8%,0% 32%
                )"
            ></div>

            <div
                class="puzzle-piece"
                data-correct="false"
                style="clip-path:polygon(
                    0% 100%,100% 100%,100% 30%,
                    88% 4%,79% 30%,64% 6%,
                    53% 32%,39% 4%,27% 30%,
                    13% 4%,0% 30%
                )"
            ></div>

        </div>
    `;

    DOM.levelContent.appendChild(wrap);

    const pieces =
        wrap.querySelectorAll(".puzzle-piece");

    const target =
        wrap.querySelector("#targetArea");

    pieces.forEach(p => {

        let sx = 0;
        let sy = 0;

        p.addEventListener(
            "pointerdown",
            e => {

                if (GAME.currentLevel !== 1) return;

                p.setPointerCapture(e.pointerId);

                p.classList.add("dragging");

                sx = e.clientX;
                sy = e.clientY;

                const mv = em => {

                    if (
                        GAME.currentLevel !== 1
                    ) return;

                    p.style.transform =
                        `translate(
                            ${em.clientX - sx}px,
                            ${em.clientY - sy}px
                        )`;
                };

                const up = em => {

                    p.releasePointerCapture(
                        em.pointerId
                    );

                    p.classList.remove(
                        "dragging"
                    );

                    p.removeEventListener(
                        "pointermove",
                        mv
                    );

                    p.removeEventListener(
                        "pointerup",
                        up
                    );

                    const pr =
                        p.getBoundingClientRect();

                    const tr =
                        target.getBoundingClientRect();

                    const d = Math.hypot(
                        (pr.left + pr.width / 2) -
                        (tr.left + tr.width / 2),

                        (pr.top + pr.height / 2) -
                        (tr.bottom - 20)
                    );

                    if (d < 110) {

                        if (
                            p.dataset.correct === "true"
                        ) {

                            p.style.opacity = "0";

                            target.classList.add(
                                "filled"
                            );

                            levelTimeout(
                                completeLevel,
                                380,
                                1
                            );

                        } else {

                            p.classList.add(
                                "wrong-shake"
                            );

                            p.style.transform =
                                "translate(0,0)";

                            levelTimeout(
                                () => {
                                    p.classList.remove(
                                        "wrong-shake"
                                    );
                                },
                                400,
                                1
                            );

                            levelTimeout(
                                failLevel,
                                350,
                                1
                            );
                        }

                    } else {

                        p.style.transform =
                            "translate(0,0)";
                    }
                };

                p.addEventListener(
                    "pointermove",
                    mv
                );

                p.addEventListener(
                    "pointerup",
                    up
                );
            }
        );
    });
}

function renderLevel6() {

    DOM.levelQuestion.textContent =
        "Acompanhe e toque nos círculos.";

    const wrap =
        document.createElement("div");

    wrap.style.cssText =
        "position:relative;width:100%;height:320px;margin:0 auto;";

    DOM.levelContent.appendChild(wrap);

    const coords = [
        ["20%", "30%"],
        ["70%", "25%"],
        ["50%", "50%"],
        ["25%", "70%"],
        ["75%", "65%"]
    ];

    let currentIndex = 0;
    let failed = false;

    function showNextCircle() {

        if (
            failed ||
            GAME.currentLevel !== 6
        ) return;

        if (
            currentIndex >=
            coords.length
        ) {
            completeLevel();
            return;
        }

        const [l, t] =
            coords[currentIndex];

        const c =
            document.createElement("div");

        c.className =
            "click-circle";

        c.style.cssText = `
            position:absolute;
            left:${l};
            top:${t};
            transform:translate(-50%,-50%) scale(0);
            transition:transform .12s ease;
        `;

        wrap.appendChild(c);

        requestAnimationFrame(() => {

            if (
                failed ||
                GAME.currentLevel !== 6
            ) return;

            c.style.transform =
                "translate(-50%,-50%) scale(1)";
        });

        let wasClicked = false;

        const hideTimer =
            levelTimeout(() => {

                if (
                    !wasClicked &&
                    !failed &&
                    GAME.currentLevel === 6
                ) {

                    failed = true;

                    c.style.transform =
                        "translate(-50%,-50%) scale(0)";

                    failLevel();
                }

            }, 1200, 6);

        c.addEventListener(
            "pointerup",
            () => {

                if (
                    wasClicked ||
                    failed ||
                    GAME.currentLevel !== 6
                ) return;

                wasClicked = true;

                clearTimeout(hideTimer);

                c.style.transform =
                    "translate(-50%,-50%) scale(0)";

                feedbackCorrect();

                currentIndex++;

                levelTimeout(() => {

                    if (
                        GAME.currentLevel !== 6
                    ) return;

                    c.remove();

                    showNextCircle();

                }, 90, 6);
            },
            { once: true }
        );
    }

    levelTimeout(
        showNextCircle,
        400,
        6
    );
}

                        GAME.state.arrowSeq[
                            GAME.state.arrowIdx
                        ]
                    ) {
                        failLevel();
                        return;
                    }

                    GAME.state.arrowIdx++;

                    if (
                        GAME.state.arrowIdx >=
                        GAME.state.arrowSeq.length
                    ) {
                        completeLevel();
                    } else {
                        feedbackCorrect();
                    }
                }
            );
        });

        w.appendChild(g);

    }, 4500, 9);
}

function renderLevel10() {

    DOM.levelQuestion.innerHTML =
        `Toque no <span id="secretRedTarget">vermelho</span>.`;

    const w =
        document.createElement("div");

    w.className =
        "red-trap-grid";

    [
        "#b23b3b",
        "#a83232",
        "#c44d4d",
        "#9e2a2a"
    ].forEach(t => {

        const b =
            document.createElement("button");

        b.className =
            "red-trap-btn";

        b.style.background = t;

        w.appendChild(b);

        b.addEventListener(
            "pointerup",
            () => {

                if (GAME.currentLevel !== 10) return;

                failLevel();
            }
        );
    });

    DOM.levelContent.appendChild(w);

    levelTimeout(() => {

        const target =
            document.getElementById(
                "secretRedTarget"
            );

        if (
            target &&
            GAME.currentLevel === 10
        ) {

            target.addEventListener(
                "pointerup",
                completeLevel,
                { once: true }
            );
        }

    }, 50, 10);
}

    const DIR = {
        left:{x:-1,y:0}, right:{x:1,y:0}, up:{x:0,y:-1}, down:{x:0,y:1}
    };

    const arrows = META.map((m,i) => ({
        ...m,
        path: PATHS[i],
        img:null,
        removed:false,
        animating:false,
        progress:0,
        track:null,
        dist:null,
        headDist:0,
        tailDist:0
    }));

    let ready=false, busy=false, finished=false, raf=0, pointerArrow=null;
    let animationToken=0;

    const previousCleanup = window.__MEMORY_TRAP_L11_CLEANUP;
    if (typeof previousCleanup === "function") previousCleanup();
    window.__MEMORY_TRAP_L11_CLEANUP = () => {
        animationToken++;
        if (raf) cancelAnimationFrame(raf);
        raf=0; busy=false; pointerArrow=null;
        arrows.forEach(a=>a.animating=false);
    };

    function loadImage(src) {
        return new Promise((resolve,reject)=>{
            const img=new Image();
            img.onload=()=>resolve(img);
            img.onerror=reject;
            img.src="data:image/png;base64,"+src;
        });
    }

    function drawDots() {
        ctx.fillStyle=BLUE_DOT;
        for(let r=0;r<28;r++) for(let c=0;c<20;c++) {
            ctx.beginPath(); ctx.arc(22+c*47,20+r*47,1.05,0,Math.PI*2); ctx.fill();
        }
    }

    function drawStaticArrow(a) {
        if(a.img) ctx.drawImage(a.img,a.x-X0,a.y-Y0);
    }

    function drawVectorPath(points, alpha=1) {
        if(!points || points.length<2) return;
        const p=new Path2D();
        p.moveTo(points[0][0],points[0][1]);
        for(let i=1;i<points.length;i++) p.lineTo(points[i][0],points[i][1]);
        ctx.strokeStyle=BLUE;
        ctx.globalAlpha=alpha;
        ctx.lineWidth=BODY_W;
        ctx.lineCap="round";
        ctx.lineJoin="round";
        ctx.stroke(p);
        ctx.globalAlpha=1;
    }

    function drawHead(point, dir, alpha=1) {
        const d=DIR[dir];
        const tip={x:point[0]+d.x*15,y:point[1]+d.y*15};
        const base={x:point[0]-d.x*9,y:point[1]-d.y*9};
        const px=-d.y, py=d.x;
        const hw=9.5;
        ctx.fillStyle=BLUE;
        ctx.globalAlpha=alpha;
        ctx.beginPath();
        ctx.moveTo(tip.x,tip.y);
        ctx.lineTo(base.x+px*hw,base.y+py*hw);
        ctx.lineTo(base.x-px*hw,base.y-py*hw);
        ctx.closePath(); ctx.fill();
        ctx.globalAlpha=1;
    }

    function draw() {
        ctx.fillStyle="#000"; ctx.fillRect(0,0,BOARD_W,BOARD_H); drawDots();
        if(!ready) return;
        for(const a of arrows) {
            if(a.removed) continue;
            if(!a.animating) drawStaticArrow(a);
            else drawAnimatedArrow(a);
        }
    }

    function boardPoint(e) {
        const r=canvas.getBoundingClientRect();
        return {x:(e.clientX-r.left)*BOARD_W/r.width,y:(e.clientY-r.top)*BOARD_H/r.height};
    }

    function pointSegmentDistance(px,py,ax,ay,bx,by) {
        const abx=bx-ax, aby=by-ay;
        const den=abx*abx+aby*aby;
        let t=den ? ((px-ax)*abx+(py-ay)*aby)/den : 0;
        t=Math.max(0,Math.min(1,t));
        const qx=ax+t*abx, qy=ay+t*aby;
        return Math.hypot(px-qx,py-qy);
    }

    // Hit-test geométrico: qualquer ponto sobre o corpo ou cabeça da seta.
    // Não depende de pixel/ID map, então funciona também nas curvas e nas
    // partes finas/antialiased do sprite.
    function hitArrow(p) {
        let best=null, bestD=Infinity;
        for(const a of arrows) {
            if(a.removed || a.animating || !a.path || a.path.length<2) continue;
            let d=Infinity;
            for(let i=0;i<a.path.length-1;i++) {
                d=Math.min(d,pointSegmentDistance(p.x,p.y,a.path[i][0],a.path[i][1],a.path[i+1][0],a.path[i+1][1]));
            }
            const h=a.path[0];
            d=Math.min(d,Math.hypot(p.x-h[0],p.y-h[1]));
            if(d<=BODY_W*0.72+9 && d<bestD) { best=a; bestD=d; }
        }
        return best;
    }

    function pathIsClear(a) {
        const d=DIR[a.dir];
        let x=a.path[0][0]+d.x*7, y=a.path[0][1]+d.y*7;
        const max=1800;
        for(let s=0;s<max;s+=3) {
            const cx=x+d.x*s, cy=y+d.y*s;
            if(cx<0 || cx>BOARD_W || cy<0 || cy>BOARD_H) return true;
            for(const o of arrows) {
                if(o===a || o.removed || o.animating) continue;
                const hitRadius=BODY_W*0.60+2.5;
                for(let i=0;i<o.path.length-1;i++) {
                    if(pointSegmentDistance(cx,cy,o.path[i][0],o.path[i][1],o.path[i+1][0],o.path[i+1][1])<=hitRadius) return false;
                }
            }
        }
        return false;
    }

    function buildTrack(a) {
        const d=DIR[a.dir];
        const head={x:a.path[0][0],y:a.path[0][1]};
        const ext=[];
        const cells=Math.ceil(Math.max(BOARD_W,BOARD_H)/CELL)+8;
        // Farthest -> head. A cabeça entra primeiro no corredor de saída;
        // depois o restante da cobra é puxado pelo mesmo trilho.
        for(let i=cells;i>=1;i--) ext.push([head.x+d.x*i*CELL,head.y+d.y*i*CELL]);
        const track=ext.concat(a.path.map(p=>[p[0],p[1]]));
        const dist=[0];
        for(let i=1;i<track.length;i++) dist.push(dist[i-1]+Math.hypot(track[i][0]-track[i-1][0],track[i][1]-track[i-1][1]));
        return {track,dist,headDist:dist[ext.length-1],tailDist:dist[ext.length+a.path.length-1]};
    }

    function lerpTrack(track,dist,s) {
        if(s<=dist[0]) return track[0];
        if(s>=dist[dist.length-1]) return track[track.length-1];
        let lo=0,hi=dist.length-1;
        while(lo<hi-1) { const m=(lo+hi)>>1; if(dist[m]<s) lo=m; else hi=m; }
        const span=dist[hi]-dist[lo] || 1;
        const t=(s-dist[lo])/span;
        return [track[lo][0]+(track[hi][0]-track[lo][0])*t,track[lo][1]+(track[hi][1]-track[lo][1])*t];
    }

    function sliceTrack(track,dist,from,to) {
        if(from>=to) return [];
        const out=[lerpTrack(track,dist,from)];
        for(let i=0;i<dist.length;i++) if(dist[i]>from && dist[i]<to) out.push(track[i]);
        out.push(lerpTrack(track,dist,to));
        return out;
    }

    function drawAnimatedArrow(a) {
        const tr=a.track;
        if(!tr) return;
        // Linearidade constante: a ponta e o corpo têm a mesma velocidade,
        // exatamente como uma cobra sendo puxada pelo primeiro segmento.
        const traveled=a.progress*tr.tailDist;
        const headS=Math.max(0,tr.headDist-traveled);
        const tailS=Math.max(0,tr.tailDist-traveled);
        const pts=sliceTrack(tr.track,tr.dist,headS,tailS);
        if(pts.length<2) return;
        drawVectorPath(pts,1);
        drawHead(pts[0],a.dir,1);
    }

    function startExit(a) {
        if(busy || finished || a.animating || a.removed) return;
        busy=true; a.animating=true; a.progress=0; a.track=buildTrack(a);
        const token=++animationToken;
        const pathCells=Math.max(2,a.path.length);
        const duration=Math.max(900,Math.min(2600,520+pathCells*65));
        const t0=performance.now();

        function frame(now) {
            if(token!==animationToken || GAME.currentLevel!==11) return;
            a.progress=Math.min(1,(now-t0)/duration);
            draw();
            if(a.progress<1) { raf=requestAnimationFrame(frame); return; }
            a.removed=true; a.animating=false; a.track=null; a.progress=0; busy=false;
            draw();
            if(arrows.every(x=>x.removed)) {
                finished=true;
                levelTimeout(()=>completeLevel(),140,11);
            }
        }
        raf=requestAnimationFrame(frame);
    }

    function handleTap(a) {
        if(!a || busy || finished || a.removed || a.animating) return;
        if(!pathIsClear(a)) { failLevel(); return; }
        feedbackCorrect();
        startExit(a);
    }

    canvas.addEventListener("pointerdown",e=>{
        if(GAME.currentLevel!==11 || busy || finished || !ready) return;
        e.preventDefault();
        pointerArrow=hitArrow(boardPoint(e));
        try{canvas.setPointerCapture(e.pointerId);}catch(_){}
    },{passive:false});

    canvas.addEventListener("pointerup",e=>{
        if(GAME.currentLevel!==11 || busy || finished || !ready) return;
        e.preventDefault();
        const a=pointerArrow; pointerArrow=null;
        if(a) handleTap(a);
    },{passive:false});
    canvas.addEventListener("pointercancel",()=>pointerArrow=null,{passive:true});

    Promise.all(SPRITES.map(loadImage)).then(images=>{
        if(GAME.currentLevel!==11) return;
        for(let i=0;i<arrows.length;i++) arrows[i].img=images[i];
        ready=true; draw();
    }).catch(err=>console.error("MEMORY TRAP L11 assets",err));

    levelTimeout(()=>{ if(GAME.currentLevel!==11 && raf) cancelAnimationFrame(raf); },0,11);
}

        if (
            !hd ||
            GAME.currentLevel !== 12
        ) return;

        hd = false;

        const d =
            (Date.now() - st) / 1000;

        b.style.background =
            "#246bff";

        b.textContent =
            "SEGURE";

        if (
            d >= 1.8 &&
            d <= 2.2
        ) {
            completeLevel();
        } else {
            failLevel();
        }
    };

    b.addEventListener(
        "pointerup",
        rel
    );

    b.addEventListener(
        "pointercancel",
        rel
    );

    w.appendChild(b);

    DOM.levelContent.appendChild(w);
}


/* ============================================================
   NÍVEL 13
   ============================================================ */

function renderLevel13() {

    DOM.levelQuestion.textContent =
        "Toque no momento exato do pulso.";

    const w =
        document.createElement("div");

    w.style.cssText =
        "display:flex;flex-direction:column;align-items:center;gap:25px";

    const t =
        document.createElement("div");

    t.className =
        "rhythm-target-13";

    const p =
        document.createElement("div");

    p.className =
        "rhythm-pulse-13";

    t.appendChild(p);

    const a =
        document.createElement("button");

    a.className =
        "blue-choice";

    a.style.width =
        "180px";

    a.textContent =
        "APERTAR";

    a.addEventListener(
        "pointerup",
        () => {

            if (GAME.currentLevel !== 13) return;

            const e =
                Date.now() % 1200;

            if (
                e >= 450 &&
                e <= 750
            ) {
                completeLevel();
            } else {
                failLevel();
            }
        }
    );

    w.appendChild(t);
    w.appendChild(a);

    DOM.levelContent.appendChild(w);
}


/* ============================================================
   NÍVEL 14
   ============================================================ */

function renderLevel14() {

    DOM.levelQuestion.textContent =
        "Memorize e toque na ordem REVERSA.";

    const w =
        document.createElement("div");

    w.className =
        "reverse-grid-14";

    const seq = [
        0,
        2,
        3,
        1
    ];

    const btns = [];

    for (let i = 0; i < 4; i++) {

        const b =
            document.createElement("button");

        b.className =
            "rev-btn-14";

        b.textContent =
            i + 1;

        btns.push(b);

        w.appendChild(b);
    }

    DOM.levelContent.appendChild(w);

    GAME.state.revSeq =
        [...seq].reverse();

    GAME.state.revIdx =
        0;

    seq.forEach((id, s) => {

        levelTimeout(
            () => {

                if (GAME.currentLevel !== 14) return;

                btns[id].classList.add(
                    "lit"
                );

                levelTimeout(
                    () => {

                        if (
                            GAME.currentLevel !== 14
                        ) return;

                        btns[id].classList.remove(
                            "lit"
                        );

                    },
                    400,
                    14
                );

            },
            (s + 1) * 700,
            14
        );
    });

    levelTimeout(
        () => {

            if (GAME.currentLevel !== 14) return;

            DOM.levelQuestion.textContent =
                "Toque de trás para frente!";

            btns.forEach((b, i) => {

                b.addEventListener(
                    "pointerup",
                    () => {

                        if (
                            GAME.currentLevel !== 14
                        ) return;

                        if (
                            i !==
                            GAME.state.revSeq[
                                GAME.state.revIdx
                            ]
                        ) {

                            failLevel();

                            return;
                        }

                        b.classList.add(
                            "lit"
                        );

                        feedbackCorrect();

                        GAME.state.revIdx++;

                        if (
                            GAME.state.revIdx >=
                            GAME.state.revSeq.length
                        ) {
                            completeLevel();
                        }
                    }
                );
            });

        },
        3600,
        14
    );
}


/* ============================================================
   NÍVEL 15
   ============================================================ */

function renderLevel15() {

    DOM.levelQuestion.textContent =
        "Encontre a saída secreta.";

    const w =
        document.createElement("div");

    w.className =
        "blind-pixel-area-15";

    const p =
        document.createElement("div");

    p.className =
        "blind-pixel-15";

    w.appendChild(p);

    DOM.levelContent.appendChild(w);

    p.addEventListener(
        "pointerup",
        () => {

            if (GAME.currentLevel !== 15) return;

        }
    );
}


/* ============================================================
   NÍVEL 16
   ============================================================ */

function renderLevel16() {

    DOM.levelQuestion.textContent =
        "Arraste o botão para fora da tela.";

    const w =
        document.createElement("div");

    w.style.cssText =
        "position:absolute;inset:0";

    const b =
        document.createElement("button");

    b.className =
        "drag-out-btn-16";

    b.textContent =
        "ARRASTE-ME";

    b.style.left =
        "calc(50% - 70px)";

    b.style.top =
        "calc(50% - 30px)";

    w.appendChild(b);

    DOM.levelContent.appendChild(w);

    b.addEventListener(
        "pointerdown",
        e => {

            if (GAME.currentLevel !== 16) return;

            b.setPointerCapture(
                e.pointerId
            );

            const sx =
                e.clientX;

            const sy =
                e.clientY;

            const r =
                b.getBoundingClientRect();

            const mv = em => {

                if (GAME.currentLevel !== 16) return;

                b.style.left =
                    (
                        r.left +
                        (em.clientX - sx)
                    ) + "px";

                b.style.top =
                    (
                        r.top +
                        (em.clientY - sy)
                    ) + "px";
            };

            const up = em => {

                b.releasePointerCapture(
                    em.pointerId
                );

                b.removeEventListener(
                    "pointermove",
                    mv
                );

                b.removeEventListener(
                    "pointerup",
                    up
                );

                if (GAME.currentLevel !== 16) return;

                const cur =
                    b.getBoundingClientRect();

                if (
                    cur.left < 10 ||
                    cur.right >
                        window.innerWidth - 10 ||
                    cur.top < 50 ||
                    cur.bottom >
                        window.innerHeight - 10
                ) {

                    completeLevel();

                } else {

                    b.style.left =
                        "calc(50% - 70px)";

                    b.style.top =
                        "calc(50% - 30px)";
                }
            };

            b.addEventListener(
                "pointermove",
                mv
            );

            b.addEventListener(
                "pointerup",
                up
            );
        }
    );
}


/* ============================================================
   NÍVEL 17
   ============================================================ */

function renderLevel17() {

    DOM.levelQuestion.textContent =
        "Toque apenas nos círculos.";

    const w =
        document.createElement("div");

    w.className =
        "exclusion-field-17";

    /*
     * O nível possui exatamente 3 círculos.
     */
    let left = 3;

    const items = [
        { t:"circle", x:30,  y:40 },
        { t:"square", x:120, y:70 },
        { t:"circle", x:220, y:30 },
        { t:"square", x:80,  y:160 },
        { t:"circle", x:260, y:180 }
    ];

    items.forEach(it => {

        const e =
            document.createElement("div");

        e.className =
            "exc-item " +
            (
                it.t === "circle"
                    ? "exc-circle"
                    : "exc-square"
            );

        e.style.left =
            it.x + "px";

        e.style.top =
            it.y + "px";

        w.appendChild(e);

        e.addEventListener(
            "pointerup",
            () => {

                if (GAME.currentLevel !== 17) return;

                if (
                    it.t === "square"
                ) {

                    failLevel();

                } else if (
                    e.dataset.clicked !== "true"
                ) {

                    e.dataset.clicked =
                        "true";

                    e.style.display =
                        "none";

                    left--;

                    feedbackCorrect();

                    if (left === 0) {
                        completeLevel();
                    }
                }
            }
        );
    });

    DOM.levelContent.appendChild(w);
}


/* ============================================================
   NÍVEL 18
   ============================================================ */

function renderLevel18() {

    DOM.levelQuestion.textContent =
        "Toque no botão fujão.";

    const w =
        document.createElement("div");

    w.style.cssText =
        "position:absolute;inset:0";

    const b =
        document.createElement("button");

    b.className =
        "escaping-btn-18";

    b.textContent =
        "PEGUE-ME";

    b.style.left =
        "calc(50% - 65px)";

    b.style.top =
        "calc(50% - 30px)";

    w.appendChild(b);

    DOM.levelContent.appendChild(w);

    let esc = 0;

    b.addEventListener(
        "pointerdown",
        e => {

            e.preventDefault();

            if (GAME.currentLevel !== 18) return;

            esc++;

            if (esc >= 3) {
                completeLevel();
            } else {
                flee();
            }
        }
    );

    function flee() {

        const maxX =
            Math.max(
                0,
                window.innerWidth - 150
            );

        const maxY =
            Math.max(
                80,
                window.innerHeight - 200
            );

        b.style.left =
            Math.random() *
            maxX +
            "px";

        b.style.top =
            (
                Math.random() *
                (maxY - 80) +
                80
            ) + "px";
    }
}


/* ============================================================
   NÍVEL 19
   ============================================================ */

function renderLevel19() {

    DOM.levelQuestion.textContent =
        "Encontre o caractere diferente.";

    const w =
        document.createElement("div");

    w.className =
        "intruder-grid-19";

    const ti =
        Math.floor(
            Math.random() * 25
        );

    for (let i = 0; i < 25; i++) {

        const c =
            document.createElement("button");

        c.className =
            "intruder-cell";

        c.textContent =
            i === ti
                ? "X"
                : "O";

        w.appendChild(c);

        c.addEventListener(
            "pointerup",
            () => {

                if (GAME.currentLevel !== 19) return;

                if (i === ti)
                    completeLevel();
                else
                    failLevel();
            }
        );
    }

    DOM.levelContent.appendChild(w);
}


/* ============================================================
   NÍVEL 20
   ============================================================ */

function renderLevel20() {

    DOM.levelQuestion.textContent =
        "Qual era a forma do Nível 1?";

    const w =
        document.createElement("div");

    w.className =
        "recall-grid-20";

    for (let i = 0; i < 4; i++) {

        const b =
            document.createElement("button");

        b.className =
            "recall-shape-btn";

        const s =
            document.createElement("div");

        s.className =
            "recall-mini-shape";

        if (i === 1) {

            s.style.clipPath =
                "polygon(" +
                "0% 0%,100% 0%,100% 50%," +
                "82% 100%,65% 60%,50% 95%," +
                "35% 60%,18% 100%,0% 50%" +
                ")";

        } else if (i === 0) {

            s.style.clipPath =
                "polygon(" +
                "0% 0%,100% 0%,100% 100%,0% 100%" +
                ")";

        } else if (i === 2) {

            s.style.clipPath =
                "polygon(" +
                "50% 0%,100% 100%,0% 100%" +
                ")";

        } else {

            s.style.clipPath =
                "polygon(" +
                "0% 20%,100% 0%,100% 80%,0% 100%" +
                ")";
        }

        b.appendChild(s);
        w.appendChild(b);

        b.addEventListener(
            "pointerup",
            () => {

                if (GAME.currentLevel !== 20) return;

                if (i === 1)
                    completeLevel();
                else
                    failLevel();
            }
        );
    }

    DOM.levelContent.appendChild(w);
}


/* ============================================================
   NÍVEIS NÃO IMPLEMENTADOS
   ============================================================ */

function renderUnimplementedLevel(n, l) {

    const w =
        document.createElement("div");

    w.style.cssText =

    w.innerHTML = `
        <div>${l.name}</div>

            style="

            "

            MECÂNICA RESERVADA
        </div>

        <button

                display:block;
                width:180px;
                margin:30px auto 0
            "
        >
            TESTAR
        </button>
    `;

    DOM.levelContent.appendChild(w);

    w.querySelector("button")
        .addEventListener(
            "pointerup",
            () => {

                if (

                completeLevel();
            }
        );
}


/* ============================================================
   FINAL DO JOGO
   ============================================================ */

function finishGame() {

    clearLevelTimers();

    GAME.finished = true;

    showOverlay(
        "PARABÉNS",
        "Você concluiu o MEMORY TRAP!",
        "REINICIAR",
        () => {

            GAME.finished = false;

            closeOverlay();

            goHome();
        }
    );
}


/* ============================================================
   CONFIGURAÇÕES
   ============================================================ */

function updateSettingsUI() {

    DOM.soundButton.textContent =
        CONFIG.SOUND_ENABLED
            ? "ON"
            : "OFF";

    DOM.vibrationButton.textContent =
        CONFIG.VIBRATION_ENABLED
            ? "ON"
            : "OFF";
}

DOM.soundButton.addEventListener(
    "pointerup",
    () => {

        CONFIG.SOUND_ENABLED =
            !CONFIG.SOUND_ENABLED;

        updateSettingsUI();
    }
);

DOM.vibrationButton.addEventListener(
    "pointerup",
    () => {

        CONFIG.VIBRATION_ENABLED =
            !CONFIG.VIBRATION_ENABLED;

        updateSettingsUI();
    }
);

DOM.startButton.addEventListener(
    "pointerup",
    startGame
);

DOM.menuButton.addEventListener(
    "pointerup",
    () => {

        clearLevelTimers();

        showScreen(
            DOM.settingsScreen
        );
    }
);

DOM.backButton.addEventListener(
    "pointerup",
    () => {

        clearLevelTimers();

        showScreen(
            DOM.homeScreen
        );

        startHallAnimation();
    }
);


/* ============================================================
   PROTEÇÕES DE TOQUE
   ============================================================ */

document.addEventListener(
    "contextmenu",
    e => e.preventDefault()
);

document.addEventListener(
    "touchmove",
    e => {

        if (e.cancelable) {
            e.preventDefault();
        }

    },
    { passive: false }
);


/* ============================================================
   INIT
   ============================================================ */

function init() {

    updateLives();
    renderHall();
    updateSettingsUI();
    startHallAnimation();
}

init();
</script>
