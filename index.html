<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,

               maximum-scale=1,
               user-scalable=no,
               viewport-fit=cover">

<meta name="theme-color" content="#000000">

<title>MEMORY TRAP</title>

<style>
/* ============================================================
   MEMORY TRAP
   CSS — BASE VISUAL
   ============================================================ */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    color: #fff;
    font-family:
        Arial,
        Helvetica,
        sans-serif;
    touch-action: none;
}

body {
    position: fixed;
    inset: 0;
}

button {
    font: inherit;
    color: inherit;
    border: 0;
    outline: 0;
    background: none;
    touch-action: none;
}

#app {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

/* ============================================================
   TELAS
   ============================================================ */

.screen {
    position: absolute;
    inset: 0;
    display: none;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

.screen.active {
    display: flex;
}

/* ============================================================
   HOME
   ============================================================ */

#homeScreen {
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding:
        calc(env(safe-area-inset-top) + 28px)
        22px
        calc(env(safe-area-inset-bottom) + 20px);
}

.logo {
    text-align: center;
    line-height: .82;
    margin-top: 10px;
    pointer-events: none;
}

.logo-main {
    display: block;
    font-size: clamp(46px, 15vw, 88px);
    font-weight: 900;
    letter-spacing: .10em;
}

.logo-sub {
    display: block;
    margin-top: 12px;
    font-size: clamp(18px, 5vw, 30px);
    font-weight: 700;
    letter-spacing: .45em;
    padding-left: .45em;
}

.logo-line {
    width: min(280px, 70vw);
    height: 1px;
    margin: 20px auto 0;
    background: rgba(255,255,255,.45);
}

/* ============================================================
   VIDAS
   ============================================================ */

.lives {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
}

.home-lives {
    margin-top: 32px;
}

.heart {
    position: relative;
    width: 22px;
    height: 22px;
    transform: rotate(-45deg);
    border-radius: 3px;
    background: #fff;
}

.heart::before,
.heart::after {
    content: "";
    position: absolute;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #fff;
}

.heart::before {
    top: -11px;
    left: 0;
}

.heart::after {
    top: 0;
    left: 11px;
}

.heart.empty {
    background: #202020;
}

.heart.empty::before,
.heart.empty::after {
    background: #202020;
}

/* ============================================================
   BOTÃO PRINCIPAL
   ============================================================ */

.start-button {
    position: relative;
    width: min(330px, 84vw);
    min-height: 82px;
    margin-top: 42px;
    padding: 18px 28px;
    border: 1px solid rgba(255,255,255,.75);
    border-radius: 4px;
    background: #050505;
    overflow: hidden;
}

.start-button::before {
    content: "";
    position: absolute;
    inset: -100%;
    background: linear-gradient(
        120deg,
        transparent 42%,
        rgba(255,255,255,.12) 50%,
        transparent 58%
    );
    animation: buttonShine 4s linear infinite;
}

.start-button:active {
    transform: scale(.97);
}

.start-title {
    position: relative;
    display: block;
    font-size: 27px;
    font-weight: 900;
    letter-spacing: .15em;
}

.start-subtitle {
    position: relative;
    display: block;
    margin-top: 7px;
    font-size: 11px;
    letter-spacing: .25em;
    opacity: .55;
}

@keyframes buttonShine {
    0% {
        transform: translate(-30%, -30%);
    }

    100% {
        transform: translate(30%, 30%);
    }
}

/* ============================================================
   HALL
   ============================================================ */

.hall {
    position: relative;
    width: min(390px, 92vw);
    height: 190px;
    margin-top: 35px;
    overflow: hidden;
    border-top: 1px solid rgba(255,255,255,.12);
    border-bottom: 1px solid rgba(255,255,255,.12);
}

.hall-title {
    position: absolute;
    top: 12px;
    left: 0;
    right: 0;
    z-index: 3;
    text-align: center;
    font-size: 11px;
    letter-spacing: .28em;
    opacity: .5;
}

.hall-mask {
    position: absolute;
    inset: 0;
    overflow: hidden;
    padding-top: 38px;
}

.hall-list {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    transform: translateY(0);
}

.hall-name {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: .12em;
    white-space: nowrap;
    opacity: .82;
}

.hall-empty {
    margin-top: 48px;
    font-size: 12px;
    letter-spacing: .18em;
    opacity: .28;
}

/* ============================================================
   MENU SECUNDÁRIO
   ============================================================ */

.home-menu {
    position: absolute;
    right: 20px;
    bottom: calc(env(safe-area-inset-bottom) + 20px);
    width: 48px;
    height: 48px;
    border: 1px solid rgba(255,255,255,.22);
    border-radius: 50%;
    font-size: 22px;
    opacity: .7;
}

.home-menu:active {
    transform: scale(.9);
}

/* ============================================================
   GAME SCREEN
   ============================================================ */

#gameScreen {
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    background: #000;
}

.game-header {
    position: absolute;
    top: calc(env(safe-area-inset-top) + 18px);
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    z-index: 20;
}

.level-number {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: .15em;
}

.level-content {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding:
        80px
        20px
        100px;
}

/* ============================================================
   VIDAS NO JOGO
   ============================================================ */

.game-lives {
    position: absolute;
    left: 0;
    right: 0;
    bottom: calc(env(safe-area-inset-bottom) + 20px);
    z-index: 30;
}

/* ============================================================
   TEXTOS
   ============================================================ */

.level-question {
    width: 100%;
    text-align: center;
    font-size: clamp(19px, 5vw, 27px);
    font-weight: 700;
    line-height: 1.35;
}

.small-text {
    font-size: 12px;
    opacity: .5;
    letter-spacing: .12em;
}

/* ============================================================
   OPÇÕES
   ============================================================ */

.options {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
    width: min(360px, 90vw);
    margin-top: 25px;
}

.choice {
    min-height: 64px;
    border: 1px solid rgba(255,255,255,.45);
    background: #050505;
    border-radius: 3px;
    font-size: 18px;
    font-weight: 700;
}

.choice:active {
    transform: scale(.95);
    background: #151515;
}

/* ============================================================
   NÍVEL 1
   ============================================================ */

.broken-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
}

.broken-shape {
    position: relative;
    width: 150px;
    height: 150px;
    margin-bottom: 35px;
}

.broken-square {
    position: absolute;
    width: 75px;
    height: 75px;
    border: 3px solid #fff;
}

.bs1 {
    top: 0;
    left: 0;
}

.bs2 {
    top: 0;
    right: 0;
}

.bs3 {
    bottom: 0;
    left: 0;
}

.bs4 {
    bottom: 0;
    right: 0;
}

.bs-missing {
    position: absolute;
    width: 75px;
    height: 75px;
    top: 37.5px;
    left: 37.5px;
}

/* ============================================================
   NÍVEL 2
   ============================================================ */

.grid2 {
    display: grid;
    grid-template-columns: repeat(2, 75px);
    grid-template-rows: repeat(2, 75px);
    gap: 5px;
}

.blue-block {
    background: #246bff;
    border-radius: 2px;
}

/* ============================================================
   NÍVEL 5
   ============================================================ */

.circle-field {
    position: relative;
    width: min(350px, 90vw);
    height: 270px;
}

.target-circle,
.target-square,
.target-rect {
    position: absolute;
}

.target-circle {
    border-radius: 50%;
    background: #fff;
}

.target-square {
    background: #fff;
}

.target-rect {
    background: #fff;
}

/* ============================================================
   NÍVEL 6
   ============================================================ */

.appear-circle {
    position: absolute;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: #fff;
}

/* ============================================================
   NÍVEL 8
   ============================================================ */

.color-memory {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.color-sequence {
    display: flex;
    gap: 8px;
    margin-bottom: 35px;
}

.color-box {
    width: 36px;
    height: 36px;
    border-radius: 3px;
}

.color-red { background: #ff3030; }
.color-blue { background: #3080ff; }
.color-green { background: #35c96b; }
.color-yellow { background: #ffd83d; }
.color-purple { background: #9c55ff; }
.color-orange { background: #ff8a30; }
.color-white { background: #fff; }

.color-options {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    width: min(340px, 90vw);
}

.color-option {
    height: 58px;
    border: 1px solid rgba(255,255,255,.2);
    border-radius: 3px;
}

/* ============================================================
   NÍVEL 9
   ============================================================ */

.arrow-memory {
    display: flex;
    gap: 18px;
    align-items: center;
    justify-content: center;
}

.memory-arrow {
    font-size: 45px;
    font-weight: 900;
}

/* ============================================================
   NÍVEL 10
   ============================================================ */

.camouflage-area {
    position: relative;
    width: min(360px, 90vw);
    min-height: 240px;
}

.fake-button {
    position: absolute;
    width: 120px;
    height: 55px;
    border: 1px solid #151515;
    color: #101010;
    background: #050505;
}

.hidden-real-button {
    position: absolute;
    color: #090909;
    background: #000;
    font-size: 16px;
}

/* ============================================================
   TRANSIÇÕES
   ============================================================ */

.fade-out {
    animation: fadeOut .22s ease forwards;
}

.fade-in {
    animation: fadeIn .25s ease forwards;
}

@keyframes fadeOut {
    from { opacity: 1; }
    to { opacity: 0; }
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

/* ============================================================
   OVERLAY
   ============================================================ */

#overlay {
    position: absolute;
    inset: 0;
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
    background: #000;
}

#overlay.active {
    display: flex;
}

.overlay-content {
    width: min(350px, 88vw);
    text-align: center;
}

.overlay-title {
    font-size: 30px;
    font-weight: 900;
    letter-spacing: .1em;
}

.overlay-text {
    margin-top: 15px;
    font-size: 14px;
    line-height: 1.5;
    opacity: .7;
}

.overlay-button {
    margin-top: 28px;
    padding: 15px 28px;
    border: 1px solid rgba(255,255,255,.5);
}

/* ============================================================
   SETTINGS
   ============================================================ */

#settingsScreen {
    flex-direction: column;
    align-items: center;
    padding:
        calc(env(safe-area-inset-top) + 40px)
        25px
        calc(env(safe-area-inset-bottom) + 25px);
}

.settings-title {
    font-size: 25px;
    font-weight: 900;
    letter-spacing: .15em;
}

.setting-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: min(360px, 90vw);
    margin-top: 25px;
    padding: 18px 0;
    border-bottom: 1px solid rgba(255,255,255,.12);
}

.setting-button {
    min-width: 70px;
    padding: 9px 15px;
    border: 1px solid rgba(255,255,255,.3);
}

.back-button {
    position: absolute;
    left: 20px;
    top: calc(env(safe-area-inset-top) + 20px);
    padding: 10px;
    opacity: .6;
}

/* ============================================================
   RESPONSIVIDADE
   ============================================================ */

@media (max-height: 650px) {
    .logo-main {
        font-size: 45px;
    }

    .home-lives {
        margin-top: 20px;
    }

    .start-button {
        margin-top: 25px;
    }

    .hall {
        margin-top: 20px;
        height: 140px;
    }
}
</style>
</head>

/* ============================================================
   SOM
   ============================================================ */

let audioContext = null;


function getAudioContext() {

    if (!audioContext) {

        const AudioCtx =
            window.AudioContext ||
            window.webkitAudioContext;

        if (!AudioCtx) {
            return null;
        }

        audioContext = new AudioCtx();
    }

    return audioContext;
}


function playTone(
    frequency,
    duration,
    type = "sine",
    volume = 0.035
) {

    if (!CONFIG.SOUND_ENABLED) {
        return;
    }

    const ctx = getAudioContext();

    if (!ctx) {
        return;
    }

    if (ctx.state === "suspended") {
        ctx.resume().catch(() => {});
    }

    const oscillator =
        ctx.createOscillator();

    const gain =
        ctx.createGain();

    oscillator.type = type;

    oscillator.frequency.setValueAtTime(
        frequency,
        ctx.currentTime
    );

    gain.gain.setValueAtTime(
        volume,
        ctx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        0.001,
        ctx.currentTime + duration
    );

    oscillator.connect(gain);
    gain.connect(ctx.destination);

    oscillator.start();

    oscillator.stop(
        ctx.currentTime + duration
    );
}


function soundCorrect() {

    playTone(720, .08, "sine", .035);

    setTimeout(() => {
        playTone(960, .07, "sine", .025);
    }, 45);
}


function soundError() {

    playTone(130, .15, "square", .04);
}


function soundLifeLost() {

    playTone(95, .25, "sawtooth", .05);
}


function soundCheckpoint() {

    playTone(330, .12);
    setTimeout(() => playTone(440, .12), 120);
    setTimeout(() => playTone(660, .2), 240);
}


function soundVictory() {

    const notes = [
        392,
        494,
        587,
        784
    ];

    notes.forEach((note, index) => {

        setTimeout(() => {
            playTone(
                note,
                .25,
                "sine",
                .045
            );
        }, index * 150);

    });
}

function vibrate(pattern) {

    if (!CONFIG.VIBRATION_ENABLED) {
        return;
    }

    if (!("vibrate" in navigator)) {
        return;
    }

    try {
        navigator.vibrate(pattern);
    } catch (error) {
        /* dispositivo não suporta */
    }
}


function feedbackCorrect() {

    soundCorrect();
    vibrate(18);
}


function feedbackError() {

    soundError();
    vibrate(45);
}

    vibrate([60, 40, 80]);
}

/* ============================================================
   HALL DOS SOBREVIVENTES
   ============================================================ */

function getSurvivors() {

    try {

        const raw =
            localStorage.getItem(
                CONFIG.SURVIVORS_KEY
            );

        if (!raw) {
            return [];
        }

        const parsed = JSON.parse(raw);

        return Array.isArray(parsed)
            ? parsed
            : [];

    } catch {
        return [];
    }
}


function saveSurvivor(name, stats) {

    const survivors =
        getSurvivors();

    survivors.push({
        name,
        attempts: stats.attempts,
        mistakes: stats.mistakes,
        time: stats.time,
        date: Date.now()
    });

    localStorage.setItem(
        CONFIG.SURVIVORS_KEY,
        JSON.stringify(survivors)
    );

    renderHall();
}


function renderHall() {

    const survivors =
        getSurvivors();

    DOM.hallList.innerHTML = "";

    if (survivors.length === 0) {

        const empty =
            document.createElement("div");

        empty.className = "hall-empty";

        empty.textContent =
            "NINGUM SOBREVIVEU AINDA";

        DOM.hallList.appendChild(empty);

        return;
    }

    survivors
        .slice(-20)
        .reverse()
        .forEach(player => {

            const name =
                document.createElement("div");

            name.className = "hall-name";

            name.textContent =
                String(player.name)
                    .slice(0, 20)
                    .toUpperCase();

            DOM.hallList.appendChild(name);

        });
}


let hallAnimationFrame = null;
let hallPosition = 0;


function startHallAnimation() {

    if (hallAnimationFrame) {
        cancelAnimationFrame(
            hallAnimationFrame
        );
    }

    hallPosition = 0;

    function animate() {

        if (
            !DOM.homeScreen.classList.contains(
                "active"
            )
        ) {
            return;
        }

        const height =
            DOM.hallList.offsetHeight;

        const visible =
            DOM.hallList.parentElement
                .offsetHeight;

        if (height > visible) {

            hallPosition += 0.18;

            if (
                hallPosition >
                height - visible + 30
            ) {
                hallPosition = 0;
            }

            DOM.hallList.style.transform =
                `translateY(-${hallPosition}px)`;
        }

        hallAnimationFrame =
            requestAnimationFrame(
                animate
            );
    }

    animate();
}

function startGame() {

    clearLevelTimers();

    GAME.currentLevel = 1;

    GAME.lives =
        CONFIG.STARTING_LIVES;

    GAME.totalAttempts = 0;

    GAME.mistakes = 0;

    GAME.levelAttempts = 0;

    GAME.startedAt =
        Date.now();

    GAME.finished = false;

    updateLives();

    showScreen(DOM.gameScreen);

    loadLevel(1);
}


/* ============================================================
   CARREGAR NÍVEL
   ============================================================ */

function loadLevel(levelNumber) {

    clearLevelTimers();

    GAME.currentLevel =
        levelNumber;

    GAME.levelStartedAt =
        Date.now();

    GAME.levelAttempts = 0;

    GAME.sequenceIndex = 0;

    GAME.state = {};

    const level =
        LEVELS[levelNumber];

    if (!level) {
        return;
    }

    if (level.hiddenNumber) {
        DOM.levelNumber.textContent = "";
    } else {
        DOM.levelNumber.textContent =
            levelNumber;
    }

    DOM.levelContent.innerHTML = "";

    renderLevel(
        levelNumber,
        level
    );

    updateLives();
}


/* ============================================================
   ERRO
   ============================================================ */

function failLevel() {

    if (GAME.finished) {
        return;
    }

    GAME.levelAttempts++;

    GAME.totalAttempts++;

    GAME.mistakes++;

    GAME.lives--;

    feedbackLifeLost();

    updateLives();

    if (GAME.lives <= 0) {

        clearLevelTimers();

        showOverlay(
            "SEM VIDAS",
            "Você perdeu as 5 vidas. O nível será reiniciado.",
            "RECOMEÇAR",
            () => {

                GAME.lives =
                    CONFIG.STARTING_LIVES;

                updateLives();

                closeOverlay();

                loadLevel(
                    GAME.currentLevel
                );

            }
        );

        return;
    }

    showOverlay(
        "ERRO",
        "Você continua no mesmo nível.",
        "TENTAR NOVAMENTE",
        () => {

            closeOverlay();

            loadLevel(
                GAME.currentLevel
            );

        }
    );
}


/* ============================================================
   ACERTO
   ============================================================ */

function completeLevel() {

    if (GAME.finished) {
        return;
    }

    feedbackCorrect();

    const next =
        GAME.currentLevel + 1;

    if (
        GAME.currentLevel ===
        CONFIG.TOTAL_LEVELS
    ) {

        finishGame();

        return;
    }

    setTimeout(() => {
        loadLevel(next);
    }, 180);
}

                box
            );
        }
    );

    wrap.appendChild(
        sequenceElement
    );

    const question =
        document.createElement("div");

    question.className =
        "level-question";

    question.textContent =
        "Memorize a sequência.";

    wrap.appendChild(
        question
    );

    const options =
        document.createElement("div");

    options.className =
        "color-options";

    shuffled.forEach(
        color => {

            const button =
                document.createElement("button");

            button.className =
                `color-option ${colors[color]}`;

            button.dataset.color =
                color;

            options.appendChild(
                button
            );
        }
    );

    wrap.appendChild(options);

    DOM.levelContent.appendChild(
        wrap
    );

    GAME.state.colorSequence =
        sequence;

    GAME.state.colorIndex = 0;

    setTimeout(() => {

        sequenceElement.style.opacity =
            "0";

        question.textContent =
            "Repita a sequência.";

    }, 5000);

    options
        .querySelectorAll(".color-option")
        .forEach(button => {

            button.addEventListener(
                "pointerup",
                () => {

                    const expected =
                        GAME.state.colorSequence[
                            GAME.state.colorIndex
                        ];

                    const selected =
                        button.dataset.color;

                    if (
                        selected !==
                        expected
                    ) {

                        failLevel();

                        return;
                    }

                    GAME.state.colorIndex++;

                    if (
                        GAME.state.colorIndex >=
                        GAME.state.colorSequence.length
                    ) {
                        completeLevel();
                    } else {
                        feedbackCorrect();
                    }

                }
            );

        });
}


/* ============================================================
   NÍVEL 9
   ESPECIAL — PADRÃO BASE
   ============================================================ */

function renderLevel9() {

    const sequence = [
        "↑",
        "→",

    ];

    const wrap =
        document.createElement("div");

    wrap.className =
        "arrow-memory";

}


function showArrowButtons() {

    const container =
        document.createElement("div");

    container.style.position =
        "absolute";

    container.style.inset =
        "0";

    container.style.display =
        "grid";

    container.style.gridTemplateColumns =
        "repeat(2, 90px)";

    container.style.gridTemplateRows =
        "repeat(2, 70px)";

    container.style.gap =
        "14px";

    container.style.alignItems =
        "center";

    container.style.justifyContent =
        "center";

    const arrows = [
        "↑",
        "→",
        "↓",
        "←"
    ];

    arrows.forEach(
        direction => {

            const button =
                document.createElement("button");

            button.className =
                "choice";

            button.textContent =
                direction;

            container.appendChild(
                button
            );

            button.addEventListener(
                "pointerup",
                () => {

                    const expected =
                        GAME.state.arrowSequence[
                            GAME.state.arrowIndex
                        ];

                    if (
                        direction !==
                        expected
                    ) {

                        failLevel();

                        return;
                    }

                    GAME.state.arrowIndex++;

                    if (
                        GAME.state.arrowIndex >=
                        GAME.state.arrowSequence.length
                    ) {
                        completeLevel();
                    } else {
                        feedbackCorrect();
                    }

                }
            );

        }
    );

    DOM.levelContent.appendChild(
        container
    );
}

/* ============================================================
   ESCAPE HTML
   ============================================================ */

function escapeHTML(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


/* ============================================================
   NÍVEL 50 — CHECKPOINT
   ============================================================ */

function handleCheckpoint() {

    if (GAME.lives !== 5) {

        soundError();
        vibrate([100, 50, 100]);

        showOverlay(
            "PORTÃO CRUEL",
            "Você só pode passar com 5 vidas. Você voltou para o início.",
            "VOLTAR AO INÍCIO",
            () => {

                closeOverlay();

                GAME.lives =
                    CONFIG.STARTING_LIVES;

                GAME.currentLevel = 1;

                updateLives();

                loadLevel(1);

            }
        );

        return;
    }

    soundCheckpoint();

    showOverlay(
        "PORTÃO CRUEL",
        "Você chegou com 5 vidas. Agora prove que realmente memorizou.",
        "CONTINUAR",
        () => {

            closeOverlay();

            completeLevel();

        }
    );
}


/* ============================================================
   FINAL
   ============================================================ */

function finishGame() {

    clearLevelTimers();

    GAME.finished = true;

    soundVictory();

    vibrate([
        80,
        60,
        80,
        60,
        180
    ]);

    const elapsed =
        Date.now() -
        GAME.startedAt;

    const seconds =
        Math.floor(
            elapsed / 1000
        );

    showOverlay(
        "VOCÊ ESCAPOU",
        `MEMORY TRAP concluído. Tempo: ${formatTime(seconds)}. Tentativas: ${GAME.totalAttempts}.`,
        "SALVAR NO HALL",
        () => {

            closeOverlay();

            askForName(
                seconds
            );

        }
    );
}


function formatTime(seconds) {

    const hours =
        Math.floor(seconds / 3600);

    const minutes =
        Math.floor(
            (seconds % 3600) / 60
        );

    const secs =
        seconds % 60;

    if (hours > 0) {

        return `${hours}h ${String(minutes).padStart(2,"0")}m`;

    }

    return `${String(minutes).padStart(2,"0")}:${String(secs).padStart(2,"0")}`;
}


/* ============================================================
   NOME DO SOBREVIVENTE
   ============================================================ */

function askForName(seconds) {

    /*
       A digitação só existe aqui,
       depois que o jogo terminou.

       Não existe teclado durante
       nenhum dos níveis.
    */

    const name =
        window.prompt(
            "Você sobreviveu.\n\nDigite seu nome para entrar no Hall dos Sobreviventes:"
        );

    if (
        name &&
        name.trim().length > 0
    ) {

        saveSurvivor(
            name.trim(),
            {
                attempts:
                    GAME.totalAttempts,

                mistakes:
                    GAME.mistakes,

                time:
                    seconds
            }
        );

    }

    goHome();
}


/* ============================================================
   CONFIGURAÇÕES
   ============================================================ */

function updateSettingsUI() {

    DOM.soundButton.textContent =
        CONFIG.SOUND_ENABLED
            ? "ON"
            : "OFF";

    DOM.vibrationButton.textContent =
        CONFIG.VIBRATION_ENABLED
            ? "ON"
            : "OFF";
}


DOM.soundButton.addEventListener(
    "pointerup",
    () => {

        CONFIG.SOUND_ENABLED =
            !CONFIG.SOUND_ENABLED;

        updateSettingsUI();

    }
);


DOM.vibrationButton.addEventListener(
    "pointerup",
    () => {

        CONFIG.VIBRATION_ENABLED =
            !CONFIG.VIBRATION_ENABLED;

        updateSettingsUI();

        if (
            CONFIG.VIBRATION_ENABLED
        ) {
            vibrate(30);
        }

    }
);


/* ============================================================
   EVENTOS PRINCIPAIS
   ============================================================ */

DOM.startButton.addEventListener(
    "pointerup",
    () => {

        const ctx =
            getAudioContext();

        if (
            ctx &&
            ctx.state === "suspended"
        ) {
            ctx.resume().catch(() => {});
        }

        startGame();

    }
);


DOM.menuButton.addEventListener(
    "pointerup",
    () => {

        showScreen(
            DOM.settingsScreen
        );

    }
);


DOM.backButton.addEventListener(
    "pointerup",
    () => {

        showScreen(
            DOM.homeScreen
        );

        startHallAnimation();

    }
);


/* ============================================================
   BLOQUEAR GESTOS INDESEJADOS
   ============================================================ */

document.addEventListener(
    "contextmenu",
    event => {
        event.preventDefault();
    }
);


document.addEventListener(
    "gesturestart",
    event => {
        event.preventDefault();
    }
);


document.addEventListener(
    "touchmove",
    event => {

        if (
            event.cancelable
        ) {
            event.preventDefault();
        }

    },
    {
        passive: false
    }
);


/* ============================================================
   INICIALIZAÇÃO
   ============================================================ */

function init() {

    GAME.lives =
        CONFIG.STARTING_LIVES;

    updateLives();

    renderHall();

    updateSettingsUI();

    startHallAnimation();
}


init();
