<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MEMORY TRAP</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Courier New",monospace;font-weight:900}
body{background:#000;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:12px}
#game{width:100%;max-width:410px;background:#000;border:4px solid #fff;padding:20px;box-shadow:8px 8px 0 #fff}
#top{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #fff;padding-bottom:10px;font-size:15px;letter-spacing:2px;margin-bottom:16px}
#levelNum{color:#444}
#lives{white-space:nowrap;font-size:14px}
#box{width:100%;min-height:340px;background:#000;border:3px solid #fff;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px;margin-bottom:16px;text-transform:uppercase;text-align:center}
.btn{width:100%;padding:16px;margin:8px 0;border:3px solid #fff;background:#fff;color:#000;font-size:18px;cursor:pointer;text-transform:uppercase;font-family:inherit;font-weight:900}
.btn:active{transform:translate(4px,4px)}
.btnB{background:#000;color:#fff}
.btnW{background:#333;color:#fff;border-color:#777}
input{width:100%;padding:14px;background:#000;color:#fff;border:3px solid #fff;font-size:20px;font-family:inherit;font-weight:900;text-transform:uppercase;outline:none;margin-bottom:10px;text-align:center}
input:focus{box-shadow:4px 4px 0 #fff}
#tapBox{width:150px;height:150px;background:#fff;border:4px solid #000;display:flex;align-items:center;justify-content:center;color:#000;font-size:22px;box-shadow:6px 6px 0 #000;cursor:pointer;user-select:none}
.shake{animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#msg{color:#777;font-size:12px;min-height:18px;text-align:center;text-transform:uppercase;letter-spacing:1px}
.swatch{width:26px;height:26px;border:2px solid #fff;display:inline-block;vertical-align:middle;margin-right:8px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.grid .btn{margin:0;padding:12px}
.big{font-size:42px;letter-spacing:3px;margin:15px 0}
.hall{width:100%;margin-top:10px;text-align:left;font-size:11px;max-height:140px;overflow-y:auto;line-height:16px}
</style>
</head>
<body>
<main id="game">
  <header id="top">
    <span id="levelNum"></span>
    <span id="lives" aria-label="vidas"></span>
  </header>
  <section id="box"></section>
  <div id="msg" aria-live="polite"></div>
</main>

<script>
"use strict";

const MAX_LIVES = 5;
const NO_NUMBER_LEVELS = [7, 27, 47, 67, 87];
const COLORS = [
  {name: "BRANCO", css: "#fff"},
  {name: "CINZA", css: "#888"},
  {name: "CLARO", css: "#ccc"},
  {name: "ESCURO", css: "#333"}
];

let level = 1, lives = 5, deaths = 0;
let memColors = [];
let timers = [];
let busy = false;
let level44Clicks = 0;

const $ = id => document.getElementById(id);

function clearTimers() { timers.forEach(clearTimeout); timers = []; busy = false; }
function later(fn, ms) { const t = setTimeout(() => { timers = timers.filter(x => x !== t); fn(); }, ms); timers.push(t); return t; }
function render() { showNum(); $("lives").textContent = "🖤".repeat(Math.max(0, lives)).replace(/🖤/g, "❤️"); }
function showNum() { $("levelNum").textContent = NO_NUMBER_LEVELS.includes(level) ? "" : "LVL " + level; }
function message(t, ms = 900) { $("msg").textContent = t; later(() => { $("msg").textContent = ""; }, ms); }

function fail(text = "ERROU") {
  $("box").classList.remove("shake"); void $("box").offsetWidth; $("box").classList.add("shake");
  if (navigator.vibrate) navigator.vibrate(200);
  message(text);
  lives--; deaths++; render();
  if (lives <= 0) {
    lives = MAX_LIVES;
    level = level < 50 ? 1 : 50;
    render(); load(); return;
  }
  if (level !== 44) load();
}

function pass() { level++; if (level > 100) win(); else load(); }

function load() {
  clearTimers(); render(); $("box").innerHTML = ""; $("box").onclick = null;

  // Marcos e Níveis Especiais da sua Ideia Original
  if (level >= 1 && level <= 6) {
    let target = COLORS[Math.floor(Math.random() * COLORS.length)];
    $("box").innerHTML = `<p style="margin-bottom:12px">TOQUE NA COR: ${target.name}</p>`;
    COLORS.forEach(c => {
      let b = document.createElement("button"); b.className = "btn btnB"; b.textContent = c.name;
      b.style.borderColor = c.css; b.style.color = c.css;
      b.onclick = () => c.name === target.name ? pass() : fail("COR ERRADA");
      $("box").appendChild(b);
    });
    return;
  }

  if (level === 7) {
    $("box").innerHTML = `<p style="margin-bottom:15px"> NÍVEL SEM NÚMERO<br>TOQUE NO BOTÃO SEGURO</p><button class="btn btnB" onclick="pass()">CONTINUAR</button>`;
    return;
  }

  if (level === 9) {
    memColors = ["BRANCO", "CINZA", "CLARO", "ESCURO", "PURO"];
    $("box").innerHTML = `<p style="margin-bottom:10px">DECORE AS 5 CORES</p>` + memColors.map((x,i)=>`<div style="margin:4px">${i+1}. ${x}</div>`).join("") + `<p style="color:#777;font-size:11px;margin-top:8px">5 SEGUNDOS</p>`;
    busy = true;
    later(() => {
      busy = false;
      $("box").innerHTML = `<p style="margin-bottom:10px">QUAL ERA A 2ª COR?</p>` + memColors.map(x=>`<button class="btn btnB" onclick="if('${x}'==='${memColors[1]}')pass();else fail('ESQUECEU')">${x}</button>`).join("");
    }, 5000);
    return;
  }

  if (level === 10) {
    $("box").innerHTML = `<p style="margin-bottom:12px">FIGURA QUEBRADA<br>QUAL É A OPÇÃO CORRETA?</p><button class="btn btnB" onclick="fail('QUASE')">[ | ]</button><button class="btn btnB" onclick="pass()">[ | | ]</button><button class="btn btnB" onclick="fail('ERRADO')">[ | - ]</button>`;
    return;
  }

  if (level === 39) {
    $("box").innerHTML = `<p style="margin-bottom:10px">MEMÓRIA LVL 9<br>QUAL ERA A 3ª COR?</p>` + memColors.map(x=>`<button class="btn btnB" onclick="if('${x}'==='${memColors[2]}')pass();else fail('ESQUECEU')">${x}</button>`).join("");
    return;
  }

  if (level === 40) {
    // Tela branca traumática
    $("box").style.background = "#fff";
    $("box").style.color = "#000";
    $("box").innerHTML = `<p style="font-size:18px;margin-bottom:10px">TOQUE NA TELA</p><p style="font-size:11px;color:#444">onde está a pegadinha?</p>`;
    $("box").onclick = () => {
      $("box").style.background = "#000";
      $("box").style.color = "#fff";
      pass();
    };
    return;
  }

  if (level === 44) { level44(); return; }
  if (level === 47) { level47(); return; }
  if (level === 49) { level49(); return; }
  if (level === 50) { gate50(); return; }
  if (level === 67) { level67(); return; }
  if (level === 87) { level87(); return; }
  if (level === 100) { level100(); return; }

  // Outros níveis intermediários baseados em puro foco visual / agilidade sem contas
  let type = level % 4;
  if (type === 0) {
    // Teste de reflexo / botão falso
    $("box").innerHTML = `<p style="margin-bottom:15px">NÃO TOQUE NO BRANCO</p><button class="btn btnW" onclick="fail('CAIU NA ARMADILHA')">OK</button><button class="btn btnB" onclick="pass()">CONTINUAR SEGURO</button>`;
  } else if (type === 1) {
    // Memória relâmpago de símbolo
    let syms = ["#", "@", "$", "%", "&"];
    let chosen = syms[Math.floor(Math.random()*syms.length)];
    $("box").innerHTML = `<p>MEMÓRIA</p><p class="big">${chosen}</p>`;
    busy = true;
    later(() => {
      busy = false;
      $("box").innerHTML = `<p style="margin-bottom:10px">QUAL SÍMBOLO APARECEU?</p>` + syms.map(s=>`<button class="btn btnB" onclick="if('${s}'==='${chosen}')pass();else fail()">[ ${s} ]</button>`).join("");
    }, 600);
  } else if (type === 2) {
    // O Intruso visual
    let correct = Math.floor(Math.random() * 4);
    $("box").innerHTML = `<p style="margin-bottom:12px">TOQUE NO DIFERENTE</p><div class="grid" id="grid"></div>`;
    for(let i=0; i<4; i++) {
      let b = document.createElement("button"); b.className = "btn btnB"; b.textContent = i === correct ? "X" : "I";
      b.onclick = () => i === correct ? pass() : fail();
      $("grid").appendChild(b);
    }
  } else {
    // Toque exato rápido
    let target = 3;
    let clicks = 0;
    $("box").innerHTML = `<p style="margin-bottom:10px">TOQUE EXATAMENTE 3 VEZES</p><div id="tapBox">TOQUE</div><p id="cnt" style="margin-top:10px">0/3</p>`;
    $("tapBox").onclick = () => {
      clicks++;
      if (clicks === 3) pass();
      else if (clicks > 3) fail("PASSOU DO PONTO");
      else $("cnt").textContent = clicks + "/3";
    };
  }
}

function level44() {
  level44Clicks = 0; busy = true;
  $("box").innerHTML = `<div id="tapBox">APERTE</div><p id="ct" style="margin-top:12px">0/5</p>`;
  $("tapBox").onclick = () => {
    if (!busy || level44Clicks >= 5) return;
    level44Clicks++;
    if (level44Clicks === 5) {
      busy = false;
      $("box").innerHTML = `<div id="waitBox" style="width:150px;height:150px;background:#333;border:4px solid #fff;display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;box-shadow:6px 6px 0 #fff;cursor:pointer">ESPERE</div><p style="margin-top:10px">5s SEM TOCAR...</p>`;
      $("waitBox").onclick = () => {
        if (busy) return;
        busy = true;
        lives--; deaths++; render(); message("PERDEU 1 VIDA ESCONDIDA", 1200);
        level = 45; load();
      };
      later(() => { if (level !== 44) return; level = 45; load(); }, 5000);
    } else {
      $("ct").textContent = level44Clicks + "/5";
    }
  };
}

function level47() {
  $("box").innerHTML = `<p style="margin-bottom:12px">QUAL NÍVEL ESTAVA SEM NÚMERO?</p><button class="btn btnB" onclick="pass()">7</button><button class="btn btnB" onclick="pass()">27</button><button class="btn btnB" onclick="fail('ERRADO')">12</button>`;
}

function level67() {
  $("box").innerHTML = `<p style="margin-bottom:12px">MAIS UM SEM NÚMERO.<br>QUAL FOI O PRIMEIRO?</p><button class="btn btnB" onclick="pass()">7</button><button class="btn btnB" onclick="fail('ERRADO')">27</button>`;
}

function level49() {
  $("box").innerHTML = `<p style="font-size:14px;margin-bottom:12px">PROVA DA MEMÓRIA</p><p style="font-size:12px;margin-bottom:8px">QUAL ERA A 3ª COR DO LVL 9?</p>` + memColors.map(x=>`<button class="btn btnB" style="padding:10px;font-size:14px" onclick="if('${x}'==='${memColors[2]}')pass();else fail('ERROU COR')">${x}</button>`).join("");
}

function gate50() {
  if (lives < 5) {
    $("box").innerHTML = `<p style="font-size:24px;margin-bottom:10px">PORTÃO FECHADO</p><p style="margin-bottom:15px">Chegou com ${lives}/5 vidas.<br>Exige 5. Volta ao LVL 1.</p><button class="btn" onclick="level=1;lives=5;load()">RECOMEÇAR</button>`;
  } else {
    $("box").innerHTML = `<p style="font-size:24px;margin-bottom:10px">PORTÃO ABERTO</p><p style="margin-bottom:15px">Checkpoint salvo!</p><button class="btn" onclick="pass()">ENTRAR</button>`;
  }
}

function level87() {
  $("box").innerHTML = `<p style="margin-bottom:10px">CHEFE DE MEMÓRIA<br><small style="color:#777">Níveis sem número</small></p><input id="ans87" placeholder="EX: 7,27,47,67"><button class="btn" onclick="val87()">ENVIAR</button>`;
}

function val87() {
  let v = $("ans87").value.replace(/\s/g, "");
  if (v === "7,27,47,67" || v === "7,27,47,67,87") pass();
  else fail("FALTOU ALGUM");
}

function level100() {
  $("box").innerHTML = `<p style="font-size:18px;margin-bottom:12px">BOSS FINAL<br>QUAL ERA A 1ª COR DO LVL 9?</p>` + memColors.map(x=>`<button class="btn btnB" onclick="if('${x}'==='${memColors[0]}')pass();else fail('NO FINAL ERROU')">${x}</button>`).join("");
}

function getHall() { try { const x = JSON.parse(localStorage.getItem("memoryTrapHall")||"[]"); return Array.isArray(x)?x:[]; }catch{return[];} }
function saveHall(code) {
  let name = ($("pname").value||"ANON").trim().toUpperCase();
  let hall = getHall(); hall.push({nome: name, mortes: deaths, codigo: code, data: new Date().toLocaleDateString("pt-BR")});
  localStorage.setItem("memoryTrapHall", JSON.stringify(hall)); renderHall(); message("SALVO NO HALL", 1200);
}
function renderHall() {
  let d = $("hallList"); if(!d)return; let h = getHall();
  d.innerHTML = `<p style="color:#fff;margin-bottom:4px">HALL DA FAMA:</p>` + (h.length ? h.slice(-15).reverse().map((x,i)=>`${i+1}. ${x.nome} — ${x.mortes}M [${x.codigo}]`).join("<br>") : "<span style='color:#777'>NENHUM REGISTRO.</span>");
}

function win() {
  clearTimers();
  let code = "TRAP-" + Math.floor(1000 + Math.random() * 9000);
  $("levelNum").innerText = "HALL";
  $("box").innerHTML = `
    <p style="font-size:22px;color:#fff;margin-bottom:6px">VOCÊ QUEBROU A TRAP</p>
    <p style="font-size:11px;color:#777;margin-bottom:10px">CÓDIGO: ${code} | MORTES: ${deaths}</p>
    <input id="pname" maxlength="20" placeholder="SEU NOME">
    <button class="btn" onclick="saveHall('${code}')">SALVAR</button>
    <div id="hallList" class="hall"></div>
    <button class="btn btnW" style="margin-top:10px;padding:10px;font-size:12px" onclick="if(confirm('Apagar Hall?')){localStorage.removeItem('memoryTrapHall');renderHall()}">RESETAR HALL</button>
  `;
  renderHall();
}

load();
</script>
</body>
</html>
