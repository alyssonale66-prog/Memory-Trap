<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>MEMORY TRAP</title>
<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
}
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
    touch-action: none;
    position: fixed;
    inset: 0;
}
button {
    font: inherit;
    color: inherit;
    border: 0;
    outline: 0;
    background: none;
    touch-action: none;
}
#app {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}
.screen {
    position: absolute;
    inset: 0;
    display: none;
    width: 100%;
    height: 100%;
    overflow: hidden;
}
.screen.active {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}
#homeScreen {
    justify-content: center;
    align-items: center;
    gap: 24px;
    padding: calc(env(safe-area-inset-top) + 25px) 20px calc(env(safe-area-inset-bottom) + 20px);
}
.logo {
    text-align: center;
    line-height: 1.1;
    pointer-events: none;
    margin: 0;
}
.logo-main {
    display: block;
    font-size: clamp(38px, 11vw, 64px);
    font-weight: 900;
    letter-spacing: .10em;
    line-height: .90;
}
.logo-sub {
    display: block;
    margin-top: 14px;
    font-size: clamp(14px, 3.8vw, 22px);
    font-weight: 700;
    letter-spacing: .55em;
    padding-left: .55em;
    line-height: 1;
}
.logo-line {
    width: min(200px, 50vw);
    height: 1px;
    margin: 18px auto 0;
    background: rgba(255,255,255,.45);
}
.lives {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
}
.heart {
    position: relative;
    width: 22px;
    height: 22px;
    transform: rotate(-45deg);
    border-radius: 3px;
    background: #ff3b30;
}
.heart::before, .heart::after {
    content: "";
    position: absolute;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #ff3b30;
}
.heart::before {
    top: -11px;
    left: 0;
}
.heart::after {
    top: 0;
    left: 11px;
}
.heart.empty, .heart.empty::before, .heart.empty::after {
    background: #333;
}
.start-button {
    position: relative;
    width: min(320px, 82vw);
    min-height: 68px;
    padding: 12px 20px;
    border: 1px solid rgba(255,255,255,.75);
    border-radius: 6px;
    background: #050505;
}
.start-title {
    display: block;
    font-size: 22px;
    font-weight: 900;
    letter-spacing: .15em;
}
.start-subtitle {
    display: block;
    margin-top: 3px;
    font-size: 10px;
    letter-spacing: .25em;
    opacity: .55;
}
.hall {
    position: relative;
    width: min(370px, 90vw);
    height: 110px;
    overflow: hidden;
    border-top: 1px solid rgba(255,255,255,.12);
    border-bottom: 1px solid rgba(255,255,255,.12);
}
.hall-title {
    position: absolute;
    top: 6px;
    left: 0;
    right: 0;
    z-index: 3;
    text-align: center;
    font-size: 10px;
    letter-spacing: .25em;
    opacity: .5;
}
.hall-mask {
    position: absolute;
    inset: 0;
    overflow: hidden;
    padding-top: 24px;
}
.hall-list {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
}
.hall-name {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .12em;
    opacity: .82;
}
.hall-empty {
    margin-top: 20px;
    font-size: 10px;
    letter-spacing: .15em;
    opacity: .28;
}
.home-menu {
    position: absolute;
    right: 20px;
    bottom: calc(env(safe-area-inset-bottom) + 10px);
    width: 40px;
    height: 40px;
    border: 1px solid rgba(255,255,255,.22);
    border-radius: 50%;
    font-size: 18px;
    opacity: .7;
}
#gameScreen {
    justify-content: flex-start;
    background: #000;
}
.game-header {
    position: relative;
    width: 100%;
    text-align: center;
    padding-top: calc(env(safe-area-inset-top) + 12px);
    z-index: 20;
}
.level-number {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: .15em;
}
.level-question {
    width: 90%;
    margin: 4px auto 0;
    text-align: center;
    font-size: clamp(14px, 3.5vw, 18px);
    font-weight: 700;
    line-height: 1.2;
}
.level-content {
    position: relative;
    width: 100%;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 5px 10px 65px;
    gap: 10px;
}
.game-lives {
    position: absolute;
    left: 0;
    right: 0;
    bottom: calc(env(safe-area-inset-bottom) + 12px);
    z-index: 30;
}
.options-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
    width: min(380px, 94vw);
    margin: 0 auto;
}
.blue-choice {
    min-height: 65px;
    background: #246bff;
    border: 1px solid rgba(255,255,255,.25);
    border-radius: 14px;
    font-size: 18px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px;
    text-align: center;
}
.broken-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    width: 100%;
    justify-content: flex-start;
    padding-top: 10px;
}
.broken-top {
    width: min(42vw, 165px);
    height: min(28vw, 110px);
    background: #246bff;
    border-radius: 8px 8px 4px 4px;
    clip-path: polygon(0% 0%, 100% 0%, 100% 52%, 88% 100%, 76% 62%, 63% 100%, 51% 60%, 37% 100%, 25% 60%, 12% 100%, 0% 52%);
    transition: all 0.3s ease;
    box-shadow: 0 0 0 1px rgba(255,255,255,.15) inset;
}
.broken-top.filled {
    clip-path: none;
}
.broken-pieces-pool {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    width: min(92vw, 360px);
    justify-items: center;
}
.puzzle-piece {
    width: min(42vw, 165px);
    height: min(28vw, 110px);
    background: #246bff;
    border-radius: 8px;
    touch-action: none;
    cursor: grab;
    transition: transform 0.38s cubic-bezier(.2,.8,.3,1.2);
    border: 1px solid rgba(255,255,255,.12);
}
.puzzle-piece.dragging {
    transition: none;
    z-index: 50;
    scale: 1.08;
    box-shadow: 0 8px 24px rgba(0,0,0,.6);
}
.puzzle-piece.wrong-shake {
    animation: shakeWrong 0.4s ease;
}
@keyframes shakeWrong {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-6px); }
    80% { transform: translateX(6px); }
}
.grid2-large {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    grid-template-rows: repeat(2, 75px);
    gap: 14px;
    width: min(380px, 94vw);
}
.shape-field-full {
    position: absolute;
    inset: 0 0 95px 0;
    pointer-events: none;
}
.geo-shape {
    position: absolute;
    background: #fff;
}
.geo-circle { border-radius: 50%; }
.geo-square { border-radius: 4px; }
.geo-rect { border-radius: 3px; }
.geo-pentagon { clip-path: polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%); }
.geo-hexagon { clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%); }
.click-circle {
    position: absolute;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: #246bff;
    border: 1.5px solid #fff;
}
.rats-wrap {
    position: relative;
    width: 260px;
    height: 260px;
    margin-bottom: 10px;
}
.orbit-center {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 10px;
    height: 10px;
    transform: translate(-5%, -5%);
    animation: spin 4s linear infinite;
}
.circling-rat {
    position: absolute;
    font-size: 26px;
    transform-origin: center;
}
@keyframes spin {
    100% { transform: translate(-50%, -50%) rotate(360deg); }
}
.question-with-rat {
    position: relative;
    display: inline-block;
    padding: 0 15px;
}
.small-hiding-rat {
    position: absolute;
    font-size: 14px;
    top: -15px;
    left: -30px;
    animation: ratArcRun 1.5s linear infinite;
}
@keyframes ratArcRun {
    0% { transform: translate(0, 15px) scale(0.6); opacity: 0; }
    50% { transform: translate(90px, -15px) scale(0.6); opacity: 1; }
    100% { transform: translate(180px, 15px) scale(0.6); opacity: 0; }
}
.color-bar-container {
    display: flex;
    justify-content: space-evenly;
    align-items: center;
    width: min(390px, 96vw);
    height: 180px;
    margin: 0 auto;
}
.color-segment {
    width: 26px;
    height: 155px;
    border-radius: 6px;
}
.c-red { background: #ff3030; }
.c-blue { background: #3080ff; }
.c-green { background: #35c96b; }
.c-yellow { background: #ffd83d; }
.c-purple { background: #9c55ff; }
.c-orange { background: #ff8a30; }
.arrow-sequence-display {
    display: flex;
    gap: 16px;
    font-size: 40px;
    font-weight: 900;
    margin: 15px 0;
}
.red-trap-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
    width: min(380px, 94vw);
}
.red-trap-btn {
    min-height: 65px;
    border: 1px solid rgba(255,255,255,.25);
    border-radius: 14px;
}

    margin: 0 auto;

.hold-btn-12 {

.hold-fill-12 {

.reverse-grid-14 {

.rev-btn-14 {

}

.doors-container-15 {

.door-btn-15 {

.exclusion-field-17 {

}
.exc-item {
    position: absolute;
    display: flex;
    align-items: center;

}
.exc-circle {
    width: 40px;
    height: 40px;

}
.exc-square {
    width: 40px;
    height: 40px;
    border-radius: 6px;
    background: #ff3b30;
}
.escaping-btn-18 {
    width: 130px;
    height: 60px;
    background: #246bff;
    border-radius: 12px;

    position: absolute;
    transition: transform 0.15s ease;

.intruder-grid-19 {

}
.intruder-cell {

.recall-shape-btn {

.overlay-content {

.overlay-title {

}
.overlay-text {
    margin-top: 12px;

.overlay-button {

#settingsScreen {

.settings-title {

}

</head>
<body>
<div id="app">
    <section id="homeScreen" class="screen active">
        <div class="logo">
            <span class="logo-main">MEMORY</span>
            <span class="logo-sub">TRAP</span>
            <div class="logo-line"></div>
        </div>
        <div id="homeLives" class="lives home-lives"></div>
        <button id="startButton" class="start-button">
            <span class="start-title">INICIAR</span>
            <span class="start-subtitle">MEMORY TRAP</span>
        </button>
        <div class="hall">
            <div class="hall-title">HALL DOS SOBREVIVENTES</div>
            <div class="hall-mask">
                <div id="hallList" class="hall-list"></div>
            </div>
        </div>
        <button id="menuButton" class="home-menu">☰</button>
    </section>

    <section id="gameScreen" class="screen">
        <div class="game-header">
            <div id="levelNumber" class="level-number"></div>
            <div id="levelQuestion" class="level-question"></div>
        </div>
        <div id="levelContent" class="level-content"></div>
        <div id="gameLives" class="lives game-lives"></div>
    </section>

    <section id="settingsScreen" class="screen">
        <button id="backButton" class="back-button">←</button>
        <div class="settings-title">CONFIGURAÇÕES</div>
        <div class="setting-row"><span>SOM</span><button id="soundButton" class="setting-button">ON</button></div>
        <div class="setting-row"><span>VIBRAÇÃO</span><button id="vibrationButton" class="setting-button">ON</button></div>
    </section>

    <div id="overlay">
        <div class="overlay-content">
            <div id="overlayTitle" class="overlay-title"></div>
            <div id="overlayText" class="overlay-text"></div>
            <button id="overlayButton" class="overlay-button"></button>
        </div>
    </div>
</div>

<script>
const CONFIG = { TOTAL_LEVELS: 100, STARTING_LIVES: 5, SOUND_ENABLED: true, VIBRATION_ENABLED: true, SURVIVORS_KEY: "memory_trap_survivors_v1" };
const GAME = { currentLevel: 0, lives: CONFIG.STARTING_LIVES, totalAttempts: 0, mistakes: 0, levelTimers: [], state: {}, finished: false };

const DOM = {
    homeScreen: document.getElementById("homeScreen"),
    gameScreen: document.getElementById("gameScreen"),
    settingsScreen: document.getElementById("settingsScreen"),
    homeLives: document.getElementById("homeLives"),
    gameLives: document.getElementById("gameLives"),
    levelNumber: document.getElementById("levelNumber"),
    levelQuestion: document.getElementById("levelQuestion"),
    levelContent: document.getElementById("levelContent"),
    startButton: document.getElementById("startButton"),
    menuButton: document.getElementById("menuButton"),
    backButton: document.getElementById("backButton"),
    soundButton: document.getElementById("soundButton"),
    vibrationButton: document.getElementById("vibrationButton"),
    hallList: document.getElementById("hallList"),
    overlay: document.getElementById("overlay"),
    overlayTitle: document.getElementById("overlayTitle"),
    overlayText: document.getElementById("overlayText"),
    overlayButton: document.getElementById("overlayButton")
};

const LEVELS = {
    1: { type: "broken-shape" }, 2: { type: "grid" }, 3: { type: "direct-answer" }, 4: { type: "pi" },
    5: { type: "count-circles" }, 6: { type: "appearing-circles" }, 7: { type: "no-number-rats", hiddenNumber: true },
    8: { type: "color-memory" }, 9: { type: "arrow-memory" }, 10: { type: "camouflaged-command" },
    11: { type: "arrow-labyrinth" }, 12: { type: "hold-two-seconds" }, 13: { type: "circle-rhythm" },
    14: { type: "reverse-order" }, 15: { type: "doors-exit" }, 16: { type: "drag-outside" },
    17: { type: "circle-exclusion" }, 18: { type: "escaping-button" }, 19: { type: "letter-intruder" },
    20: { type: "level1-recall" }
};
for (let i = 21; i <= 100; i++) LEVELS[i] = { name: "Nível " + i, type: "unimplemented" };

function clearLevelTimers() {
    GAME.levelTimers.forEach(t => { clearTimeout(t); clearInterval(t); });
    GAME.levelTimers = [];
}
function addLevelTimer(t) { GAME.levelTimers.push(t); }

let audioContext = null;
function getAudioContext() {
    if (!audioContext) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (Ctx) audioContext = new Ctx();
    }
    return audioContext;
}

function playTone(f, d, ty = "sine", v = 0.035) {
    if (!CONFIG.SOUND_ENABLED) return;
    const ctx = getAudioContext();
    if (!ctx) return;
    if (ctx.state === "suspended") ctx.resume().catch(() => {});
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = ty;
    o.frequency.setValueAtTime(f, ctx.currentTime);
    g.gain.setValueAtTime(v, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + d);
    o.connect(g);
    g.connect(ctx.destination);
    o.start();
    o.stop(ctx.currentTime + d);
}

function soundCorrect() {
    playTone(720, .08, "sine", .035);
    setTimeout(() => playTone(960, .07, "sine", .025), 45);
}
function soundLifeLost() { playTone(95, .25, "sawtooth", .05); }

function vibrate(p) {
    if (CONFIG.VIBRATION_ENABLED && "vibrate" in navigator) {
        try { navigator.vibrate(p); } catch (e) {}
    }
}
function feedbackCorrect() { soundCorrect(); vibrate(18); }
function feedbackLifeLost() { soundLifeLost(); vibrate([60, 40, 80]); }

function renderLives(c) {
    c.innerHTML = "";
    for (let i = 0; i < CONFIG.STARTING_LIVES; i++) {
        const h = document.createElement("div");
        h.className = "heart";
        if (i >= GAME.lives) h.classList.add("empty");
        c.appendChild(h);
    }
}
function updateLives() { renderLives(DOM.homeLives); renderLives(DOM.gameLives); }

function showScreen(s) {
    document.querySelectorAll(".screen").forEach(e => e.classList.remove("active"));
    s.classList.add("active");
}

function goHome() {
    clearLevelTimers();
    GAME.finished = false;
    updateLives();
    showScreen(DOM.homeScreen);
    startHallAnimation();
}

function getSurvivors() {
    try {
        const r = localStorage.getItem(CONFIG.SURVIVORS_KEY);
        return r ? JSON.parse(r) : [];
    } catch { return []; }
}

function renderHall() {
    const s = getSurvivors();
    DOM.hallList.innerHTML = "";
    if (s.length === 0) {
        const e = document.createElement("div");
        e.className = "hall-empty";
        e.textContent = "NENHUM SOBREVIVENTE";
        DOM.hallList.appendChild(e);
        return;
    }
    s.slice(-20).reverse().forEach(p => {
        const n = document.createElement("div");
        n.className = "hall-name";
        n.textContent = String(p.name).slice(0, 20).toUpperCase();
        DOM.hallList.appendChild(n);
    });
}

let hallAnim = null, hallPos = 0;
function startHallAnimation() {
    if (hallAnim) cancelAnimationFrame(hallAnim);
    hallPos = 0;
    function animate() {
        if (!DOM.homeScreen.classList.contains("active")) return;
        const h = DOM.hallList.offsetHeight;
        const v = DOM.hallList.parentElement.offsetHeight;
        if (h > v) {
            hallPos += 0.18;
            if (hallPos > h - v + 25) hallPos = 0;
            DOM.hallList.style.transform = `translateY(-${hallPos}px)`;
        }
        hallAnim = requestAnimationFrame(animate);
    }
    animate();
}

function startGame() {
    clearLevelTimers();
    GAME.currentLevel = 1;
    GAME.lives = CONFIG.STARTING_LIVES;
    GAME.totalAttempts = 0;
    GAME.mistakes = 0;
    GAME.finished = false;
    updateLives();
    showScreen(DOM.gameScreen);
    loadLevel(1);
}

function loadLevel(n) {
    clearLevelTimers();
    GAME.currentLevel = n;
    GAME.state = {};
    const l = LEVELS[n];
    if (!l) { finishGame(); return; }
    DOM.levelNumber.textContent = l.hiddenNumber ? "" : n;
    DOM.levelQuestion.innerHTML = "";
    DOM.levelContent.innerHTML = "";
    renderLevel(n, l);
    updateLives();
}

function failLevel() {
    if (GAME.finished) return;
    GAME.totalAttempts++;
    GAME.mistakes++;
    GAME.lives--;
    feedbackLifeLost();
    updateLives();
    if (GAME.lives <= 0) {
        clearLevelTimers();
        showOverlay("SEM VIDAS", "Você perdeu as 5 vidas. O jogo será reiniciado.", "RECOMEÇAR", () => {
            GAME.lives = CONFIG.STARTING_LIVES;
            updateLives();
            closeOverlay();
            loadLevel(1);
        });
        return;
    }
    clearLevelTimers();
    loadLevel(GAME.currentLevel);
}

function completeLevel() {
    if (GAME.finished) return;
    feedbackCorrect();
    const next = GAME.currentLevel + 1;
    if (GAME.currentLevel === CONFIG.TOTAL_LEVELS || !LEVELS[next]) {
        finishGame();
        return;
    }
    setTimeout(() => { loadLevel(next); }, 180);
}

function showOverlay(t, x, b, a) {
    DOM.overlayTitle.textContent = t;
    DOM.overlayText.textContent = x;
    DOM.overlayButton.textContent = b;
    DOM.overlayButton.onclick = a;
    DOM.overlay.classList.add("active");
}
function closeOverlay() { DOM.overlay.classList.remove("active"); }

        case "broken-shape": renderLevel1(); break;

        case "color-memory": renderLevel8(); break;
        case "arrow-memory": renderLevel9(); break;
        case "camouflaged-command": renderLevel10(); break;
        case "arrow-labyrinth": renderLevel11(); break;
        case "hold-two-seconds": renderLevel12(); break;
        case "circle-rhythm": renderLevel13(); break;
        case "reverse-order": renderLevel14(); break;
        case "doors-exit": renderLevel15(); break;
        case "drag-outside": renderLevel16(); break;

}

function renderLevel1() {
    DOM.levelQuestion.textContent = "Complete a figura.";
    const wrap = document.createElement("div");
    wrap.className = "broken-container";
    wrap.innerHTML = `
        <div class="broken-top" id="targetArea"></div>
        <div class="broken-pieces-pool">
            <div class="puzzle-piece" data-correct="false" style="clip-path:polygon(0% 100%,100% 100%,100% 28%,86% 2%,77% 32%,61% 4%,50% 32%,36% 3%,25% 32%,11% 2%,0% 28%)"></div>
            <div class="puzzle-piece" data-correct="true" style="clip-path:polygon(0% 100%,100% 100%,100% 48%,88% 0%,78% 38%,63% 2%,52% 40%,38% 0%,26% 36%,12% 0%,0% 48%)"></div>
            <div class="puzzle-piece" data-correct="false" style="clip-path:polygon(0% 100%,100% 100%,100% 32%,88% 8%,78% 34%,63% 10%,52% 36%,38% 8%,26% 32%,12% 8%,0% 32%)"></div>
            <div class="puzzle-piece" data-correct="false" style="clip-path:polygon(0% 100%,100% 100%,100% 30%,88% 4%,79% 30%,64% 6%,53% 32%,39% 4%,27% 30%,13% 4%,0% 30%)"></div>
        </div>
    `;
    DOM.levelContent.appendChild(wrap);
    const pieces = wrap.querySelectorAll(".puzzle-piece");
    const target = wrap.querySelector("#targetArea");

    pieces.forEach(p => {
        let sx = 0, sy = 0;
        p.addEventListener("pointerdown", e => {
            p.setPointerCapture(e.pointerId);
            p.classList.add("dragging");
            sx = e.clientX;
            sy = e.clientY;
            const mv = em => {
                p.style.transform = `translate(${em.clientX - sx}px,${em.clientY - sy}px)`;
            };
            const up = em => {
                p.releasePointerCapture(em.pointerId);
                p.classList.remove("dragging");
                p.removeEventListener("pointermove", mv);
                p.removeEventListener("pointerup", up);
                const pr = p.getBoundingClientRect();
                const tr = target.getBoundingClientRect();
                const d = Math.hypot((pr.left + pr.width / 2) - (tr.left + tr.width / 2), (pr.top + pr.height / 2) - (tr.bottom - 20));
                if (d < 110) {
                    if (p.dataset.correct === "true") {
                        p.style.opacity = "0";
                        target.classList.add("filled");
                        setTimeout(() => completeLevel(), 380);
                    } else {
                        vibrate([40, 30, 40]);
                        p.classList.add("wrong-shake");
                        p.style.transform = "translate(0,0)";
                        setTimeout(() => p.classList.remove("wrong-shake"), 400);
                        setTimeout(() => failLevel(), 350);
                    }
                } else {
                    p.style.transform = "translate(0,0)";
                }
            };
            p.addEventListener("pointermove", mv);
            p.addEventListener("pointerup", up);
        });
    });
}

function renderLevel6() {
    DOM.levelQuestion.textContent = "Acompanhe e toque nos círculos.";
    const wrap = document.createElement("div");
    wrap.style.cssText = "position:relative; width:100%; height: 320px; margin: 0 auto;";
    DOM.levelContent.appendChild(wrap);

    const coords = [
        ["20%", "30%"], ["70%", "25%"],
        ["50%", "50%"], ["25%", "70%"],
        ["75%", "65%"]
    ];

    let currentIndex = 0;
    let failed = false;

    function showNextCircle() {
        if (failed || GAME.currentLevel !== 6) return;
        if (currentIndex >= coords.length) {
            completeLevel();
            return;
        }

        const [l, t] = coords[currentIndex];
        const c = document.createElement("div");
        c.className = "click-circle";
        c.style.cssText = `position:absolute; left:${l}; top:${t}; transform: translate(-50%, -50%) scale(0); transition: transform 0.12s ease;`;
        wrap.appendChild(c);

        requestAnimationFrame(() => {
            if (failed || GAME.currentLevel !== 6) return;
            c.style.transform = "translate(-50%, -50%) scale(1)";
        });

        let wasClicked = false;

        const hideTimer = setTimeout(() => {
            if (!wasClicked && !failed && GAME.currentLevel === 6) {
                failed = true;
                c.style.transform = "translate(-50%, -50%) scale(0)";
                failLevel();
            }
        }, 1200);
        addLevelTimer(hideTimer);

        c.addEventListener("pointerup", () => {
            if (wasClicked || failed || GAME.currentLevel !== 6) return;
            wasClicked = true;
            clearTimeout(hideTimer);
            c.style.transform = "translate(-50%, -50%) scale(0)";
            feedbackCorrect();
            currentIndex++;
            setTimeout(() => {
                if (GAME.currentLevel !== 6) return;
                c.remove();
                showNextCircle();
            }, 90);
        }, { once: true });
    }

    const startDelay = setTimeout(() => {
        showNextCircle();
    }, 400);
    addLevelTimer(startDelay);
}

/* --- NÍVEL 11 - AMAZE BLUE STYLE (30 SETAS / GRADE 6X5) --- */
function renderLevel11() {
    DOM.levelQuestion.textContent = "Liberte todas as setas.";

    const containerWrapper = document.createElement("div");
    containerWrapper.innerHTML = `
        <div id="maze-game-container-11">
            <canvas id="mazeCanvas-11" width="350" height="440"></canvas>
        </div>
    `;
    DOM.levelContent.appendChild(containerWrapper);

    const canvas = containerWrapper.querySelector('#mazeCanvas-11');
    const ctx = canvas.getContext('2d');

    const COR_AZUL = '#246bff';
    const COLS = 6;
    const ROWS = 5;
    const cellW = canvas.width / COLS;
    const cellH = canvas.height / ROWS;

    // Layout inicial com 30 direções variadas (6x5)
    const dirsLayout = [
        'RIGHT', 'DOWN', 'LEFT', 'RIGHT', 'DOWN', 'LEFT',
        'DOWN',  'UP',   'RIGHT', 'LEFT', 'UP',   'RIGHT',
        'LEFT',  'RIGHT', 'DOWN', 'UP',   'RIGHT', 'DOWN',
        'UP',    'LEFT',  'UP',   'RIGHT', 'DOWN', 'LEFT',
        'RIGHT', 'DOWN',  'LEFT', 'UP',   'RIGHT', 'UP'
    ];

    let pieces = [];
    let idCounter = 1;

    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
            let index = r * COLS + c;
            pieces.push({
                id: idCounter++,
                col: c,
                row: r,
                dir: dirsLayout[index],
                exited: false,
                animX: 0,
                animY: 0,
                shakeTime: 0
            });
        }
    }

    let animId = null;

    // Função que verifica se há obstrução no caminho da peça até a borda
    function isBlocked(piece) {
        let c = piece.col;
        let r = piece.row;
        let dir = piece.dir;

        // Verifica na grade se existe alguma outra peça ativa no caminho exato de saída
        for (let other of pieces) {
            if (other.id === piece.id || other.exited) continue;
            if (dir === 'RIGHT' && other.row === r && other.col > c) return true;
            if (dir === 'LEFT' && other.row === r && other.col < c) return true;
            if (dir === 'DOWN' && other.col === c && other.row > r) return true;
            if (dir === 'UP' && other.col === c && other.row < r) return true;
        }
        return false;
    }

    function draw() {
        if (GAME.currentLevel !== 11) return;
        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        let allExited = true;

        pieces.forEach(p => {
            if (!p.exited) allExited = false;
            if (p.exited && (Math.abs(p.animX) > 600 || Math.abs(p.animY) > 600)) return;

            ctx.save();

            let baseX = p.col * cellW + cellW / 2;
            let baseY = p.row * cellH + cellH / 2;

            if (p.shakeTime > 0) {
                baseX += Math.sin(p.shakeTime * 0.8) * 6;
                p.shakeTime--;
            }

            if (p.exited) {
                if (p.dir === 'RIGHT') p.animX += 26;
                if (p.dir === 'LEFT') p.animX -= 26;
                if (p.dir === 'UP') p.animY -= 26;
                if (p.dir === 'DOWN') p.animY += 26;
            }

            let x = baseX + p.animX;
            let y = baseY + p.animY;

            ctx.translate(x, y);

            // Desenha o corpo da barra/tubulação e a seta
            ctx.strokeStyle = COR_AZUL;
            ctx.lineWidth = 10;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            ctx.beginPath();
            if (p.dir === 'RIGHT') {
                ctx.moveTo(-16, 0); ctx.lineTo(16, 0);
                ctx.stroke();
                ctx.fillStyle = COR_AZUL;
                ctx.beginPath();
                ctx.moveTo(20, 0); ctx.lineTo(8, -8); ctx.lineTo(8, 8);
                ctx.fill();
            } else if (p.dir === 'LEFT') {
                ctx.moveTo(16, 0); ctx.lineTo(-16, 0);
                ctx.stroke();
                ctx.fillStyle = COR_AZUL;
                ctx.beginPath();
                ctx.moveTo(-20, 0); ctx.lineTo(-8, -8); ctx.lineTo(-8, 8);
                ctx.fill();
            } else if (p.dir === 'UP') {
                ctx.moveTo(0, 16); ctx.lineTo(0, -16);
                ctx.stroke();
                ctx.fillStyle = COR_AZUL;
                ctx.beginPath();
                ctx.moveTo(0, -20); ctx.lineTo(-8, -8); ctx.lineTo(8, -8);
                ctx.fill();
            } else if (p.dir === 'DOWN') {
                ctx.moveTo(0, -16); ctx.lineTo(0, 16);
                ctx.stroke();
                ctx.fillStyle = COR_AZUL;
                ctx.beginPath();
                ctx.moveTo(0, 20); ctx.lineTo(-8, 8); ctx.lineTo(8, 8);
                ctx.fill();
            }

            ctx.restore();
        });

        if (allExited) {
            cancelAnimationFrame(animId);
            setTimeout(() => completeLevel(), 350);
            return;
        }

        animId = requestAnimationFrame(draw);
    }

    canvas.addEventListener('pointerup', function (e) {
        if (GAME.currentLevel !== 11) return;
        const rect = canvas.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;

        // Descobre qual peça foi tocada na grade
        for (let i = pieces.length - 1; i >= 0; i--) {
            let p = pieces[i];
            if (p.exited) continue;

            let px = p.col * cellW;
            let py = p.row * cellH;

            if (mouseX >= px && mouseX <= px + cellW && mouseY >= py && mouseY <= py + cellH) {
                if (!isBlocked(p)) {
                    p.exited = true;
                    feedbackCorrect();
                } else {
                    p.shakeTime = 16;
                    feedbackLifeLost();
                    failLevel();
                }
                break;
            }
        }
    });

    draw();
}

    const w = document.createElement("div");
    w.style.cssText = "display:flex;flex-direction:column;align-items:center;gap:20px";
    
    const b = document.createElement("button");
    b.className = "hold-btn-12";
    b.innerHTML = `<div class="hold-fill-12" id="holdFill"></div><span class="hold-text-12">SEGURE</span>`;
    
    const fill = b.querySelector("#holdFill");
    let startTime = 0;
    let timerInterval = null;
    let holding = false;

    const startHold = (e) => {
        e.preventDefault();
        if (holding) return;
        holding = true;
        startTime = Date.now();
        fill.style.height = "0%";
        
        timerInterval = setInterval(() => {
            const elapsed = (Date.now() - startTime) / 1000;
            const percentage = Math.min((elapsed / 2.0) * 100, 100);
            fill.style.height = percentage + "%";
        }, 30);
        addLevelTimer(timerInterval);
    };

    const releaseHold = (e) => {
        if (!holding) return;
        holding = false;
        clearInterval(timerInterval);
        
        const duration = (Date.now() - startTime) / 1000;
        fill.style.height = "0%";
        
        if (duration >= 1.5 && duration <= 2.5) {
            completeLevel();
        } else {
            failLevel();
        }
    };

    b.addEventListener("pointerdown", startHold);
    b.addEventListener("pointerup", releaseHold);
    b.addEventListener("pointercancel", releaseHold);

    w.appendChild(b);
    DOM.levelContent.appendChild(w);
}

function renderLevel13() {
    DOM.levelQuestion.textContent = "Toque no momento exato do pulso.";
    const w = document.createElement("div");
    w.style.cssText = "display:flex;flex-direction:column;align-items:center;gap:25px";
    const t = document.createElement("div");
    t.className = "rhythm-target-13";
    const p = document.createElement("div");
    p.className = "rhythm-pulse-13";
    t.appendChild(p);
    const a = document.createElement("button");
    a.className = "blue-choice";
    a.style.width = "180px";
    a.textContent = "APERTAR";
    a.addEventListener("pointerup", () => {
        const e = (Date.now() % 1200);
        if (e >= 450 && e <= 750) completeLevel();
        else failLevel();
    });
    w.appendChild(t);
    w.appendChild(a);
    DOM.levelContent.appendChild(w);
}

function renderLevel14() {
    DOM.levelQuestion.textContent = "Memorize e toque na ordem REVERSA.";
    const w = document.createElement("div");
    w.className = "reverse-grid-14";
    const seq = [0, 2, 3, 1];
    const btns = [];
    for (let i = 0; i < 4; i++) {
        const b = document.createElement("button");
        b.className = "rev-btn-14";
        b.textContent = i + 1;
        btns.push(b);
        w.appendChild(b);
    }
    DOM.levelContent.appendChild(w);
    GAME.state.revSeq = [...seq].reverse();
    GAME.state.revIdx = 0;
    seq.forEach((id, s) => {
        addLevelTimer(setTimeout(() => {
            btns[id].classList.add("lit");
            setTimeout(() => btns[id].classList.remove("lit"), 400);
        }, (s + 1) * 700));
    });
    addLevelTimer(setTimeout(() => {
        DOM.levelQuestion.textContent = "Toque de trás para frente!";
        btns.forEach((b, i) => {
            b.addEventListener("pointerup", () => {
                if (i !== GAME.state.revSeq[GAME.state.revIdx]) {
                    failLevel();
                    return;
                }
                b.classList.add("lit");
                feedbackCorrect();
                GAME.state.revIdx++;
                if (GAME.state.revIdx >= GAME.state.revSeq.length) completeLevel();
            });
        });
    }, 3600));
}

function renderLevel15() {
    DOM.levelQuestion.textContent = "Encontre a saída secreta.";
    const w = document.createElement("div");
    w.style.cssText = "display:flex; flex-direction:column; align-items:center; justify-content:center; width:100%; gap:20px;";
    
    const doorsGrid = document.createElement("div");
    doorsGrid.className = "doors-container-15";
    
    const correctDoor = 2;
    
    for (let i = 0; i < 5; i++) {
        const door = document.createElement("button");
        door.className = "door-btn-15";
        door.textContent = "🚪";
        
        door.addEventListener("pointerup", () => {
            if (i === correctDoor) {
                door.textContent = "🔓";
                door.style.background = "#246bff";
                feedbackCorrect();
                setTimeout(() => completeLevel(), 350);
            } else {
                door.textContent = "❌";
                vibrate([40, 30, 40]);
                failLevel();
            }
        });
        doorsGrid.appendChild(door);
    }
    
    w.appendChild(doorsGrid);
    DOM.levelContent.appendChild(w);
}

function renderLevel16() {
    DOM.levelQuestion.textContent = "Arraste o botão para fora da tela.";
    const w = document.createElement("div");
    w.style.cssText = "position:absolute;inset:0";
    const b = document.createElement("button");
    b.className = "drag-out-btn-16";
    b.textContent = "ARRASTE-ME";
    b.style.left = "calc(50% - 70px)";
    b.style.top = "calc(50% - 30px)";
    w.appendChild(b);
    DOM.levelContent.appendChild(w);
    b.addEventListener("pointerdown", e => {
        b.setPointerCapture(e.pointerId);
        const sx = e.clientX, sy = e.clientY;
        const r = b.getBoundingClientRect();
        const mv = em => {
            b.style.left = (r.left + (em.clientX - sx)) + "px";
            b.style.top = (r.top + (em.clientY - sy)) + "px";
        };
        const up = em => {
            b.releasePointerCapture(em.pointerId);
            b.removeEventListener("pointermove", mv);
            b.removeEventListener("pointerup", up);
            const cur = b.getBoundingClientRect();
            if (cur.left < 10 || cur.right > window.innerWidth - 10 || cur.top < 50 || cur.bottom > window.innerHeight - 10) completeLevel();
            else {
                b.style.left = "calc(50% - 70px)";
                b.style.top = "calc(50% - 30px)";
            }
        };
        b.addEventListener("pointermove", mv);
        b.addEventListener("pointerup", up);
    });
}

function renderLevel17() {
    DOM.levelQuestion.textContent = "Toque apenas nos círculos.";
    const w = document.createElement("div");
    w.className = "exclusion-field-17";
    let left = 3;
    const items = [
        { t: "circle", x: 30, y: 40 },
        { t: "square", x: 120, y: 70 },
        { t: "circle", x: 220, y: 30 },
        { t: "square", x: 80, y: 160 },
        { t: "circle", x: 260, y: 180 }
    ];
    items.forEach(it => {
        const e = document.createElement("div");
        e.className = "exc-item " + (it.t === "circle" ? "exc-circle" : "exc-square");
        e.style.left = it.x + "px";
        e.style.top = it.y + "px";
        w.appendChild(e);
        e.addEventListener("pointerup", () => {
            if (it.t === "square") failLevel();
            else if (!e.disabled) {
                e.disabled = true;
                e.style.display = "none";
                left--;
                feedbackCorrect();
                if (left === 0) completeLevel();
            }
        });
    });
    DOM.levelContent.appendChild(w);
}

function renderLevel18() {
    DOM.levelQuestion.textContent = "Toque no botão fujão.";
    const w = document.createElement("div");
    w.style.cssText = "position:absolute;inset:0";
    const b = document.createElement("button");
    b.className = "escaping-btn-18";
    b.textContent = "PEGUE-ME";
    b.style.left = "calc(50% - 65px)";
    b.style.top = "calc(50% - 30px)";
    w.appendChild(b);
    DOM.levelContent.appendChild(w);
    let esc = 0;
    b.addEventListener("pointerdown", e => {
        e.preventDefault();
        esc++;
        if (esc >= 3) completeLevel();
        else flee();
    });
    function flee() {
        b.style.left = Math.random() * (window.innerWidth - 150) + "px";
        b.style.top = Math.random() * (window.innerHeight - 200) + 80 + "px";
    }
}

function renderLevel19() {
    DOM.levelQuestion.textContent = "Encontre o caractere diferente.";
    const w = document.createElement("div");
    w.className = "intruder-grid-19";
    const ti = Math.floor(Math.random() * 25);
    for (let i = 0; i < 25; i++) {
        const c = document.createElement("button");
        c.className = "intruder-cell";
        c.textContent = (i === ti ? "X" : "O");
        w.appendChild(c);
        c.addEventListener("pointerup", () => {
            if (i === ti) completeLevel();
            else failLevel();
        });
    }
    DOM.levelContent.appendChild(w);
}

function renderLevel20() {
    DOM.levelQuestion.textContent = "Qual era a forma do Nível 1?";
    const w = document.createElement("div");
    w.className = "recall-grid-20";
    for (let i = 0; i < 4; i++) {
        const b = document.createElement("button");
        b.className = "recall-shape-btn";
        const s = document.createElement("div");
        s.className = "recall-mini-shape";
        if (i === 1) s.style.clipPath = "polygon(0% 0%,100% 0%,100% 50%,82% 100%,65% 60%,50% 95%,35% 60%,18% 100%,0% 50%)";
        else if (i === 0) s.style.clipPath = "polygon(0% 0%,100% 0%,100% 100%,0% 100%)";
        else if (i === 2) s.style.clipPath = "polygon(50% 0%,100% 100%,0% 100%)";
        else s.style.clipPath = "polygon(0% 20%,100% 0%,100% 80%,0% 100%)";
        b.appendChild(s);
        w.appendChild(b);
        b.addEventListener("pointerup", () => {
            if (i === 1) completeLevel();
            else failLevel();
        });
    }
    DOM.levelContent.appendChild(w);
}

function renderUnimplementedLevel(n, l) {
    const w = document.createElement("div");
    w.style.cssText = "text-align:center;width:100%";
    w.innerHTML = `<div>${l.name}</div><div style="font-size:12px;opacity:.5;margin-top:20px">MECÂNICA RESERVADA</div><button class="blue-choice" style="display:block;width:180px;margin:30px auto 0">TESTAR</button>`;
    DOM.levelContent.appendChild(w);
    w.querySelector("button").addEventListener("pointerup", completeLevel);
}

function finishGame() {
    clearLevelTimers();
    showOverlay("PARABÉNS", "Você concluiu o MEMORY TRAP!", "REINICIAR", () => {
        closeOverlay();
        goHome();
    });
}

function updateSettingsUI() {
    DOM.soundButton.textContent = CONFIG.SOUND_ENABLED ? "ON" : "OFF";
    DOM.vibrationButton.textContent = CONFIG.VIBRATION_ENABLED ? "ON" : "OFF";
}

DOM.soundButton.addEventListener("pointerup", () => {
    CONFIG.SOUND_ENABLED = !CONFIG.SOUND_ENABLED;
    updateSettingsUI();
});
DOM.vibrationButton.addEventListener("pointerup", () => {
    CONFIG.VIBRATION_ENABLED = !CONFIG.VIBRATION_ENABLED;
    updateSettingsUI();
});
DOM.startButton.addEventListener("pointerup", startGame);
DOM.menuButton.addEventListener("pointerup", () => { showScreen(DOM.settingsScreen); });
DOM.backButton.addEventListener("pointerup", () => {
    showScreen(DOM.homeScreen);
    startHallAnimation();
});

document.addEventListener("contextmenu", e => e.preventDefault());
document.addEventListener("touchmove", e => { if (e.cancelable) e.preventDefault(); }, { passive: false });

function init() {
    updateLives();
    renderHall();
    updateSettingsUI();
    startHallAnimation();
}
init();
</script>
