<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>MEMORY TRAP</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
    touch-action: none;
    position: fixed;
    inset: 0;
}

button {
    font: inherit;
    color: inherit;
    border: 0;
    outline: 0;
    background: none;
    touch-action: none;
}

#app {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

.screen {
    position: absolute;
    inset: 0;
    display: none;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

.screen.active {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

#homeScreen {
    justify-content: center;
    align-items: center;
    gap: 24px;
    padding:
        calc(env(safe-area-inset-top) + 25px)
        20px
        calc(env(safe-area-inset-bottom) + 20px);
}

.logo {
    text-align: center;
    line-height: 1.1;
    pointer-events: none;
    margin: 0;
}

.logo-main {
    display: block;
    font-size: clamp(38px, 11vw, 64px);
    font-weight: 900;
    letter-spacing: .10em;
    line-height: .90;
}

.logo-sub {
    display: block;
    margin-top: 14px;
    font-size: clamp(14px, 3.8vw, 22px);
    font-weight: 700;
    letter-spacing: .55em;
    padding-left: .55em;
    line-height: 1;
}

.logo-line {
    width: min(200px, 50vw);
    height: 1px;
    margin: 18px auto 0;
    background: rgba(255,255,255,.45);
}

.lives {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
}

.heart {
    position: relative;
    width: 22px;
    height: 22px;
    transform: rotate(-45deg);
    border-radius: 3px;
    background: #ff3b30;
}

.heart::before,
.heart::after {
    content: "";
    position: absolute;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #ff3b30;
}

.heart::before {
    top: -11px;
    left: 0;
}

.heart::after {
    top: 0;
    left: 11px;
}

.heart.empty,
.heart.empty::before,
.heart.empty::after {
    background: #333;
}

.start-button {
    position: relative;
    width: min(320px, 82vw);
    min-height: 68px;
    padding: 12px 20px;
    border: 1px solid rgba(255,255,255,.75);
    border-radius: 6px;
    background: #050505;
}

.start-title {
    display: block;
    font-size: 22px;
    font-weight: 900;
    letter-spacing: .15em;
}

.start-subtitle {
    display: block;
    margin-top: 3px;
    font-size: 10px;
    letter-spacing: .25em;
    opacity: .55;
}

.hall {
    position: relative;
    width: min(370px, 90vw);
    height: 110px;
    overflow: hidden;
    border-top: 1px solid rgba(255,255,255,.12);
    border-bottom: 1px solid rgba(255,255,255,.12);
}

.hall-title {
    position: absolute;
    top: 6px;
    left: 0;
    right: 0;
    z-index: 3;
    text-align: center;
    font-size: 10px;
    letter-spacing: .25em;
    opacity: .5;
}

.hall-mask {
    position: absolute;
    inset: 0;
    overflow: hidden;
    padding-top: 24px;
}

.hall-list {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
}

.hall-name {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .12em;
    opacity: .82;
}

.hall-empty {
    margin-top: 20px;
    font-size: 10px;
    letter-spacing: .15em;
    opacity: .28;
}

.home-menu {
    position: absolute;
    right: 20px;
    bottom: calc(env(safe-area-inset-bottom) + 10px);
    width: 40px;
    height: 40px;
    border: 1px solid rgba(255,255,255,.22);
    border-radius: 50%;
    font-size: 18px;
    opacity: .7;
}

#gameScreen {
    justify-content: flex-start;
    background: #000;
}

.game-header {
    position: relative;
    width: 100%;
    text-align: center;
    padding-top: calc(env(safe-area-inset-top) + 15px);
    z-index: 20;
}

.level-number {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: .15em;
}

.level-question {
    width: 90%;
    margin: 8px auto 0;
    text-align: center;
    font-size: clamp(15px, 3.8vw, 19px);
    font-weight: 700;
    line-height: 1.3;
}

.level-content {
    position: relative;
    width: 100%;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 10px 12px 70px;
    gap: 15px;
}

.game-lives {
    position: absolute;
    left: 0;
    right: 0;
    bottom: calc(env(safe-area-inset-bottom) + 15px);
    z-index: 30;
}

.options-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
    width: min(380px, 94vw);
    margin: 0 auto;
}

.blue-choice {
    min-height: 65px;
    background: #246bff;
    border: 1px solid rgba(255,255,255,.25);
    border-radius: 14px;
    font-size: 18px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px;
    text-align: center;
}

.broken-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    width: 100%;
    justify-content: flex-start;
    padding-top: 10px;
}

.broken-top {
    width: min(42vw, 165px);
    height: min(28vw, 110px);
    background: #246bff;
    border-radius: 8px 8px 4px 4px;
    clip-path: polygon(
        0% 0%,
        100% 0%,
        100% 52%,
        88% 100%,
        76% 62%,
        63% 100%,
        51% 60%,
        37% 100%,
        25% 60%,
        12% 100%,
        0% 52%
    );
    transition: all .3s ease;
    box-shadow: 0 0 0 1px rgba(255,255,255,.15) inset;
}

.broken-top.filled {
    clip-path: none;
}

.broken-pieces-pool {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    width: min(92vw, 360px);
    justify-items: center;
}

.puzzle-piece {
    width: min(42vw, 165px);
    height: min(28vw, 110px);
    background: #246bff;
    border-radius: 8px;
    touch-action: none;
    cursor: grab;
    transition:
        transform .38s cubic-bezier(.2,.8,.3,1.2);
    border: 1px solid rgba(255,255,255,.12);
}

.puzzle-piece.dragging {
    transition: none;
    z-index: 50;
    scale: 1.08;
    box-shadow: 0 8px 24px rgba(0,0,0,.6);
}

.puzzle-piece.wrong-shake {
    animation: shakeWrong .4s ease;
}

@keyframes shakeWrong {
    0%,100% {
        transform: translateX(0);
    }
    20% {
        transform: translateX(-8px);
    }
    40% {
        transform: translateX(8px);
    }
    60% {
        transform: translateX(-6px);
    }
    80% {
        transform: translateX(6px);
    }
}

.grid2-large {
    display: grid;
    grid-template-columns: repeat(2,minmax(0,1fr));
    grid-template-rows: repeat(2,75px);
    gap: 14px;
    width: min(380px,94vw);
}

.shape-field-full {
    position: absolute;
    inset: 0 0 95px 0;
    pointer-events: none;
}

.geo-shape {
    position: absolute;
    background: #fff;
}

.geo-circle {
    border-radius: 50%;
}

.geo-square {
    border-radius: 4px;
}

.geo-rect {
    border-radius: 3px;
}

.geo-pentagon {
    clip-path: polygon(
        50% 0%,
        100% 38%,
        82% 100%,
        18% 100%,
        0% 38%
    );
}

.geo-hexagon {
    clip-path: polygon(
        25% 0%,
        75% 0%,
        100% 50%,
        75% 100%,
        25% 100%,
        0% 50%
    );
}

.click-circle {
    position: absolute;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: #246bff;
    border: 1.5px solid #fff;
}

.rats-wrap {
    position: relative;
    width: 260px;
    height: 260px;
    margin-bottom: 10px;
}

.orbit-center {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 10px;
    height: 10px;
    transform: translate(-5%,-5%);
    animation: spin 4s linear infinite;
}

.circling-rat {
    position: absolute;
    font-size: 26px;
    transform-origin: center;
}

@keyframes spin {
    100% {
        transform: translate(-50%,-50%) rotate(360deg);
    }
}

.question-with-rat {
    position: relative;
    display: inline-block;
    padding: 0 15px;
}

.small-hiding-rat {
    position: absolute;
    font-size: 14px;
    top: -15px;
    left: -30px;
    animation: ratArcRun 1.5s linear infinite;
}

@keyframes ratArcRun {
    0% {
        transform: translate(0,15px) scale(.6);
        opacity: 0;
    }
    50% {
        transform: translate(90px,-15px) scale(.6);
        opacity: 1;
    }
    100% {
        transform: translate(180px,15px) scale(.6);
        opacity: 0;
    }
}

.color-bar-container {
    display: flex;
    justify-content: space-evenly;
    align-items: center;
    width: min(390px,96vw);
    height: 180px;
    margin: 0 auto;
}

.color-segment {
    width: 26px;
    height: 155px;
    border-radius: 6px;
}

.c-red {
    background: #ff3030;
}

.c-blue {
    background: #3080ff;
}

.c-green {
    background: #35c96b;
}

.c-yellow {
    background: #ffd83d;
}

.c-purple {
    background: #9c55ff;
}

.c-orange {
    background: #ff8a30;
}

.arrow-sequence-display {
    display: flex;
    gap: 16px;
    font-size: 40px;
    font-weight: 900;
    margin: 15px 0;
}

.red-trap-grid {
    display: grid;
    grid-template-columns: repeat(2,minmax(0,1fr));
    gap: 14px;
    width: min(380px,94vw);
}

.red-trap-btn {
    min-height: 65px;
    border: 1px solid rgba(255,255,255,.25);
    border-radius: 14px;
}

/* ============================================================
   NÍVEL 11
   ============================================================ */

.arrow-labyrinth-11 {
    position: relative;
    width: min(360px,92vw);
    height: min(420px,72vh);
    background: #000;
    margin: 0 auto;
    overflow: hidden;
    border-radius: 0;
}

.maze-line {
    position: absolute;
    background: rgba(255,255,255,.9);
    border-radius: 2px;
    transition: opacity .4s ease;
}

.lab-arrow-node {
    position: absolute;
    width: 28px;
    height: 28px;
    background: transparent;
    border: none;
    font-size: 22px;
    font-weight: 900;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 10;
    line-height: 1;
    transition:
        transform .7s cubic-bezier(.2,.8,.2,1),
        opacity .4s;
}

@keyframes shake11 {
    0%,100% {
        transform: translateX(0);
    }
    25% {
        transform: translateX(-6px);
    }
    50% {
        transform: translateX(6px);
    }
    75% {
        transform: translateX(-4px);
    }
}

/* ============================================================
   OUTROS NÍVEIS
   ============================================================ */

.hold-area-12 {
    display: flex;
    align-items: center;
    justify-content: center;
    width: min(300px,80vw);
    height: 160px;
}

.hold-button-12 {
    width: 180px;
    height: 70px;
    border: 1px solid rgba(255,255,255,.4);
    border-radius: 12px;
    background: #151515;
    font-weight: 800;
}

.rhythm-grid-13 {
    display: flex;
    gap: 15px;
    justify-content: center;
    align-items: center;
}

.rhythm-circle-13 {
    width: 55px;
    height: 55px;
    border-radius: 50%;
    background: #246bff;
    border: 1px solid rgba(255,255,255,.4);
}

.reverse-grid-14 {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: min(300px,85vw);
}

.reverse-btn-14 {
    min-height: 60px;
    border-radius: 12px;
    background: #246bff;
    font-size: 20px;
    font-weight: 800;
}

.blind-field-15 {
    position: relative;
    width: min(330px,88vw);
    height: 330px;
    background: #080808;
    border: 1px solid rgba(255,255,255,.08);
}

.blind-pixel-15 {
    position: absolute;
    width: 18px;
    height: 18px;
    border-radius: 2px;
    background: #fff;
}

.drag-field-16 {
    position: relative;
    width: min(340px,90vw);
    height: 340px;
    border: 1px solid rgba(255,255,255,.08);
}

.drag-target-16 {
    position: absolute;
    right: 15px;
    bottom: 15px;
    width: 100px;
    height: 100px;
    border: 1px dashed rgba(255,255,255,.3);
}

.drag-object-16 {
    position: absolute;
    left: 20px;
    top: 20px;
    width: 65px;
    height: 65px;
    background: #246bff;
    border-radius: 12px;
}

.exclusion-field-17 {
    position: relative;
    width: min(330px,88vw);
    height: 280px;
}

.exc-item {
    position: absolute;
    width: 55px;
    height: 55px;
}

.exc-circle {
    border-radius: 50%;
    background: #246bff;
}

.exc-square {
    border-radius: 6px;
    background: #fff;
}

.escaping-btn-18 {
    position: absolute;
    width: 130px;
    height: 60px;
    border: 1px solid rgba(255,255,255,.4);
    border-radius: 10px;
    background: #151515;
    font-weight: 800;
}

.intruder-grid-19 {
    display: grid;
    grid-template-columns: repeat(5,50px);
    gap: 10px;
}

.intruder-cell {
    width: 50px;
    height: 50px;
    border-radius: 8px;
    background: #246bff;
    font-size: 22px;
    font-weight: 900;
}

.recall-grid-20 {
    display: grid;
    grid-template-columns: repeat(2,130px);
    gap: 15px;
}

.recall-shape-btn {
    width: 130px;
    height: 110px;
    border: 1px solid rgba(255,255,255,.18);
    border-radius: 12px;
    background: #111;
    display: flex;
    align-items: center;
    justify-content: center;
}

.recall-mini-shape {
    width: 85px;
    height: 70px;
    background: #246bff;
}

/* ============================================================
   OVERLAY
   ============================================================ */

#overlay {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,.82);
    z-index: 1000;
    padding: 25px;
}

#overlay.active {
    display: flex;
}

.overlay-content {
    width: min(360px,90vw);
    text-align: center;
    border: 1px solid rgba(255,255,255,.18);
    border-radius: 12px;
    background: #090909;
    padding: 28px 20px;
}

.overlay-title {
    font-size: 25px;
    font-weight: 900;
    letter-spacing: .08em;
}

.overlay-text {
    margin-top: 12px;
    line-height: 1.5;
    opacity: .7;
}

.overlay-button {
    margin-top: 22px;
    min-width: 180px;
    min-height: 52px;
    border: 1px solid rgba(255,255,255,.5);
    border-radius: 8px;
    background: #151515;
    font-weight: 800;
}

/* ============================================================
   CONFIGURAÇÕES
   ============================================================ */

.back-button {
    position: absolute;
    left: 20px;
    top: calc(env(safe-area-inset-top) + 15px);
    width: 42px;
    height: 42px;
    border: 1px solid rgba(255,255,255,.2);
    border-radius: 50%;
    font-size: 24px;
}

.settings-title {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: .08em;
    margin-bottom: 30px;
}

.setting-row {
    width: min(360px,90vw);
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 0;
    border-bottom: 1px solid rgba(255,255,255,.1);
}

.setting-button {
    min-width: 70px;
    min-height: 40px;
    border: 1px solid rgba(255,255,255,.3);
    border-radius: 8px;
}

/* ============================================================
   RESPONSIVIDADE
   ============================================================ */

@media (max-height: 700px) {
    .game-header {
        padding-top: calc(env(safe-area-inset-top) + 8px);
    }

    .level-question {
        margin-top: 5px;
    }

    .level-content {
        padding-bottom: 60px;
    }
}
</style>
</head>

<body>

<div id="app">

<section id="homeScreen" class="screen active">

    <div class="logo">
        <span class="logo-main">MEMORY</span>
        <span class="logo-sub">TRAP</span>
        <div class="logo-line"></div>
    </div>

    <div id="homeLives" class="lives home-lives"></div>

    <button id="startButton" class="start-button">
        <span class="start-title">INICIAR</span>
        <span class="start-subtitle">MEMORY TRAP</span>
    </button>

    <div class="hall">
        <div class="hall-title">
            HALL DOS SOBREVIVENTES
        </div>

        <div class="hall-mask">
            <div id="hallList" class="hall-list"></div>
        </div>
    </div>

    <button id="menuButton" class="home-menu">☰</button>

</section>


<section id="gameScreen" class="screen">

    <div class="game-header">

        <div id="levelNumber" class="level-number"></div>

        <div id="levelQuestion" class="level-question"></div>

    </div>

    <div id="levelContent" class="level-content"></div>

    <div id="gameLives" class="lives game-lives"></div>

</section>


<section id="settingsScreen" class="screen">

    <button id="backButton" class="back-button">←</button>

    <div class="settings-title">
        CONFIGURAÇÕES
    </div>

    <div class="setting-row">
        <span>SOM</span>
        <button id="soundButton" class="setting-button">
            ON
        </button>
    </div>

    <div class="setting-row">
        <span>VIBRAÇÃO</span>
        <button id="vibrationButton" class="setting-button">
            ON
        </button>
    </div>

</section>


<div id="overlay">

    <div class="overlay-content">

        <div id="overlayTitle" class="overlay-title"></div>

        <div id="overlayText" class="overlay-text"></div>

        <button id="overlayButton" class="overlay-button"></button>

    </div>

</div>

</div>


<script>
"use strict";

/* ============================================================
   CONFIGURAÇÃO
   ============================================================ */

const CONFIG = {
    TOTAL_LEVELS: 100,
    STARTING_LIVES: 5,
    SOUND_ENABLED: true,
    VIBRATION_ENABLED: true,
    SURVIVORS_KEY: "memory_trap_survivors_v1"
};


/* ============================================================
   ESTADO DO JOGO
   ============================================================ */

const GAME = {
    currentLevel: 0,
    lives: CONFIG.STARTING_LIVES,
    totalAttempts: 0,
    mistakes: 0,
    levelTimers: [],
    state: {},
    finished: false
};


/* ============================================================
   DOM
   ============================================================ */

const DOM = {

    homeScreen:
        document.getElementById("homeScreen"),

    gameScreen:
        document.getElementById("gameScreen"),

    settingsScreen:
        document.getElementById("settingsScreen"),

    homeLives:
        document.getElementById("homeLives"),

    gameLives:
        document.getElementById("gameLives"),

    levelNumber:
        document.getElementById("levelNumber"),

    levelQuestion:
        document.getElementById("levelQuestion"),

    levelContent:
        document.getElementById("levelContent"),

    startButton:
        document.getElementById("startButton"),

    menuButton:
        document.getElementById("menuButton"),

    backButton:
        document.getElementById("backButton"),

    soundButton:
        document.getElementById("soundButton"),

    vibrationButton:
        document.getElementById("vibrationButton"),

    hallList:
        document.getElementById("hallList"),

    overlay:
        document.getElementById("overlay"),

    overlayTitle:
        document.getElementById("overlayTitle"),

    overlayText:
        document.getElementById("overlayText"),

    overlayButton:
        document.getElementById("overlayButton")
};


/* ============================================================
   NÍVEIS
   ============================================================ */

const LEVELS = {

    1: { type: "broken-shape" },
    2: { type: "grid" },
    3: { type: "direct-answer" },
    4: { type: "pi" },
    5: { type: "count-circles" },
    6: { type: "appearing-circles" },
    7: {
        type: "no-number-rats",
        hiddenNumber: true
    },
    8: { type: "color-memory" },
    9: { type: "arrow-memory" },
    10: { type: "camouflaged-command" },
    11: { type: "labyrinth-arrows" },
    12: { type: "hold-two-seconds" },
    13: { type: "circle-rhythm" },
    14: { type: "reverse-order" },
    15: { type: "blind-pixel" },
    16: { type: "drag-outside" },
    17: { type: "circle-exclusion" },
    18: { type: "escaping-button" },
    19: { type: "letter-intruder" },
    20: { type: "level1-recall" }
};

for (let i = 21; i <= 100; i++) {

    LEVELS[i] = {
        name: "Nível " + i,
        type: "unimplemented"
    };
}


/* ============================================================
   TIMERS
   ============================================================ */

function clearLevelTimers() {

    GAME.levelTimers.forEach(t => {

        clearTimeout(t);
        clearInterval(t);

    });

    GAME.levelTimers = [];
}


function addLevelTimer(t) {

    if (t != null) {
        GAME.levelTimers.push(t);
    }

    return t;
}


function levelTimeout(
    callback,
    delay,
    level = GAME.currentLevel
) {

    const timer = setTimeout(() => {

        if (GAME.finished) return;

        if (GAME.currentLevel !== level) {
            return;
        }

        callback();

    }, delay);

    addLevelTimer(timer);

    return timer;
}


/* ============================================================
   ÁUDIO
   ============================================================ */

let audioContext = null;

function getAudioContext() {

    if (!audioContext) {

        const Ctx =
            window.AudioContext ||
            window.webkitAudioContext;

        if (Ctx) {

            try {
                audioContext = new Ctx();
            } catch (e) {
                audioContext = null;
            }
        }
    }

    return audioContext;
}


function playTone(
    frequency,
    duration,
    type = "sine",
    volume = 0.035
) {

    if (!CONFIG.SOUND_ENABLED) {
        return;
    }

    const ctx = getAudioContext();

    if (!ctx) {
        return;
    }

    if (ctx.state === "suspended") {
        ctx.resume().catch(() => {});
    }

    try {

        const oscillator =
            ctx.createOscillator();

        const gain =
            ctx.createGain();

        oscillator.type = type;

        oscillator.frequency.setValueAtTime(
            frequency,
            ctx.currentTime
        );

        gain.gain.setValueAtTime(
            volume,
            ctx.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            0.001,
            ctx.currentTime + duration
        );

        oscillator.connect(gain);
        gain.connect(ctx.destination);

        oscillator.start();

        oscillator.stop(
            ctx.currentTime + duration
        );

    } catch (e) {}
}


function soundCorrect() {

    playTone(
        720,
        0.08,
        "sine",
        0.035
    );

    levelTimeout(
        () => {
            playTone(
                920,
                0.06,
                "sine",
                0.025
            );
        },
        65
    );
}


function soundWrong() {

    playTone(
        160,
        0.12,
        "square",
        0.025
    );
}


/* ============================================================
   FEEDBACK
   ============================================================ */

function vibrate(pattern) {

    if (!CONFIG.VIBRATION_ENABLED) {
        return;
    }

    if (
        navigator.vibrate &&
        typeof navigator.vibrate === "function"
    ) {

        try {
            navigator.vibrate(pattern);
        } catch (e) {}
    }
}


function feedbackCorrect() {

    soundCorrect();
    vibrate(25);
}


function feedbackLifeLost() {

    soundWrong();
    vibrate([50,30,70]);
}


/* ============================================================
   VIDAS
   ============================================================ */

function updateLives() {

    const containers = [
        DOM.homeLives,
        DOM.gameLives
    ];

    containers.forEach(container => {

        if (!container) return;

        container.innerHTML = "";

        for (
            let i = 0;
            i < CONFIG.STARTING_LIVES;
            i++
        ) {

            const heart =
                document.createElement("div");

            heart.className =
                "heart" +
                (
                    i >= GAME.lives
                        ? " empty"
                        : ""
                );

            container.appendChild(heart);
        }
    });
}

/* ============================================================
   HALL
   ============================================================ */

function getSurvivors() {

    try {

        const raw =
            localStorage.getItem(
                CONFIG.SURVIVORS_KEY
            );

        if (!raw) return [];

        const parsed =
            JSON.parse(raw);

        return Array.isArray(parsed)
            ? parsed
            : [];

    } catch (e) {

        return [];
    }
}


function saveSurvivor(name) {

    try {

        const list =
            getSurvivors();

        list.push({
            name:
                String(name || "ANÔNIMO")
                    .slice(0,20),
            date:
                Date.now()
        });

        localStorage.setItem(
            CONFIG.SURVIVORS_KEY,
            JSON.stringify(
                list.slice(-50)
            )
        );

    } catch (e) {}
}


function renderHall() {

    const survivors =
        getSurvivors();

    DOM.hallList.innerHTML = "";

    if (survivors.length === 0) {

        const empty =
            document.createElement("div");

        empty.className =
            "hall-empty";

        empty.textContent =
            "NENHUM SOBREVIVENTE";

        DOM.hallList.appendChild(
            empty
        );

        return;
    }

    survivors
        .slice(-20)
        .reverse()
        .forEach(player => {

            const element =
                document.createElement("div");

            element.className =
                "hall-name";

            element.textContent =
                String(
                    player.name ?? ""
                )
                .slice(0,20)
                .toUpperCase();

            DOM.hallList.appendChild(
                element
            );
        });
}


let hallAnim = null;
let hallPos = 0;


function startHallAnimation() {

    if (hallAnim) {

        cancelAnimationFrame(
            hallAnim
        );

        hallAnim = null;
    }

    hallPos = 0;

    function animate() {

        if (
            !DOM.homeScreen.classList.contains(
                "active"
            )
        ) {

            hallAnim = null;
            return;
        }

        const h =
            DOM.hallList.offsetHeight;

        const v =
            DOM.hallList.parentElement.offsetHeight;

        if (h > v) {

            hallPos += .18;

            if (
                hallPos >
                h - v + 25
            ) {

                hallPos = 0;
            }

            DOM.hallList.style.transform =
                `translateY(-${hallPos}px)`;
        }

        hallAnim =
            requestAnimationFrame(
                animate
            );
    }

    animate();
}

/* ============================================================
   CARREGAR NÍVEL
   ============================================================ */

function loadLevel(n) {

    clearLevelTimers();

    GAME.currentLevel = n;
    GAME.state = {};

    const level =
        LEVELS[n];

    if (!level) {

        finishGame();
        return;
    }

    DOM.levelNumber.textContent =
        level.hiddenNumber
            ? ""
            : n;

    DOM.levelQuestion.innerHTML = "";

    DOM.levelContent.innerHTML = "";

    renderLevel(
        n,
        level
    );

    updateLives();
}


/* ============================================================
   FALHA
   ============================================================ */

function failLevel() {

    if (GAME.finished) {
        return;
    }

    if (GAME.state.failLock) {
        return;
    }

    GAME.state.failLock = true;

    GAME.totalAttempts++;
    GAME.mistakes++;
    GAME.lives--;

    feedbackLifeLost();

    updateLives();

    if (GAME.lives <= 0) {

        clearLevelTimers();

        showOverlay(
            "SEM VIDAS",
            "Você perdeu as 5 vidas. O jogo será reiniciado.",
            "RECOMEÇAR",
            () => {

                GAME.lives =
                    CONFIG.STARTING_LIVES;

                GAME.finished = false;
                GAME.state = {};

                updateLives();

                closeOverlay();

                loadLevel(1);
            }
        );

        return;
    }

    clearLevelTimers();

    levelTimeout(
        () => {

            if (
                GAME.finished
            ) {
                return;
            }

            loadLevel(
                GAME.currentLevel
            );

        },
        80,
        GAME.currentLevel
    );
}


/* ============================================================
   COMPLETAR NÍVEL
   ============================================================ */

function completeLevel() {

    if (GAME.finished) {
        return;
    }

    if (GAME.state.completeLock) {
        return;
    }

    GAME.state.completeLock = true;

    feedbackCorrect();

    const next =
        GAME.currentLevel + 1;

    if (
        GAME.currentLevel ===
            CONFIG.TOTAL_LEVELS ||
        !LEVELS[next]
    ) {

        finishGame();
        return;
    }

    const current =
        GAME.currentLevel;

    levelTimeout(
        () => {

            if (
                GAME.currentLevel !==
                current
            ) {
                return;
            }

            loadLevel(next);

        },
        180,
        current
    );
}

/* ============================================================
   NÍVEL 1
   ============================================================ */

function renderLevel1() {

    DOM.levelQuestion.textContent =
        "Complete a figura.";

    const wrap =
        document.createElement("div");

    wrap.className =
        "broken-container";

    wrap.innerHTML = `
        <div
            class="broken-top"
            id="targetArea"
        ></div>

        <div class="broken-pieces-pool">

            <div
                class="puzzle-piece"
                data-correct="false"
                style="clip-path:polygon(
                    0% 100%,100% 100%,100% 28%,
                    86% 2%,77% 32%,61% 4%,
                    50% 32%,36% 3%,25% 32%,
                    11% 2%,0% 28%
                )"
            ></div>

            <div
                class="puzzle-piece"
                data-correct="true"
                style="clip-path:polygon(
                    0% 100%,100% 100%,100% 48%,
                    88% 0%,78% 38%,63% 2%,
                    52% 40%,38% 0%,26% 36%,
                    12% 0%,0% 48%
                )"
            ></div>

            <div
                class="puzzle-piece"
                data-correct="false"
                style="clip-path:polygon(
                    0% 100%,100% 100%,100% 32%,
                    88% 8%,78% 34%,63% 10%,
                    52% 36%,38% 8%,26% 32%,
                    12% 8%,0% 32%
                )"
            ></div>

            <div
                class="puzzle-piece"
                data-correct="false"
                style="clip-path:polygon(
                    0% 100%,100% 100%,100% 30%,
                    88% 4%,79% 30%,64% 6%,
                    53% 32%,39% 4%,27% 30%,
                    13% 4%,0% 30%
                )"
            ></div>

        </div>
    `;

    DOM.levelContent.appendChild(
        wrap
    );

    const pieces =
        wrap.querySelectorAll(
            ".puzzle-piece"
        );

    const target =
        wrap.querySelector(
            "#targetArea"
        );

    pieces.forEach(piece => {

        let startX = 0;
        let startY = 0;

        piece.addEventListener(
            "pointerdown",
            e => {

                if (
                    GAME.currentLevel !== 1
                ) {
                    return;
                }

                piece.setPointerCapture(
                    e.pointerId
                );

                piece.classList.add(
                    "dragging"
                );

                startX = e.clientX;
                startY = e.clientY;

                const move = event => {

                    if (
                        GAME.currentLevel !== 1
                    ) {
                        return;
                    }

                    piece.style.transform =
                        `translate(
                            ${event.clientX - startX}px,
                            ${event.clientY - startY}px
                        )`;
                };

                const up = event => {

                    piece.releasePointerCapture(
                        event.pointerId
                    );

                    piece.classList.remove(
                        "dragging"
                    );

                    piece.removeEventListener(
                        "pointermove",
                        move
                    );

                    piece.removeEventListener(
                        "pointerup",
                        up
                    );

                    const pieceRect =
                        piece.getBoundingClientRect();

                    const targetRect =
                        target.getBoundingClientRect();

                    const distance =
                        Math.hypot(
                            (
                                pieceRect.left +
                                pieceRect.width / 2
                            ) -
                            (
                                targetRect.left +
                                targetRect.width / 2
                            ),

                            (
                                pieceRect.top +
                                pieceRect.height / 2
                            ) -
                            (
                                targetRect.bottom - 20
                            )
                        );

                    if (distance < 110) {

                        if (
                            piece.dataset.correct ===
                            "true"
                        ) {

                            piece.style.opacity =
                                "0";

                            target.classList.add(
                                "filled"
                            );

                            levelTimeout(
                                completeLevel,
                                380,
                                1
                            );

                        } else {

                            piece.style.transform =
                                "translate(0,0)";

                            piece.classList.add(
                                "wrong-shake"
                            );

                            levelTimeout(
                                () => {
                                    piece.classList.remove(
                                        "wrong-shake"
                                    );
                                },
                                400,
                                1
                            );

                            failLevel();
                        }

                    } else {

                        piece.style.transform =
                            "translate(0,0)";
                    }
                };

                piece.addEventListener(
                    "pointermove",
                    move
                );

                piece.addEventListener(
                    "pointerup",
                    up
                );
            }
        );
    });
}

                    () => {

                        if (
                            GAME.currentLevel !== 9
                        ) {
                            return;
                        }

                        if (
                            dir !==
                            sequence[
                                GAME.state.arrowIdx || 0
                            ]
                        ) {

                            failLevel();
                            return;
                        }

                        GAME.state.arrowIdx =
                            (
                                GAME.state.arrowIdx ||
                                0
                            ) + 1;

                        if (
                            GAME.state.arrowIdx >=
                            sequence.length
                        ) {

                            completeLevel();

                        } else {

                            feedbackCorrect();
                        }
                    }
                );
            });

            DOM.levelContent.appendChild(
                grid
            );

        },
        4500,
        9
    );
}

/* ============================================================
   NÍVEL 11
   LABIRINTO DE SETAS
   ============================================================ */

function renderLevel11() {

    DOM.levelQuestion.textContent =
        "Limpe o labirinto, seguindo as setas.";

    const wrap =
        document.createElement("div");

    /*
     * CORREÇÃO PRINCIPAL:
     * O fundo do labirinto é PRETO.
     */

    wrap.style.cssText = `
        position: relative;
        width: min(360px,92vw);
        height: min(520px,72vh);
        margin: 0 auto;
        overflow: hidden;
        background: #000;
        border-radius: 0;
        touch-action: none;
    `;

    wrap.innerHTML = `
        <svg
            id="mazeSvg11"
            viewBox="0 0 100 110"
            preserveAspectRatio="xMidYMid meet"
            style="
                width:100%;
                height:100%;
                display:block;
                overflow:visible;
                touch-action:none;
            "
        >

            <g id="mazeDots11"></g>

            <g id="mazePaths11"></g>

            <g id="mazeArrows11"></g>

        </svg>
    `;

    DOM.levelContent.appendChild(
        wrap
    );

    const svg =
        wrap.querySelector(
            "#mazeSvg11"
        );

    const dotsLayer =
        wrap.querySelector(
            "#mazeDots11"
        );

    const pathsLayer =
        wrap.querySelector(
            "#mazePaths11"
        );

    const arrowsLayer =
        wrap.querySelector(
            "#mazeArrows11"
        );


    /* --------------------------------------------------------
       CORES
       -------------------------------------------------------- */

    const COLORS = {

        grid:
            "rgba(255,255,255,.16)",

        line:
            "#d8c5a8",

        arrow:
            "#d8c5a8"
    };


    /* --------------------------------------------------------
       SVG
       -------------------------------------------------------- */

    function svgElement(name) {

        return document.createElementNS(
            "http://www.w3.org/2000/svg",
            name
        );
    }


    /* --------------------------------------------------------
       GRID DE PONTOS
       -------------------------------------------------------- */

    for (
        let y = 5;
        y <= 105;
        y += 10
    ) {

        for (
            let x = 5;
            x <= 95;
            x += 10
        ) {

            const dot =
                svgElement("circle");

            dot.setAttribute(
                "cx",
                x
            );

            dot.setAttribute(
                "cy",
                y
            );

            dot.setAttribute(
                "r",
                "0.55"
            );

            dot.setAttribute(
                "fill",
                COLORS.grid
            );

            dotsLayer.appendChild(
                dot
            );
        }
    }


    /* --------------------------------------------------------
       CAMINHOS
       
       Dois ramos independentes:

       3 → 4 → 5 → 6

       7 → 1 → 2

       O caminho 6 termina automaticamente.
       -------------------------------------------------------- */

    const paths = [

        {
            id: 3,

            d:
                "M58 28 L58 62 L78 62",

            dir:
                "→",

            ax:
                80,

            ay:
                62,

            free:
                true,

            parent:
                null
        },

        {
            id: 4,

            d:
                "M52 4 L84 4 L84 90 L42 90 L42 82",

            dir:
                "→",

            ax:
                44,

            ay:
                82,

            free:
                false,

            parent:
                3
        },

        {
            id: 5,

            d:
                "M10 88 L10 98 L32 98 L32 88 L44 88",

            dir:
                "→",

            ax:
                46,

            ay:
                88,

            free:
                false,

            parent:
                4
        },

        {
            id: 6,

            d:
                "M52 98 L70 98 L70 88",

            dir:
                "",

            ax:
                70,

            ay:
                88,

            free:
                false,

            parent:
                5,

            auto:
                true
        },

        {
            id: 7,

            d:
                "M10 76 L34 76",

            dir:
                "→",

            ax:
                36,

            ay:
                76,

            free:
                true,

            parent:
                null
        },

        {
            id: 1,

            d:
                "M10 2 L10 65 L46 65",

            dir:
                "→",

            ax:
                48,

            ay:
                65,

            free:
                false,

            parent:
                7
        },

        {
            id: 2,

            d:
                "M32 28 L32 48 L40 48 L40 28 L46 28",

            dir:
                "↑",

            ax:
                46,

            ay:
                26,

            free:
                false,

            parent:
                1
        }
    ];


    let busy = false;

    let finished = false;


    /* --------------------------------------------------------
       TIMER LOCAL DO NÍVEL 11
       -------------------------------------------------------- */

    function levelTimer(
        callback,
        delay
    ) {

        const timer =
            setTimeout(
                () => {

                    if (
                        GAME.currentLevel !== 11
                    ) {
                        return;
                    }

                    callback();

                },
                delay
            );

        addLevelTimer(
            timer
        );

        return timer;
    }


    /* --------------------------------------------------------
       LOCALIZAR CAMINHO
       -------------------------------------------------------- */

    function getPath(id) {

        return paths.find(
            p => p.id === id
        );
    }


    /* --------------------------------------------------------
       CONCLUSÃO
       -------------------------------------------------------- */

    function checkComplete() {

        if (finished) {
            return;
        }

        const remaining =
            paths.filter(
                p => !p.removed
            );

        if (
            remaining.length === 0
        ) {

            finished = true;

            levelTimer(
                () => {

                    completeLevel();

                },
                220
            );
        }
    }


    /* --------------------------------------------------------
       DESENHAR LABIRINTO
       -------------------------------------------------------- */

    function drawMaze() {

        pathsLayer.innerHTML =
            "";

        arrowsLayer.innerHTML =
            "";


        paths.forEach(p => {

            if (p.removed) {
                return;
            }


            /* CAMINHO */

            const path =
                svgElement("path");

            path.setAttribute(
                "d",
                p.d
            );

            path.setAttribute(
                "fill",
                "none"
            );

            path.setAttribute(
                "stroke",
                COLORS.line
            );

            path.setAttribute(
                "stroke-width",
                "1.65"
            );

            path.setAttribute(
                "stroke-linecap",
                "round"
            );

            path.setAttribute(
                "stroke-linejoin",
                "round"
            );

            path.setAttribute(
                "vector-effect",
                "non-scaling-stroke"
            );

            path.dataset.id =
                p.id;


            let length = 0;

            try {

                length =
                    path.getTotalLength();

            } catch (e) {

                length =
                    200;
            }

            if (
                !Number.isFinite(length) ||
                length <= 0
            ) {

                length =
                    200;
            }

            p.length =
                length;


            path.style.strokeDasharray =
                length;

            path.style.strokeDashoffset =
                "0";

            path.style.opacity =
                "1";

            pathsLayer.appendChild(
                path
            );


            /* CAMINHO SEM SETA */

            if (!p.dir) {
                return;
            }


            /* GRUPO DA SETA */

            const arrowGroup =
                svgElement("g");

            arrowGroup.setAttribute(
                "transform",
                `translate(${p.ax} ${p.ay})`
            );

            arrowGroup.setAttribute(
                "data-arrow-id",
                p.id
            );

            arrowGroup.style.cursor =
                p.free
                    ? "pointer"
                    : "default";

            arrowGroup.style.touchAction =
                "none";

            arrowGroup.style.transformOrigin =
                `${p.ax}px ${p.ay}px`;


            /* ÁREA DE TOQUE */

            const hitArea =
                svgElement("circle");

            hitArea.setAttribute(
                "cx",
                "0"
            );

            hitArea.setAttribute(
                "cy",
                "0"
            );

            hitArea.setAttribute(
                "r",
                "7"
            );

            hitArea.setAttribute(
                "fill",
                "transparent"
            );

            hitArea.style.pointerEvents =
                "all";

            arrowGroup.appendChild(
                hitArea
            );


            /* SETA VISUAL */

            const arrow =
                svgElement("text");

            arrow.textContent =
                p.dir;

            arrow.setAttribute(
                "x",
                "0"
            );

            arrow.setAttribute(
                "y",
                "0"
            );

            arrow.setAttribute(
                "text-anchor",
                "middle"
            );

            arrow.setAttribute(
                "dominant-baseline",
                "middle"
            );

            arrow.setAttribute(
                "font-size",
                "7"
            );

            arrow.setAttribute(
                "font-weight",
                "900"
            );

            arrow.setAttribute(
                "font-family",
                "Arial, Helvetica, sans-serif"
            );

            arrow.setAttribute(
                "fill",
                COLORS.arrow
            );

            arrow.style.pointerEvents =
                "none";

            arrowGroup.appendChild(
                arrow
            );


            /* EVENTO */

            arrowGroup.addEventListener(
                "pointerup",
                function(event) {

                    event.preventDefault();
                    event.stopPropagation();

                    if (
                        GAME.currentLevel !== 11
                    ) {
                        return;
                    }

                    if (
                        busy ||
                        finished
                    ) {
                        return;
                    }

                    handleArrow(p);
                }
            );

            arrowsLayer.appendChild(
                arrowGroup
            );
        });
    }


    /* --------------------------------------------------------
       SETA ERRADA
       -------------------------------------------------------- */

    function handleWrongArrow(p) {

        if (
            busy ||
            finished
        ) {
            return;
        }

        busy = true;

        const group =
            arrowsLayer.querySelector(
                `[data-arrow-id="${p.id}"]`
            );


        if (group) {

            group.animate(
                [

                    {
                        transform:
                            `translate(${p.ax}px ${p.ay}px)`
                    },

                    {
                        transform:
                            `translate(${p.ax - 2}px ${p.ay}px)`
                    },

                    {
                        transform:
                            `translate(${p.ax + 2}px ${p.ay}px)`
                    },

                    {
                        transform:
                            `translate(${p.ax - 1}px ${p.ay}px)`
                    },

                    {
                        transform:
                            `translate(${p.ax}px ${p.ay}px)`
                    }

                ],
                {
                    duration: 260,
                    easing: "ease-out"
                }
            );
        }


        levelTimer(
            () => {

                busy = false;

                if (
                    GAME.currentLevel !== 11
                ) {
                    return;
                }

                /*
                 * UMA ÚNICA perda de vida.
                 */
                failLevel();

            },
            280
        );
    }


    /* --------------------------------------------------------
       REMOVER CAMINHO
       -------------------------------------------------------- */

    function removePath(p) {

        if (
            busy ||
            finished
        ) {
            return;
        }

        if (p.removed) {
            return;
        }

        busy = true;

        const pathElement =
            pathsLayer.querySelector(
                `[data-id="${p.id}"]`
            );

        const arrowElement =
            arrowsLayer.querySelector(
                `[data-arrow-id="${p.id}"]`
            );


        feedbackCorrect();


        /* ANIMAÇÃO DA LINHA */

        if (pathElement) {

            const length =
                p.length || 200;

            pathElement.style.transition =
                `
                stroke-dashoffset .62s
                cubic-bezier(.65,0,.35,1),
                opacity .18s ease
                `;

            void pathElement.getBoundingClientRect();

            pathElement.style.strokeDashoffset =
                String(length);

            levelTimer(
                () => {

                    if (
                        GAME.currentLevel !== 11
                    ) {
                        return;
                    }

                    pathElement.style.opacity =
                        "0";

                },
                430
            );
        }


        /* ANIMAÇÃO DA SETA */

        if (arrowElement) {

            let dx = 0;
            let dy = 0;

            if (p.dir === "→") {

                dx = 12;

            } else if (p.dir === "←") {

                dx = -12;

            } else if (p.dir === "↑") {

                dy = -12;

            } else if (p.dir === "↓") {

                dy = 12;
            }


            arrowElement.style.transition =
                `
                transform .58s
                cubic-bezier(.2,.8,.2,1),
                opacity .45s ease
                `;

            arrowElement.style.transform =
                `translate(
                    ${p.ax + dx}px
                    ${p.ay + dy}px
                )`;

            arrowElement.style.opacity =
                "0";
        }


        /* FINAL DA ANIMAÇÃO */

        levelTimer(
            () => {

                if (
                    GAME.currentLevel !== 11
                ) {
                    return;
                }


                p.removed =
                    true;


                /*
                 * Libera os filhos.
                 */

                paths.forEach(child => {

                    if (
                        child.parent === p.id
                    ) {

                        child.free =
                            true;
                    }
                });


                busy = false;


                if (
                    paths.every(
                        x => x.removed
                    )
                ) {

                    checkComplete();

                    return;
                }


                drawMaze();


                /*
                 * Se um caminho automático
                 * ficou livre, ele é removido
                 * sozinho.
                 */

                const autoPath =
                    paths.find(
                        x =>
                            !x.removed &&
                            x.free &&
                            x.auto
                    );


                if (autoPath) {

                    levelTimer(
                        () => {

                            if (
                                GAME.currentLevel !== 11 ||
                                busy ||
                                finished
                            ) {
                                return;
                            }

                            removePath(
                                autoPath
                            );

                        },
                        180
                    );
                }


                checkComplete();

            },
            650
        );
    }


    /* --------------------------------------------------------
       TRATAMENTO DA SETA
       -------------------------------------------------------- */

    function handleArrow(p) {

        if (!p.free) {

            handleWrongArrow(p);

            return;
        }

        removePath(p);
    }


    /* --------------------------------------------------------
       PRIMEIRO DESENHO
       -------------------------------------------------------- */

    drawMaze();


    /*
     * Verificação de caminho automático
     * inicial.
     */

    const firstAuto =
        paths.find(
            p =>
                p.free &&
                p.auto &&
                !p.removed
        );


    if (firstAuto) {

        levelTimer(
            () => {

                if (
                    GAME.currentLevel !== 11 ||
                    busy ||
                    finished
                ) {
                    return;
                }

                removePath(
                    firstAuto
                );

            },
            250
        );
    }
}

            holding
        ) {

        holding = true;

        timer =
            levelTimeout(
                () => {

                    holding = false;

                    completeLevel();

                },
                2000,
                12
            );
    }

    function cancelHold() {

        if (!holding) {
            return;
        }

        holding = false;

        if (timer) {

            clearTimeout(
                timer
            );
        }

        failLevel();
    }

    button.addEventListener(
        "pointerdown",
        startHold
    );

    button.addEventListener(
        "pointerup",
        () => {

            if (holding) {
                cancelHold();
            }
        }
    );

    button.addEventListener(
        "pointercancel",
        cancelHold
    );
}

/* ============================================================
   NÍVEL 16
   ============================================================ */

function renderLevel16() {

    DOM.levelQuestion.textContent =
        "Arraste o objeto para fora.";

    const field =
        document.createElement("div");

    field.className =
        "drag-field-16";

    const target =
        document.createElement("div");

    target.className =
        "drag-target-16";

    const object =
        document.createElement("div");

    object.className =
        "drag-object-16";

    field.appendChild(
        target
    );

    field.appendChild(
        object
    );

    DOM.levelContent.appendChild(
        field
    );

    let startX = 0;
    let startY = 0;

    object.addEventListener(
        "pointerdown",
        e => {

            if (
                GAME.currentLevel !== 16
            ) {
                return;
            }

            object.setPointerCapture(
                e.pointerId
            );

            startX =
                e.clientX;

            startY =
                e.clientY;

            const move =
                event => {

                    object.style.transform =
                        `translate(
                            ${event.clientX - startX}px,
                            ${event.clientY - startY}px
                        )`;
                };

            const up =
                event => {

                    object.releasePointerCapture(
                        event.pointerId
                    );

                    object.removeEventListener(
                        "pointermove",
                        move
                    );

                    object.removeEventListener(
                        "pointerup",
                        up
                    );

                    const rect =
                        object.getBoundingClientRect();

                    if (
                        rect.left < 0 ||
                        rect.right >
                            window.innerWidth ||
                        rect.top < 50 ||
                        rect.bottom >
                            window.innerHeight - 10
                    ) {

                        completeLevel();

                    } else {

                        object.style.transform =
                            "translate(0,0)";
                    }
                };

            object.addEventListener(
                "pointermove",
                move
            );

            object.addEventListener(
                "pointerup",
                up
            );
        }
    );
}

    ];

    items.forEach(item => {

                ) {

                    remaining--;

                    feedbackCorrect();

                    if (
                        remaining === 0
                    ) {

                        completeLevel();
                    }
                }
            }
        );
    });

    DOM.levelContent.appendChild(
        field
    );
}


/* ============================================================
   NÍVEL 18
   ============================================================ */

function renderLevel18() {

    DOM.levelQuestion.textContent =
        "Toque no botão fujão.";

    const field =
        document.createElement("div");

    field.style.cssText =
        "position:absolute;inset:0";

    const button =
        document.createElement("button");

    button.className =
        "escaping-btn-18";

    button.textContent =
        "PEGUE-ME";

    button.style.left =
        "calc(50% - 65px)";

    button.style.top =
        "calc(50% - 30px)";

    field.appendChild(
        button
    );

    DOM.levelContent.appendChild(
        field
    );

    let escapes = 0;

    button.addEventListener(
        "pointerdown",
        e => {

            e.preventDefault();

            if (
                GAME.currentLevel !== 18
            ) {
                return;
            }

            escapes++;

            if (
                escapes >= 3
            ) {

                completeLevel();

            } else {

                flee();
            }
        }
    );

    function flee() {

        const maxX =
            Math.max(
                0,
                window.innerWidth - 150
            );

        const maxY =
            Math.max(
                80,
                window.innerHeight - 200
            );

        button.style.left =
            Math.random() *
            maxX +
            "px";

        button.style.top =
            (
                Math.random() *
                (maxY - 80) +
                80
            ) +
            "px";
    }
}


/* ============================================================
   NÍVEL 19
   ============================================================ */

function renderLevel19() {

    DOM.levelQuestion.textContent =
        "Encontre o caractere diferente.";

    const grid =
        document.createElement("div");

    grid.className =
        "intruder-grid-19";

    const target =
        Math.floor(
            Math.random() * 25
        );

    for (
        let i = 0;
        i < 25;
        i++
    ) {

        const cell =
            document.createElement("button");

        cell.className =
            "intruder-cell";

        cell.textContent =
            i === target
                ? "X"
                : "O";

        grid.appendChild(
            cell
        );

        cell.addEventListener(
            "pointerup",
            () => {

                if (
                    GAME.currentLevel !== 19
                ) {
                    return;
                }

                if (
                    i === target
                ) {

                    completeLevel();

                } else {

                    failLevel();
                }
            }
        );
    }

    DOM.levelContent.appendChild(
        grid
    );
}


/* ============================================================
   NÍVEL 20
   ============================================================ */

function renderLevel20() {

    DOM.levelQuestion.textContent =
        "Qual era a forma do Nível 1?";

    const grid =
        document.createElement("div");

    grid.className =
        "recall-grid-20";

    for (
        let i = 0;
        i < 4;
        i++
    ) {

        const button =
            document.createElement("button");

        button.className =
            "recall-shape-btn";

        const shape =
            document.createElement("div");

        shape.className =
            "recall-mini-shape";


        if (i === 1) {

            shape.style.clipPath =
                "polygon(" +
                "0% 0%,100% 0%,100% 50%," +
                "82% 100%,65% 60%,50% 95%," +
                "35% 60%,18% 100%,0% 50%" +
                ")";

        } else if (i === 0) {

            shape.style.clipPath =
                "polygon(" +
                "0% 0%,100% 0%,100% 100%,0% 100%" +
                ")";

        } else if (i === 2) {

            shape.style.clipPath =
                "polygon(" +
                "50% 0%,100% 100%,0% 100%" +
                ")";

        } else {

            shape.style.clipPath =
                "polygon(" +
                "0% 20%,100% 0%,100% 80%,0% 100%" +
                ")";
        }

        button.appendChild(
            shape
        );

        grid.appendChild(
            button
        );

        button.addEventListener(
            "pointerup",
            () => {

                if (
                    GAME.currentLevel !== 20
                ) {
                    return;
                }

                if (i === 1) {

                    completeLevel();

                } else {

                    failLevel();
                }
            }
        );
    }

    DOM.levelContent.appendChild(
        grid
    );
}


/* ============================================================
   NÍVEIS NÃO IMPLEMENTADOS
   ============================================================ */

function renderUnimplementedLevel(
    n,
    level
) {

    const wrapper =
        document.createElement("div");

    wrapper.style.cssText =
        "text-align:center;width:100%";

    wrapper.innerHTML = `

        <div>
            ${level.name}
        </div>

        <div
            style="
                font-size:12px;
                opacity:.5;
                margin-top:20px
            "
        >
            MECÂNICA RESERVADA
        </div>

        <button
            class="blue-choice"
            style="
                display:block;
                width:180px;
                margin:30px auto 0
            "
        >
            TESTAR
        </button>
    `;

    DOM.levelContent.appendChild(
        wrapper
    );

    wrapper
        .querySelector("button")
        .addEventListener(
            "pointerup",
            () => {

                if (
                    GAME.currentLevel !== n
                ) {
                    return;
                }

                completeLevel();
            }
        );
}


/* ============================================================
   FINAL
   ============================================================ */

function finishGame() {

    clearLevelTimers();

    GAME.finished = true;

    showOverlay(
        "PARABÉNS",
        "Você concluiu o MEMORY TRAP!",
        "REINICIAR",
        () => {

            GAME.finished = false;

            closeOverlay();

            goHome();
        }
    );
}


/* ============================================================
   CONFIGURAÇÕES
   ============================================================ */

function updateSettingsUI() {

    DOM.soundButton.textContent =
        CONFIG.SOUND_ENABLED
            ? "ON"
            : "OFF";

    DOM.vibrationButton.textContent =
        CONFIG.VIBRATION_ENABLED
            ? "ON"
            : "OFF";
}


DOM.soundButton.addEventListener(
    "pointerup",
    () => {

        CONFIG.SOUND_ENABLED =
            !CONFIG.SOUND_ENABLED;

        updateSettingsUI();
    }
);


DOM.vibrationButton.addEventListener(
    "pointerup",
    () => {

        CONFIG.VIBRATION_ENABLED =
            !CONFIG.VIBRATION_ENABLED;

        updateSettingsUI();
    }
);


DOM.startButton.addEventListener(
    "pointerup",
    startGame
);


DOM.menuButton.addEventListener(
    "pointerup",
    () => {

        clearLevelTimers();

        showScreen(
            DOM.settingsScreen
        );
    }
);


DOM.backButton.addEventListener(
    "pointerup",
    () => {

        clearLevelTimers();

        showScreen(
            DOM.homeScreen
        );

        startHallAnimation();
    }
);


/* ============================================================
   PROTEÇÕES
   ============================================================ */

document.addEventListener(
    "contextmenu",
    event => {
        event.preventDefault();
    }
);


document.addEventListener(
    "touchmove",
    event => {

        if (event.cancelable) {
            event.preventDefault();
        }

    },
    {
        passive: false
    }
);


/* ============================================================
   INIT
   ============================================================ */

function init() {

    updateLives();

    renderHall();

    updateSettingsUI();

    startHallAnimation();
}

init();

</script>
