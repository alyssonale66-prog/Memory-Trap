<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no,
               viewport-fit=cover">

<meta name="theme-color" content="#000000">

<title>MEMORY TRAP</title>

<style>
/* ============================================================
   MEMORY TRAP
   CSS — BASE VISUAL
   ============================================================ */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    color: #fff;
    font-family:
        Arial,
        Helvetica,
        sans-serif;
    touch-action: none;
}

body {
    position: fixed;
    inset: 0;
}

button {
    font: inherit;
    color: inherit;
    border: 0;
    outline: 0;
    background: none;
    touch-action: none;
}

#app {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

/* ============================================================
   TELAS
   ============================================================ */

.screen {
    position: absolute;
    inset: 0;
    display: none;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

.screen.active {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

/* ============================================================
   HOME
   ============================================================ */

#homeScreen {
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding:
        calc(env(safe-area-inset-top) + 28px)
        22px
        calc(env(safe-area-inset-bottom) + 20px);
}

.logo {
    text-align: center;
    line-height: .82;
    margin-top: 10px;
    pointer-events: none;
}

.logo-main {
    display: block;
    font-size: clamp(46px, 15vw, 88px);
    font-weight: 900;
    letter-spacing: .10em;
}

.logo-sub {
    display: block;
    margin-top: 12px;
    font-size: clamp(18px, 5vw, 30px);
    font-weight: 700;
    letter-spacing: .45em;
    padding-left: .45em;
}

.logo-line {
    width: min(280px, 70vw);
    height: 1px;
    margin: 20px auto 0;
    background: rgba(255,255,255,.45);
}

/* ============================================================
   VIDAS
   ============================================================ */

.lives {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
}

.home-lives {
    margin-top: 32px;
}

.heart {
    position: relative;
    width: 22px;
    height: 22px;
    transform: rotate(-45deg);
    border-radius: 3px;
    background: #ff3b30;
}

.heart::before,
.heart::after {
    content: "";
    position: absolute;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #ff3b30;
}

.heart::before {
    top: -11px;
    left: 0;
}

.heart::after {
    top: 0;
    left: 11px;
}

.heart.empty {
    background: #333333;
}

.heart.empty::before,
.heart.empty::after {
    background: #333333;
}

/* ============================================================
   BOTÃO PRINCIPAL
   ============================================================ */

.start-button {
    position: relative;
    width: min(330px, 84vw);
    min-height: 82px;
    margin-top: 42px;
    padding: 18px 28px;
    border: 1px solid rgba(255,255,255,.75);
    border-radius: 4px;
    background: #050505;
    overflow: hidden;
}

.start-button::before {
    content: "";
    position: absolute;
    inset: -100%;
    background: linear-gradient(
        120deg,
        transparent 42%,
        rgba(255,255,255,.12) 50%,
        transparent 58%
    );
    animation: buttonShine 4s linear infinite;
}

.start-button:active {
    transform: scale(.97);
}

.start-title {
    position: relative;
    display: block;
    font-size: 27px;
    font-weight: 900;
    letter-spacing: .15em;
}

.start-subtitle {
    position: relative;
    display: block;
    margin-top: 7px;
    font-size: 11px;
    letter-spacing: .25em;
    opacity: .55;
}

@keyframes buttonShine {
    0% {
        transform: translate(-30%, -30%);
    }

    100% {
        transform: translate(30%, 30%);
    }
}

/* ============================================================
   HALL
   ============================================================ */

.hall {
    position: relative;
    width: min(390px, 92vw);
    height: 190px;
    margin-top: 35px;
    overflow: hidden;
    border-top: 1px solid rgba(255,255,255,.12);
    border-bottom: 1px solid rgba(255,255,255,.12);
}

.hall-title {
    position: absolute;
    top: 12px;
    left: 0;
    right: 0;
    z-index: 3;
    text-align: center;
    font-size: 11px;
    letter-spacing: .28em;
    opacity: .5;
}

.hall-mask {
    position: absolute;
    inset: 0;
    overflow: hidden;
    padding-top: 38px;
}

.hall-list {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    transform: translateY(0);
}

.hall-name {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: .12em;
    white-space: nowrap;
    opacity: .82;
}

.hall-empty {
    margin-top: 48px;
    font-size: 12px;
    letter-spacing: .18em;
    opacity: .28;
}

/* ============================================================
   MENU SECUNDÁRIO
   ============================================================ */

.home-menu {
    position: absolute;
    right: 20px;
    bottom: calc(env(safe-area-inset-bottom) + 20px);
    width: 48px;
    height: 48px;
    border: 1px solid rgba(255,255,255,.22);
    border-radius: 50%;
    font-size: 22px;
    opacity: .7;
}

.home-menu:active {
    transform: scale(.9);
}

/* ============================================================
   GAME SCREEN
   ============================================================ */

#gameScreen {
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #000;
}

.game-header {
    position: absolute;
    top: calc(env(safe-area-inset-top) + 18px);
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    z-index: 20;
}

.level-number {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: .15em;
}

.level-content {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding:
        70px
        20px
        90px;
    gap: 15px;
}

/* ============================================================
   VIDAS NO JOGO
   ============================================================ */

.game-lives {
    position: absolute;
    left: 0;
    right: 0;
    bottom: calc(env(safe-area-inset-bottom) + 20px);
    z-index: 30;
}

/* ============================================================
   TEXTOS E PERGUNTAS
   ============================================================ */

.level-question {
    width: 100%;
    text-align: center;
    font-size: clamp(18px, 4.5vw, 24px);
    font-weight: 700;
    line-height: 1.35;
}

.small-text {
    font-size: 12px;
    opacity: .5;
    letter-spacing: .12em;
}

/* ============================================================
   OPÇÕES
   ============================================================ */

.options {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
    width: min(360px, 90vw);
    margin-top: 10px;
}

.choice {
    min-height: 60px;
    border: 1px solid rgba(255,255,255,.45);
    background: #050505;
    border-radius: 8px;
    font-size: 18px;
    font-weight: 700;
}

.choice:active {
    transform: scale(.95);
    background: #151515;
}

/* ============================================================
   NÍVEL 1
   ============================================================ */

.broken-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    gap: 15px;
}

.broken-shape {
    position: relative;
    width: 130px;
    height: 130px;
}

.broken-square {
    position: absolute;
    width: 65px;
    height: 65px;
    border: 3px solid #fff;
}

.bs1 { top: 0; left: 0; }
.bs2 { top: 0; right: 0; }
.bs3 { bottom: 0; left: 0; }
.bs4 { bottom: 0; right: 0; }

/* ============================================================
   NÍVEL 2 (4 Retângulos Azuis com Bordas Arredondadas)
   ============================================================ */

.grid2 {
    display: grid;
    grid-template-columns: repeat(2, 120px);
    grid-template-rows: repeat(2, 60px);
    gap: 12px;
    justify-content: center;
}

.blue-block {
    background: #246bff;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,.2);
}

.blue-block:active {
    transform: scale(.95);
    background: #1a53cc;
}

/* ============================================================
   NÍVEL 5
   ============================================================ */

.circle-field {
    position: relative;
    width: min(350px, 90vw);
    height: 160px;
}

.target-circle,
.target-square,
.target-rect {
    position: absolute;
}

.target-circle {
    border-radius: 50%;
    background: #fff;
}

.target-square {
    background: #fff;
}

.target-rect {
    background: #fff;
}

/* ============================================================
   NÍVEL 6
   ============================================================ */

.appear-circle {
    position: absolute;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: #fff;
}

/* ============================================================
   NÍVEL 7 (RATOS: 5 girando + 1 pequeno escondendo atrás da pergunta)
   ============================================================ */

.rats-wrap {
    position: relative;
    width: 100%;
    height: 160px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.circling-rat {
    position: absolute;
    font-size: 26px;
    animation: ratCircle 4s linear infinite;
}

@keyframes ratCircle {
    0% { transform: translate(-45px, 0) rotate(0deg); }
    25% { transform: translate(0, -35px) rotate(90deg); }
    50% { transform: translate(45px, 0) rotate(180deg); }
    75% { transform: translate(0, 35px) rotate(270deg); }
    100% { transform: translate(-45px, 0) rotate(360deg); }
}

.hiding-rat {
    position: absolute;
    font-size: 16px;
    top: 0px;
    left: 50%;
    transform: translateX(-50%);
    animation: ratPeek 3s ease-in-out infinite;
    z-index: 5;
}

@keyframes ratPeek {
    0%, 100% { transform: translateX(-50%) translateY(0); opacity: 0.2; }
    50% { transform: translateX(-50%) translateY(14px); opacity: 1; }
}

/* ============================================================
   NÍVEL 8
   ============================================================ */

.color-memory {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
}

.color-sequence {
    display: flex;
    gap: 8px;
}

.color-box {
    width: 36px;
    height: 36px;
    border-radius: 3px;
}

.color-red { background: #ff3030; }
.color-blue { background: #3080ff; }
.color-green { background: #35c96b; }
.color-yellow { background: #ffd83d; }
.color-purple { background: #9c55ff; }
.color-orange { background: #ff8a30; }
.color-white { background: #fff; }

.color-options {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    width: min(340px, 90vw);
}

.color-option {
    height: 58px;
    border: 1px solid rgba(255,255,255,.2);
    border-radius: 8px;
}

/* ============================================================
   NÍVEL 9
   ============================================================ */

.arrow-memory {
    display: flex;
    gap: 18px;
    align-items: center;
    justify-content: center;
}

.memory-arrow {
    font-size: 45px;
    font-weight: 900;
}

/* ============================================================
   NÍVEL 10
   ============================================================ */

.camouflage-area {
    position: relative;
    width: min(360px, 90vw);
    min-height: 180px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
}

.fake-button {
    width: 120px;
    height: 55px;
    border: 1px solid #151515;
    color: #101010;
    background: #050505;
    border-radius: 8px;
}

.hidden-real-button {
    color: #090909;
    background: #000;
    font-size: 16px;
}

/* ============================================================
   TRANSIÇÕES E OVERLAYS
   ============================================================ */

#overlay {
    position: absolute;
    inset: 0;
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
    background: #000;
}

#overlay.active {
    display: flex;
}

.overlay-content {
    width: min(350px, 88vw);
    text-align: center;
}

.overlay-title {
    font-size: 30px;
    font-weight: 900;
    letter-spacing: .1em;
}

.overlay-text {
    margin-top: 15px;
    font-size: 14px;
    line-height: 1.5;
    opacity: .7;
}

.overlay-button {
    margin-top: 28px;
    padding: 15px 28px;
    border: 1px solid rgba(255,255,255,.5);
    border-radius: 8px;
}

/* ============================================================
   SETTINGS
   ============================================================ */

#settingsScreen {
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding:
        calc(env(safe-area-inset-top) + 40px)
        25px
        calc(env(safe-area-inset-bottom) + 25px);
}

.settings-title {
    font-size: 25px;
    font-weight: 900;
    letter-spacing: .15em;
}

.setting-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: min(360px, 90vw);
    margin-top: 25px;
    padding: 18px 0;
    border-bottom: 1px solid rgba(255,255,255,.12);
}

.setting-button {
    min-width: 70px;
    padding: 9px 15px;
    border: 1px solid rgba(255,255,255,.3);
    border-radius: 8px;
}

.back-button {
    position: absolute;
    left: 20px;
    top: calc(env(safe-area-inset-top) + 20px);
    padding: 10px;
    opacity: .6;
}

@media (max-height: 650px) {
    .logo-main {
        font-size: 45px;
    }
    .home-lives {
        margin-top: 20px;
    }
    .start-button {
        margin-top: 25px;
    }
    .hall {
        margin-top: 20px;
        height: 140px;
    }
}
</style>
</head>

<body>

<div id="app">

    <!-- TELA INICIAL -->
    <section id="homeScreen" class="screen active">

        <div class="logo">
            <span class="logo-main">MEMORY</span>
            <span class="logo-sub">TRAP</span>
            <div class="logo-line"></div>
        </div>

        <div id="homeLives" class="lives home-lives"></div>

        <button id="startButton" class="start-button">
            <span class="start-title">INICIAR</span>
            <span class="start-subtitle">MEMORY TRAP</span>
        </button>

        <div class="hall">
            <div class="hall-title">HALL DOS SOBREVIVENTES</div>
            <div class="hall-mask">
                <div id="hallList" class="hall-list"></div>
            </div>
        </div>

        <button id="menuButton" class="home-menu" aria-label="Menu">☰</button>

    </section>

    <!-- TELA DO JOGO -->
    <section id="gameScreen" class="screen">
        <div class="game-header">
            <div id="levelNumber" class="level-number"></div>
        </div>

        <div id="levelContent" class="level-content"></div>

        <div id="gameLives" class="lives game-lives"></div>
    </section>

    <!-- CONFIGURAÇÕES -->
    <section id="settingsScreen" class="screen">
        <button id="backButton" class="back-button">←</button>
        <div class="settings-title">CONFIGURAÇÕES</div>

        <div class="setting-row">
            <span>SOM</span>
            <button id="soundButton" class="setting-button">ON</button>
        </div>

        <div class="setting-row">
            <span>VIBRAÇÃO</span>
            <button id="vibrationButton" class="setting-button">ON</button>
        </div>
    </section>

    <!-- OVERLAY -->
    <div id="overlay">
        <div class="overlay-content">
            <div id="overlayTitle" class="overlay-title"></div>
            <div id="overlayText" class="overlay-text"></div>
            <button id="overlayButton" class="overlay-button"></button>
        </div>
    </div>

</div>

<script>
/* ============================================================
   MEMORY TRAP — JAVASCRIPT
   ============================================================ */

const CONFIG = {
    TOTAL_LEVELS: 10, // Limitado aos 10 primeiros níveis nesta etapa
    STARTING_LIVES: 5,
    SOUND_ENABLED: true,
    VIBRATION_ENABLED: true,
    STORAGE_KEY: "memory_trap_save_v1",
    SURVIVORS_KEY: "memory_trap_survivors_v1"
};

const GAME = {
    currentLevel: 0,
    lives: CONFIG.STARTING_LIVES,
    totalAttempts: 0,
    mistakes: 0,
    levelAttempts: 0,
    startedAt: null,
    levelStartedAt: null,
    timer: null,
    levelTimers: [],
    sequenceIndex: 0,
    state: {},
    finished: false
};

const DOM = {
    homeScreen: document.getElementById("homeScreen"),
    gameScreen: document.getElementById("gameScreen"),
    settingsScreen: document.getElementById("settingsScreen"),
    homeLives: document.getElementById("homeLives"),
    gameLives: document.getElementById("gameLives"),
    levelNumber: document.getElementById("levelNumber"),
    levelContent: document.getElementById("levelContent"),
    startButton: document.getElementById("startButton"),
    menuButton: document.getElementById("menuButton"),
    backButton: document.getElementById("backButton"),
    soundButton: document.getElementById("soundButton"),
    vibrationButton: document.getElementById("vibrationButton"),
    hallList: document.getElementById("hallList"),
    overlay: document.getElementById("overlay"),
    overlayTitle: document.getElementById("overlayTitle"),
    overlayText: document.getElementById("overlayText"),
    overlayButton: document.getElementById("overlayButton")
};

const LEVELS = {
    1: { name: "Peça Quebrada", type: "broken-shape" },
    2: { name: "Quadrado Azul", type: "grid" },
    3: { name: "Toque no Certo", type: "direct-answer" },
    4: { name: "Mais Próximo de Pi", type: "pi" },
    5: { name: "Quantos Círculos?", type: "count-circles" },
    6: { name: "Círculos em Sequência", type: "appearing-circles" },
    7: { name: "Sem Número — Ratos", type: "no-number-rats", hiddenNumber: true },
    8: { name: "Memória das Cores", type: "color-memory" },
    9: { name: "Memória Direcional", type: "arrow-memory" },
    10: { name: "Botão Camuflado", type: "camouflaged-command" }
};

function clearLevelTimers() {
    GAME.levelTimers.forEach(timer => {
        clearTimeout(timer);
        clearInterval(timer);
    });
    GAME.levelTimers = [];
    if (GAME.timer) {
        clearTimeout(GAME.timer);
        clearInterval(GAME.timer);
        GAME.timer = null;
    }
}

function addLevelTimer(timer) {
    GAME.levelTimers.push(timer);
}

let audioContext = null;
function getAudioContext() {
    if (!audioContext) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return null;
        audioContext = new AudioCtx();
    }
    return audioContext;
}

function playTone(frequency, duration, type = "sine", volume = 0.035) {
    if (!CONFIG.SOUND_ENABLED) return;
    const ctx = getAudioContext();
    if (!ctx) return;
    if (ctx.state === "suspended") ctx.resume().catch(() => {});

    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(frequency, ctx.currentTime);
    gain.gain.setValueAtTime(volume, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);

    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + duration);
}

function soundCorrect() {
    playTone(720, .08, "sine", .035);
    setTimeout(() => playTone(960, .07, "sine", .025), 45);
}

function soundError() {
    playTone(130, .15, "square", .04);
}

function soundLifeLost() {
    playTone(95, .25, "sawtooth", .05);
}

function soundVictory() {
    const notes = [392, 494, 587, 784];
    notes.forEach((note, index) => {
        setTimeout(() => playTone(note, .25, "sine", .045), index * 150);
    });
}

function vibrate(pattern) {
    if (!CONFIG.VIBRATION_ENABLED || !("vibrate" in navigator)) return;
    try { navigator.vibrate(pattern); } catch (e) {}
}

function feedbackCorrect() {
    soundCorrect();
    vibrate(18);
}

function feedbackLifeLost() {
    soundLifeLost();
    vibrate([60, 40, 80]);
}

function renderLives(container) {
    container.innerHTML = "";
    for (let i = 0; i < CONFIG.STARTING_LIVES; i++) {
        const heart = document.createElement("div");
        heart.className = "heart";
        if (i >= GAME.lives) heart.classList.add("empty");
        container.appendChild(heart);
    }
}

function updateLives() {
    renderLives(DOM.homeLives);
    renderLives(DOM.gameLives);
}

function showScreen(screen) {
    document.querySelectorAll(".screen").forEach(el => el.classList.remove("active"));
    screen.classList.add("active");
}

function goHome() {
    clearLevelTimers();
    GAME.finished = false;
    updateLives();
    showScreen(DOM.homeScreen);
    startHallAnimation();
}

function getSurvivors() {
    try {
        const raw = localStorage.getItem(CONFIG.SURVIVORS_KEY);
        return raw ? JSON.parse(raw) : [];
    } catch { return []; }
}

function saveSurvivor(name, stats) {
    const survivors = getSurvivors();
    survivors.push({ name, attempts: stats.attempts, mistakes: stats.mistakes, time: stats.time, date: Date.now() });
    localStorage.setItem(CONFIG.SURVIVORS_KEY, JSON.stringify(survivors));
    renderHall();
}

function renderHall() {
    const survivors = getSurvivors();
    DOM.hallList.innerHTML = "";
    if (survivors.length === 0) {
        const empty = document.createElement("div");
        empty.className = "hall-empty";
        empty.textContent = "NENHUM SOBREVIVENTE";
        DOM.hallList.appendChild(empty);
        return;
    }
    survivors.slice(-20).reverse().forEach(player => {
        const name = document.createElement("div");
        name.className = "hall-name";
        name.textContent = String(player.name).slice(0, 20).toUpperCase();
        DOM.hallList.appendChild(name);
    });
}

let hallAnimationFrame = null;
let hallPosition = 0;
function startHallAnimation() {
    if (hallAnimationFrame) cancelAnimationFrame(hallAnimationFrame);
    hallPosition = 0;
    function animate() {
        if (!DOM.homeScreen.classList.contains("active")) return;
        const height = DOM.hallList.offsetHeight;
        const visible = DOM.hallList.parentElement.offsetHeight;
        if (height > visible) {
            hallPosition += 0.18;
            if (hallPosition > height - visible + 30) hallPosition = 0;
            DOM.hallList.style.transform = `translateY(-${hallPosition}px)`;
        }
        hallAnimationFrame = requestAnimationFrame(animate);
    }
    animate();
}

function startGame() {
    clearLevelTimers();
    GAME.currentLevel = 1;
    GAME.lives = CONFIG.STARTING_LIVES;
    GAME.totalAttempts = 0;
    GAME.mistakes = 0;
    GAME.levelAttempts = 0;
    GAME.startedAt = Date.now();
    GAME.finished = false;
    updateLives();
    showScreen(DOM.gameScreen);
    loadLevel(1);
}

function loadLevel(levelNumber) {
    clearLevelTimers();
    GAME.currentLevel = levelNumber;
    GAME.levelStartedAt = Date.now();
    GAME.levelAttempts = 0;
    GAME.sequenceIndex = 0;
    GAME.state = {};

    const level = LEVELS[levelNumber];
    if (!level) {
        finishGame();
        return;
    }

    if (level.hiddenNumber) {
        DOM.levelNumber.textContent = "";
    } else {
        DOM.levelNumber.textContent = levelNumber;
    }

    DOM.levelContent.innerHTML = "";
    renderLevel(levelNumber, level);
    updateLives();
}

function failLevel() {
    if (GAME.finished) return;
    GAME.levelAttempts++;
    GAME.totalAttempts++;
    GAME.mistakes++;
    GAME.lives--;
    feedbackLifeLost();
    updateLives();

    if (GAME.lives <= 0) {
        clearLevelTimers();
        showOverlay("SEM VIDAS", "Você perdeu as 5 vidas. O jogo será reiniciado.", "RECOMEÇAR", () => {
            GAME.lives = CONFIG.STARTING_LIVES;
            updateLives();
            closeOverlay();
            loadLevel(GAME.currentLevel);
        });
        return;
    }

    showOverlay("ERRO", "Você continua no mesmo nível.", "TENTAR NOVAMENTE", () => {
        closeOverlay();
        loadLevel(GAME.currentLevel);
    });
}

function completeLevel() {
    if (GAME.finished) return;
    feedbackCorrect();
    const next = GAME.currentLevel + 1;
    if (GAME.currentLevel === CONFIG.TOTAL_LEVELS || !LEVELS[next]) {
        finishGame();
        return;
    }
    setTimeout(() => { loadLevel(next); }, 180);
}

function showOverlay(title, text, buttonText, action) {
    DOM.overlayTitle.textContent = title;
    DOM.overlayText.textContent = text;
    DOM.overlayButton.textContent = buttonText;
    DOM.overlayButton.onclick = action;
    DOM.overlay.classList.add("active");
}

function closeOverlay() {
    DOM.overlay.classList.remove("active");
}

function renderLevel(number, level) {
    switch (level.type) {
        case "broken-shape": renderLevel1(); break;
        case "grid": renderLevel2(); break;
        case "direct-answer": renderLevel3(); break;
        case "pi": renderLevel4(); break;
        case "count-circles": renderLevel5(); break;
        case "appearing-circles": renderLevel6(); break;
        case "no-number-rats": renderLevel7(); break;
        case "color-memory": renderLevel8(); break;
        case "arrow-memory": renderLevel9(); break;
        case "camouflaged-command": renderLevel10(); break;
        default: completeLevel(); break;
    }
}

/* NÍVEL 8 */
function renderLevel8() {
    const sequence = ["red", "blue", "green", "yellow", "purple", "orange", "white"];
    const colors = {
        red: "color-red", blue: "color-blue", green: "color-green",
        yellow: "color-yellow", purple: "color-purple", orange: "color-orange", white: "color-white"
    };
    const shuffled = ["green", "orange", "red", "white", "purple", "blue", "yellow"];

    const wrap = document.createElement("div");
    wrap.className = "color-memory";

    const question = document.createElement("div");
    question.className = "level-question";
    question.textContent = "Memorize a sequência.";
    wrap.appendChild(question);

    const seqElem = document.createElement("div");
    seqElem.className = "color-sequence";
    sequence.forEach(col => {
        const box = document.createElement("div");
        box.className = `color-box ${colors[col]}`;
        seqElem.appendChild(box);
    });
    wrap.appendChild(seqElem);

    const options = document.createElement("div");
    options.className = "color-options";
    shuffled.forEach(col => {
        const btn = document.createElement("button");
        btn.className = `color-option ${colors[col]}`;
        btn.dataset.color = col;
        options.appendChild(btn);
    });
    wrap.appendChild(options);
    DOM.levelContent.appendChild(wrap);

    GAME.state.colorSequence = sequence;
    GAME.state.colorIndex = 0;

    const t = setTimeout(() => {
        seqElem.style.opacity = "0";
        question.textContent = "Repita a sequência.";
    }, 4500);
    addLevelTimer(t);

    options.querySelectorAll(".color-option").forEach(btn => {
        btn.addEventListener("pointerup", () => {
            const expected = GAME.state.colorSequence[GAME.state.colorIndex];
            if (btn.dataset.color !== expected) {
                failLevel();
                return;
            }
            GAME.state.colorIndex++;
            if (GAME.state.colorIndex >= GAME.state.colorSequence.length) {
                completeLevel();
            } else {
                feedbackCorrect();
            }
        });
    });
}

    GAME.state.arrowIndex = 0;

    const t = setTimeout(() => {
        arrowWrap.style.opacity = "0";

function showArrowButtons() {
    const container = document.createElement("div");
    container.style.position = "absolute";
    container.style.inset = "0";
    container.style.display = "grid";
    container.style.gridTemplateColumns = "repeat(2, 90px)";
    container.style.gridTemplateRows = "repeat(2, 70px)";
    container.style.gap = "14px";
    container.style.alignItems = "center";
    container.style.justifyContent = "center";

    ["↑", "→", "↓", "←"].forEach(dir => {
        const btn = document.createElement("button");
        btn.className = "choice";
        btn.textContent = dir;
        container.appendChild(btn);
        btn.addEventListener("pointerup", () => {
            const expected = GAME.state.arrowSequence[GAME.state.arrowIndex];
            if (dir !== expected) {
                failLevel();
                return;
            }
            GAME.state.arrowIndex++;
            if (GAME.state.arrowIndex >= GAME.state.arrowSequence.length) {
                completeLevel();
            } else {
                feedbackCorrect();
            }
        });
    });
    DOM.levelContent.appendChild(container);
}

function finishGame() {
    clearLevelTimers();
    GAME.finished = true;
    soundVictory();
    vibrate([80, 60, 80, 60, 180]);

    const elapsed = Date.now() - GAME.startedAt;
    const seconds = Math.floor(elapsed / 1000);

    showOverlay("VOCÊ ESCAPOU", `MEMORY TRAP concluído. Tempo: ${formatTime(seconds)}. Tentativas: ${GAME.totalAttempts}.`, "SALVAR NO HALL", () => {
        closeOverlay();
        askForName(seconds);
    });
}

function formatTime(seconds) {
    const mins = Math.floor(seconds / 60);
    const secs = seconds % 60;
    return `${String(mins).padStart(2,"0")}:${String(secs).padStart(2,"0")}`;
}

function askForName(seconds) {
    const name = window.prompt("Você sobreviveu!\n\nDigite seu nome para o Hall dos Sobreviventes:");
    if (name && name.trim().length > 0) {
        saveSurvivor(name.trim(), { attempts: GAME.totalAttempts, mistakes: GAME.mistakes, time: seconds });
    }
    goHome();
}

function updateSettingsUI() {
    DOM.soundButton.textContent = CONFIG.SOUND_ENABLED ? "ON" : "OFF";
    DOM.vibrationButton.textContent = CONFIG.VIBRATION_ENABLED ? "ON" : "OFF";
}

DOM.soundButton.addEventListener("pointerup", () => {
    CONFIG.SOUND_ENABLED = !CONFIG.SOUND_ENABLED;
    updateSettingsUI();
});

DOM.vibrationButton.addEventListener("pointerup", () => {
    CONFIG.VIBRATION_ENABLED = !CONFIG.VIBRATION_ENABLED;
    updateSettingsUI();
    if (CONFIG.VIBRATION_ENABLED) vibrate(30);
});

DOM.startButton.addEventListener("pointerup", () => {
    const ctx = getAudioContext();
    if (ctx && ctx.state === "suspended") ctx.resume().catch(() => {});
    startGame();
});

DOM.menuButton.addEventListener("pointerup", () => {
    showScreen(DOM.settingsScreen);
});

DOM.backButton.addEventListener("pointerup", () => {
    showScreen(DOM.homeScreen);
    startHallAnimation();
});

document.addEventListener("contextmenu", e => e.preventDefault());
document.addEventListener("gesturestart", e => e.preventDefault());
document.addEventListener("touchmove", e => { if (e.cancelable) e.preventDefault(); }, { passive: false });

function init() {
    GAME.lives = CONFIG.STARTING_LIVES;
    updateLives();
    renderHall();
    updateSettingsUI();
    startHallAnimation();
}

init();
</script>
