<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no,
               viewport-fit=cover">

<meta name="theme-color" content="#000000">

<title>MEMORY TRAP</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
}

html, body {
    margin: 0; width: 100%; height: 100%; overflow: hidden;
    background: #000; color: #fff; font-family: Arial, Helvetica, sans-serif;
    touch-action: none; position: fixed; inset: 0;
}

button {
    font: inherit; color: inherit; border: 0; outline: 0;
    background: none; touch-action: none;
}

#app {
    position: fixed; inset: 0; width: 100%; height: 100%;
    overflow: hidden; background: #000;
}

.screen {
    position: absolute; inset: 0; display: none;
    width: 100%; height: 100%; overflow: hidden;
}

.screen.active {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
}

/* TELA INICIAL */
#homeScreen {
    justify-content: space-between;
    align-items: center;
    padding: calc(env(safe-area-inset-top) + 20px) 20px calc(env(safe-area-inset-bottom) + 20px);
}

.logo { text-align: center; line-height: .82; pointer-events: none; margin-top: 5px; }
.logo-main { display: block; font-size: clamp(38px, 11vw, 64px); font-weight: 900; letter-spacing: .10em; }
.logo-sub { display: block; margin-top: 6px; font-size: clamp(14px, 3.8vw, 22px); font-weight: 700; letter-spacing: .45em; padding-left: .45em; }
.logo-line { width: min(200px, 50vw); height: 1px; margin: 10px auto 0; background: rgba(255,255,255,.45); }

/* VIDAS (VERMELHO VIBRANTE #ff3b30 COM ESPAÇAMENTO CLARO ENTRE ELAS EM TODAS AS TELAS) */
.lives { display: flex; justify-content: center; align-items: center; gap: 16px; }
.home-lives { margin: auto 0; }
.heart { position: relative; width: 22px; height: 22px; transform: rotate(-45deg); border-radius: 3px; background: #ff3b30; margin: 0 6px; }
.heart::before, .heart::after { content: ""; position: absolute; width: 22px; height: 22px; border-radius: 50%; background: #ff3b30; }
.heart::before { top: -11px; left: 0; }
.heart::after { top: 0; left: 11px; }
.heart.empty, .heart.empty::before, .heart.empty::after { background: #333333; }

.start-button {
    position: relative; width: min(320px, 82vw); min-height: 68px; padding: 12px 20px;
    border: 1px solid rgba(255,255,255,.75); border-radius: 6px; background: #050505;
    margin-bottom: 10px;
}
.start-button:active { transform: scale(.97); }
.start-title { display: block; font-size: 22px; font-weight: 900; letter-spacing: .15em; }
.start-subtitle { display: block; margin-top: 3px; font-size: 10px; letter-spacing: .25em; opacity: .55; }

.hall {
    position: relative; width: min(370px, 90vw); height: 110px; overflow: hidden;
    border-top: 1px solid rgba(255,255,255,.12); border-bottom: 1px solid rgba(255,255,255,.12);
    margin-bottom: 10px;
}
.hall-title { position: absolute; top: 6px; left: 0; right: 0; z-index: 3; text-align: center; font-size: 10px; letter-spacing: .25em; opacity: .5; }
.hall-mask { position: absolute; inset: 0; overflow: hidden; padding-top: 24px; }
.hall-list { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.hall-name { font-size: 13px; font-weight: 700; letter-spacing: .12em; opacity: .82; }
.hall-empty { margin-top: 20px; font-size: 10px; letter-spacing: .15em; opacity: .28; }
.home-menu { position: absolute; right: 20px; bottom: calc(env(safe-area-inset-bottom) + 10px); width: 40px; height: 40px; border: 1px solid rgba(255,255,255,.22); border-radius: 50%; font-size: 18px; opacity: .7; }

/* TELA DE JOGO */
#gameScreen { justify-content: flex-start; background: #000; }
.game-header { position: relative; width: 100%; text-align: center; padding-top: calc(env(safe-area-inset-top) + 15px); z-index: 20; }
.level-number { font-size: 18px; font-weight: 700; letter-spacing: .15em; }
.level-question { width: 90%; margin: 8px auto 0; text-align: center; font-size: clamp(15px, 3.8vw, 19px); font-weight: 700; line-height: 1.3; }
.level-content { position: relative; width: 100%; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px 20px 70px; gap: 15px; }
.game-lives { position: absolute; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom) + 15px); z-index: 30; }

.options-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; width: min(380px, 94vw); margin: 0 auto; }
.blue-choice {
    min-height: 65px; background: #246bff; border: 1px solid rgba(255,255,255,.25);
    border-radius: 14px; font-size: 18px; font-weight: 700; display: flex;
    align-items: center; justify-content: center; padding: 10px; text-align: center;
}
.blue-choice:active { transform: scale(.96); background: #1a53cc; }

/* NÍVEL 1 */
.broken-container { display: flex; flex-direction: column; align-items: center; gap: 30px; width: 100%; margin-top: -15px; }
.broken-top { width: 240px; height: 110px; background: #246bff; border-radius: 8px; clip-path: polygon(0% 0%, 100% 0%, 100% 50%, 82% 100%, 65% 60%, 50% 95%, 35% 60%, 18% 100%, 0% 50%); }
.broken-pieces-pool { display: flex; gap: 12px; justify-content: center; width: 100%; }
.puzzle-piece {
    width: 60px; height: 60px; background: #246bff; border-radius: 6px;
    touch-action: none; cursor: grab; transition: transform 0.2s ease;
}
.puzzle-piece.p1 { clip-path: polygon(0% 100%, 100% 100%, 100% 50%, 80% 10%, 65% 45%, 50% 15%, 35% 45%, 20% 10%, 0% 50%); }
.puzzle-piece.p2 { clip-path: polygon(0% 100%, 100% 100%, 100% 50%, 82% 0%, 65% 40%, 50% 5%, 35% 40%, 18% 0%, 0% 50%); }
.puzzle-piece.p3 { clip-path: polygon(0% 100%, 100% 100%, 100% 50%, 84% 5%, 65% 35%, 50% 10%, 35% 35%, 16% 5%, 0% 50%); }
.puzzle-piece.p4 { clip-path: polygon(0% 100%, 100% 100%, 100% 50%, 78% 15%, 65% 50%, 50% 20%, 35% 50%, 22% 15%, 0% 50%); }
.puzzle-piece.dragging { transition: none; z-index: 50; }

/* NÍVEL 2 */
.grid2-large { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(2, 75px); gap: 14px; width: min(380px, 94vw); }

/* NÍVEL 5 */
.shape-field-full { position: absolute; inset: 60px 10px 90px 10px; pointer-events: none; }
.geo-shape { position: absolute; background: #fff; }
.geo-circle { border-radius: 50%; }
.geo-square { border-radius: 4px; }
.geo-rect { border-radius: 3px; }
.geo-pentagon { clip-path: polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%); }
.geo-hexagon { clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%); }

/* NÍVEL 6 */
.click-circle { position: absolute; width: 45px; height: 45px; border-radius: 50%; background: #246bff; border: 1px solid #fff; }

/* NÍVEL 7 */
.rats-wrap { position: relative; width: 260px; height: 260px; margin-bottom: 10px; }
.orbit-center { position: absolute; top: 50%; left: 50%; width: 10px; height: 10px; transform: translate(-5%, -5%); animation: spin 4s linear infinite; }
.circling-rat { position: absolute; font-size: 26px; transform-origin: center; }
@keyframes spin { 100% { transform: translate(-50%, -50%) rotate(360deg); } }
.question-with-rat { position: relative; display: inline-block; padding: 0 15px; }
.small-hiding-rat { position: absolute; font-size: 14px; top: -15px; left: -30px; animation: ratArcRun 1.5s linear infinite; }
@keyframes ratArcRun {
    0% { transform: translate(0, 15px) scale(0.6); opacity: 0; }
    50% { transform: translate(90px, -15px) scale(0.6); opacity: 1; }
    100% { transform: translate(180px, 15px) scale(0.6); opacity: 0; }
}

/* NÍVEL 8 */
.color-bar-container { display: flex; justify-content: space-evenly; align-items: center; width: min(390px, 96vw); height: 180px; margin: 0 auto; }
.color-segment { width: 26px; height: 155px; border-radius: 6px; }
.color-segment:active { transform: scale(.95); }
.c-red { background: #ff3030; } .c-blue { background: #3080ff; }
.c-green { background: #35c96b; } .c-yellow { background: #ffd83d; }
.c-purple { background: #9c55ff; } .c-orange { background: #ff8a30; }

/* NÍVEL 9 */
.arrow-sequence-display { display: flex; gap: 16px; font-size: 40px; font-weight: 900; margin: 15px 0; }

/* NÍVEL 10 */
.red-trap-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; width: min(380px, 94vw); }
.red-trap-btn { min-height: 65px; border: 1px solid rgba(255,255,255,.25); border-radius: 14px; }
#secretRedTarget { cursor: pointer; }

/* NÍVEL 11: Labirinto Complexo de Setas Brancas em Fundo Preto */
.arrow-labyrinth-11 {
    position: relative; width: min(340px, 92vw); height: 320px;
    background: #000; border: 1px solid rgba(255,255,255,0.2); border-radius: 12px;
    overflow: hidden; margin: 0 auto;
}
.lab-arrow-node {
    position: absolute; width: 44px; height: 44px;
    background: #111; border: 1px solid rgba(255,255,255,0.4); border-radius: 8px;
    color: #fff; font-size: 22px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: transform 0.35s ease, opacity 0.35s ease;
}
.lab-arrow-node:active { transform: scale(0.92); }

/* ESTILOS DOS NÍVEIS 12 a 20 */
.hold-btn-12 { width: 140px; height: 140px; border-radius: 50%; background: #246bff; border: 4px solid #fff; font-size: 16px; font-weight: bold; display: flex; align-items: center; justify-content: center; }

.rhythm-target-13 { position: relative; width: 120px; height: 120px; border-radius: 50%; border: 3px dashed #246bff; display: flex; align-items: center; justify-content: center; }
.rhythm-pulse-13 { width: 40px; height: 40px; border-radius: 50%; background: #ff3b30; animation: pulseAnim 1.2s infinite ease-in-out; }
@keyframes pulseAnim { 0% { transform: scale(0.5); opacity: 0.5; } 50% { transform: scale(1.4); opacity: 1; } 100% { transform: scale(0.5); opacity: 0.5; } }

.reverse-grid-14 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; width: min(300px, 90vw); }
.rev-btn-14 { height: 75px; background: #333; border-radius: 12px; font-size: 22px; font-weight: bold; display: flex; align-items: center; justify-content: center; border: 2px solid rgba(255,255,255,0.2); }
.rev-btn-14.lit { background: #246bff; border-color: #fff; }

.blind-pixel-area-15 { position: absolute; inset: 0; }
.blind-pixel-15 { position: absolute; top: 15px; right: 15px; width: 14px; height: 14px; background: transparent; cursor: pointer; }

.drag-out-btn-16 { width: 140px; height: 60px; background: #246bff; border-radius: 10px; font-weight: bold; display: flex; align-items: center; justify-content: center; touch-action: none; position: absolute; }

.exclusion-field-17 { position: relative; width: min(360px, 92vw); height: 260px; border: 1px dashed rgba(255,255,255,0.2); border-radius: 12px; overflow: hidden; }
.exc-item { position: absolute; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; }
.exc-circle { width: 40px; height: 40px; border-radius: 50%; background: #246bff; }
.exc-square { width: 40px; height: 40px; border-radius: 6px; background: #ff3b30; }

.escaping-btn-18 { width: 130px; height: 60px; background: #246bff; border-radius: 12px; font-weight: bold; position: absolute; transition: transform 0.15s ease; display: flex; align-items: center; justify-content: center; }

.intruder-grid-19 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; width: min(320px, 90vw); }
.intruder-cell { aspect-ratio: 1; background: #1c1c1e; border-radius: 6px; font-size: 20px; font-weight: bold; display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.8); }

.recall-grid-20 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; width: min(340px, 90vw); }
.recall-shape-btn { height: 100px; background: #1c1c1e; border: 2px solid rgba(255,255,255,0.2); border-radius: 12px; display: flex; align-items: center; justify-content: center; }
.recall-mini-shape { width: 70px; height: 40px; background: #246bff; border-radius: 6px; }

/* OVERLAYS E SETTINGS */
#overlay { position: absolute; inset: 0; z-index: 100; display: none; align-items: center; justify-content: center; background: #000; }
#overlay.active { display: flex; }
.overlay-content { width: min(340px, 86vw); text-align: center; }
.overlay-title { font-size: 28px; font-weight: 900; letter-spacing: .1em; }
.overlay-text { margin-top: 12px; font-size: 14px; line-height: 1.4; opacity: .7; }
.overlay-button { margin-top: 24px; padding: 14px 26px; border: 1px solid rgba(255,255,255,.5); border-radius: 8px; }

#settingsScreen { flex-direction: column; align-items: center; justify-content: flex-start; padding: calc(env(safe-area-inset-top) + 40px) 25px 25px; }
.settings-title { font-size: 24px; font-weight: 900; letter-spacing: .15em; }
.setting-row { display: flex; align-items: center; justify-content: space-between; width: min(360px, 90vw); margin-top: 22px; padding: 16px 0; border-bottom: 1px solid rgba(255,255,255,.12); }
.setting-button { min-width: 70px; padding: 8px 14px; border: 1px solid rgba(255,255,255,.3); border-radius: 8px; }
.back-button { position: absolute; left: 20px; top: calc(env(safe-area-inset-top) + 15px); padding: 10px; opacity: .6; }
</style>
</head>

<body>
<div id="app">
    <section id="homeScreen" class="screen active">
        <div class="logo">
            <span class="logo-main">MEMORY</span><span class="logo-sub">TRAP</span><div class="logo-line"></div>
        </div>
        <div id="homeLives" class="lives home-lives"></div>
        <button id="startButton" class="start-button">
            <span class="start-title">INICIAR</span><span class="start-subtitle">MEMORY TRAP</span>
        </button>
        <div class="hall">
            <div class="hall-title">HALL DOS SOBREVIVENTES</div>
            <div class="hall-mask">
                <div id="hallList" class="hall-list"></div>
            </div>
        </div>
        <button id="menuButton" class="home-menu" aria-label="Menu">☰</button>
    </section>

    <section id="gameScreen" class="screen">
        <div class="game-header">
            <div id="levelNumber" class="level-number"></div>
            <div id="levelQuestion" class="level-question"></div>
        </div>
        <div id="levelContent" class="level-content"></div>
        <div id="gameLives" class="lives game-lives"></div>
    </section>

    <section id="settingsScreen" class="screen">
        <button id="backButton" class="back-button">←</button>
        <div class="settings-title">CONFIGURAÇÕES</div>
        <div class="setting-row"><span>SOM</span><button id="soundButton" class="setting-button">ON</button></div>
        <div class="setting-row"><span>VIBRAÇÃO</span><button id="vibrationButton" class="setting-button">ON</button></div>
    </section>

    <div id="overlay">
        <div class="overlay-content">
            <div id="overlayTitle" class="overlay-title"></div>
            <div id="overlayText" class="overlay-text"></div>
            <button id="overlayButton" class="overlay-button"></button>
        </div>
    </div>
</div>

<script>
const CONFIG = { TOTAL_LEVELS: 100, STARTING_LIVES: 5, SOUND_ENABLED: true, VIBRATION_ENABLED: true, SURVIVORS_KEY: "memory_trap_survivors_v1" };
const GAME = { currentLevel: 0, lives: CONFIG.STARTING_LIVES, totalAttempts: 0, mistakes: 0, levelTimers: [], state: {}, finished: false };

const DOM = {
    homeScreen: document.getElementById("homeScreen"), gameScreen: document.getElementById("gameScreen"), settingsScreen: document.getElementById("settingsScreen"),
    homeLives: document.getElementById("homeLives"), gameLives: document.getElementById("gameLives"), levelNumber: document.getElementById("levelNumber"),
    levelQuestion: document.getElementById("levelQuestion"), levelContent: document.getElementById("levelContent"), startButton: document.getElementById("startButton"),
    menuButton: document.getElementById("menuButton"), backButton: document.getElementById("backButton"), soundButton: document.getElementById("soundButton"),
    vibrationButton: document.getElementById("vibrationButton"), hallList: document.getElementById("hallList"), overlay: document.getElementById("overlay"),
    overlayTitle: document.getElementById("overlayTitle"), overlayText: document.getElementById("overlayText"), overlayButton: document.getElementById("overlayButton")
};

const LEVELS = {
    1: { type: "broken-shape" }, 2: { type: "grid" }, 3: { type: "direct-answer" }, 4: { type: "pi" },
    5: { type: "count-circles" }, 6: { type: "appearing-circles" }, 7: { type: "no-number-rats", hiddenNumber: true },
    8: { type: "color-memory" }, 9: { type: "arrow-memory" }, 10: { type: "camouflaged-command" },
    11: { type: "labyrinth-arrows" }, 12: { type: "hold-two-seconds" }, 13: { type: "circle-rhythm" },
    14: { type: "reverse-order" }, 15: { type: "blind-pixel" }, 16: { type: "drag-outside" },
    17: { type: "circle-exclusion" }, 18: { type: "escaping-button" }, 19: { type: "letter-intruder" },
    20: { type: "level1-recall", special: true }
};
for (let i = 21; i <= 100; i++) LEVELS[i] = { name: "Nível " + i, type: "unimplemented" };

function clearLevelTimers() { GAME.levelTimers.forEach(t => { clearTimeout(t); clearInterval(t); }); GAME.levelTimers = []; }
function addLevelTimer(t) { GAME.levelTimers.push(t); }

let audioContext = null;
function getAudioContext() {
    if (!audioContext) { const Ctx = window.AudioContext || window.webkitAudioContext; if (Ctx) audioContext = new Ctx(); }
    return audioContext;
}

function playTone(freq, dur, type = "sine", vol = 0.035) {
    if (!CONFIG.SOUND_ENABLED) return;
    const ctx = getAudioContext(); if (!ctx) return;
    if (ctx.state === "suspended") ctx.resume().catch(() => {});
    const osc = ctx.createOscillator(); const gain = ctx.createGain();
    osc.type = type; osc.frequency.setValueAtTime(freq, ctx.currentTime);
    gain.gain.setValueAtTime(vol, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    osc.connect(gain); gain.connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime + dur);
}

function soundCorrect() { playTone(720, .08, "sine", .035); setTimeout(() => playTone(960, .07, "sine", .025), 45); }
function soundLifeLost() { playTone(95, .25, "sawtooth", .05); }
function soundVictory() { [392, 494, 587, 784].forEach((n, i) => setTimeout(() => playTone(n, .25, "sine", .045), i * 150)); }

function vibrate(pat) { if (CONFIG.VIBRATION_ENABLED && "vibrate" in navigator) { try { navigator.vibrate(pat); } catch (e) {} } }
function feedbackCorrect() { soundCorrect(); vibrate(18); }
function feedbackLifeLost() { soundLifeLost(); vibrate([60, 40, 80]); }

function renderLives(container) {
    container.innerHTML = "";
    for (let i = 0; i < CONFIG.STARTING_LIVES; i++) {
        const heart = document.createElement("div"); heart.className = "heart";
        if (i >= GAME.lives) heart.classList.add("empty");
        container.appendChild(heart);
    }
}
function updateLives() { renderLives(DOM.homeLives); renderLives(DOM.gameLives); }

function showScreen(screen) { document.querySelectorAll(".screen").forEach(el => el.classList.remove("active")); screen.classList.add("active"); }

function goHome() { clearLevelTimers(); GAME.finished = false; updateLives(); showScreen(DOM.homeScreen); startHallAnimation(); }

function getSurvivors() { try { const raw = localStorage.getItem(CONFIG.SURVIVORS_KEY); return raw ? JSON.parse(raw) : []; } catch { return []; } }
function saveSurvivor(name, stats) {
    const survivors = getSurvivors();
    survivors.push({ name, attempts: stats.attempts, mistakes: stats.mistakes, time: stats.time, date: Date.now() });
    localStorage.setItem(CONFIG.SURVIVORS_KEY, JSON.stringify(survivors)); renderHall();
}
function renderHall() {
    const survivors = getSurvivors(); DOM.hallList.innerHTML = "";
    if (survivors.length === 0) { const empty = document.createElement("div"); empty.className = "hall-empty"; empty.textContent = "NENHUM SOBREVIVENTE"; DOM.hallList.appendChild(empty); return; }
    survivors.slice(-20).reverse().forEach(p => { const name = document.createElement("div"); name.className = "hall-name"; name.textContent = String(p.name).slice(0, 20).toUpperCase(); DOM.hallList.appendChild(name); });
}

let hallAnim = null; let hallPos = 0;
function startHallAnimation() {
    if (hallAnim) cancelAnimationFrame(hallAnim); hallPos = 0;
    function animate() {
        if (!DOM.homeScreen.classList.contains("active")) return;
        const h = DOM.hallList.offsetHeight; const v = DOM.hallList.parentElement.offsetHeight;
        if (h > v) {
            hallPos += 0.18;
            if (hallPos > h - v + 25) hallPos = 0;
            DOM.hallList.style.transform = `translateY(-${hallPos}px)`;
        }
        hallAnim = requestAnimationFrame(animate);
    }
    animate();
}

function startGame() {
    clearLevelTimers(); GAME.currentLevel = 1; GAME.lives = CONFIG.STARTING_LIVES;
    GAME.totalAttempts = 0; GAME.mistakes = 0; GAME.finished = false;
    updateLives(); showScreen(DOM.gameScreen); loadLevel(1);
}

function loadLevel(levelNumber) {
    clearLevelTimers(); GAME.currentLevel = levelNumber; GAME.state = {};
    const level = LEVELS[levelNumber];
    if (!level) { finishGame(); return; }
    DOM.levelNumber.textContent = level.hiddenNumber ? "" : levelNumber;
    DOM.levelQuestion.innerHTML = ""; DOM.levelContent.innerHTML = "";
    renderLevel(levelNumber, level); updateLives();
}

function failLevel() {
    if (GAME.finished) return;
    GAME.totalAttempts++; GAME.mistakes++; GAME.lives--;
    feedbackLifeLost(); updateLives();
    if (GAME.lives <= 0) {
        clearLevelTimers();
        showOverlay("SEM VIDAS", "Você perdeu as 5 vidas. O jogo será reiniciado do Nível 1.", "RECOMEÇAR", () => { GAME.lives = CONFIG.STARTING_LIVES; updateLives(); closeOverlay(); loadLevel(1); });
        return;
    }
    showOverlay("ERRO", "Você continua no mesmo nível.", "TENTAR NOVAMENTE", () => { closeOverlay(); loadLevel(GAME.currentLevel); });
}

function completeLevel() {
    if (GAME.finished) return;
    feedbackCorrect(); const next = GAME.currentLevel + 1;
    if (GAME.currentLevel === CONFIG.TOTAL_LEVELS || !LEVELS[next]) { finishGame(); return; }
    setTimeout(() => { loadLevel(next); }, 180);
}

function showOverlay(title, text, btnText, action) { DOM.overlayTitle.textContent = title; DOM.overlayText.textContent = text; DOM.overlayButton.textContent = btnText; DOM.overlayButton.onclick = action; DOM.overlay.classList.add("active"); }
function closeOverlay() { DOM.overlay.classList.remove("active"); }

function renderLevel(number, level) {
    switch (level.type) {
        case "broken-shape": renderLevel1(); break; case "grid": renderLevel2(); break;
        case "direct-answer": renderLevel3(); break; case "pi": renderLevel4(); break;
        case "count-circles": renderLevel5(); break; case "appearing-circles": renderLevel6(); break;
        case "no-number-rats": renderLevel7(); break; case "color-memory": renderLevel8(); break;

    DOM.levelQuestion.textContent = "Complete a figura.";
    const wrap = document.createElement("div"); wrap.className = "broken-container";
    wrap.innerHTML = `
        <div class="broken-top" id="targetArea"></div>
        <div class="broken-pieces-pool">
            <div class="puzzle-piece p1" data-correct="false"></div>
            <div class="puzzle-piece p2" data-correct="true"></div>
            <div class="puzzle-piece p3" data-correct="false"></div>

        </div>
    `;
    DOM.levelContent.appendChild(wrap);

    const pieces = wrap.querySelectorAll(".puzzle-piece");
    const targetArea = wrap.querySelector("#targetArea");

    pieces.forEach(piece => {
        piece.addEventListener("pointerdown", e => {
            piece.setPointerCapture(e.pointerId);
            piece.classList.add("dragging");
            const startX = e.clientX; const startY = e.clientY;
            
            function onMove(em) { piece.style.transform = `translate(${em.clientX - startX}px, ${em.clientY - startY}px)`; }
            
            function onUp(em) {
                piece.releasePointerCapture(em.pointerId); piece.classList.remove("dragging");
                piece.removeEventListener("pointermove", onMove); piece.removeEventListener("pointerup", onUp);
                
                const pRect = piece.getBoundingClientRect(); const tRect = targetArea.getBoundingClientRect();
                const isOver = (pRect.left >= tRect.left - 30 && pRect.right <= tRect.right + 30 && pRect.top >= tRect.top - 30 && pRect.bottom <= tRect.bottom + 30);
                
                if (isOver) {
                    if (piece.dataset.correct === "true") { piece.style.visibility = "hidden"; completeLevel(); } 
                    else { failLevel(); setTimeout(() => piece.style.transform = "none", 100); }
                } else { piece.style.transform = "none"; }
            }
            piece.addEventListener("pointermove", onMove); piece.addEventListener("pointerup", onUp);
        });
    });
}

/* NÍVEL 11: Labirinto Complexo de Setas Brancas em Fundo Preto (Fiel à Referência) */
function renderLevel11() {
    DOM.levelQuestion.textContent = "Limpe o labirinto de setas.";
    const wrap = document.createElement("div"); wrap.className = "arrow-labyrinth-11";
    
    // Conjunto de nós de setas distribuídos no labirinto complexo (posições X, Y em px, direção e se está bloqueado por outra seta na mesma linha de saída)
    const nodes = [
        { id: 1, text: "←", x: 20, y: 20, dir: "left", blocked: true },
        { id: 2, text: "↑", x: 140, y: 20, dir: "up", blocked: false },
        { id: 3, text: "→", x: 260, y: 20, dir: "right", blocked: true },
        { id: 4, text: "↓", x: 80, y: 110, dir: "down", blocked: false },
        { id: 5, text: "→", x: 190, y: 110, dir: "right", blocked: false },
        { id: 6, text: "↑", x: 60, y: 210, dir: "up", blocked: true },
        { id: 7, text: "←", x: 160, y: 210, dir: "left", blocked: false },
        { id: 8, text: "↓", x: 260, y: 210, dir: "down", blocked: false }
    ];

    let remainingFree = nodes.filter(n => !n.blocked).length;
    // Se o jogador limpar as livres, desbloqueia as outras em cascata
    let activeNodes = [...nodes];

    activeNodes.forEach(node => {
        const btn = document.createElement("button");
        btn.className = "lab-arrow-node";
        btn.textContent = node.text;
        btn.style.left = node.x + "px";
        btn.style.top = node.y + "px";
        wrap.appendChild(btn);

        btn.addEventListener("pointerup", () => {
            if (btn.disabled) return;
            
            if (node.blocked) {
                failLevel();
            } else {
                btn.disabled = true;
                feedbackCorrect();
                let slideX = 0, slideY = 0;
                if (node.dir === "left") slideX = -350;
                if (node.dir === "right") slideX = 350;
                if (node.dir === "up") slideY = -350;
                if (node.dir === "down") slideY = 350;

                btn.style.transform = `translate(${slideX}px, ${slideY}px)`;
                btn.style.opacity = "0";

                node.cleared = true;
                // Desbloqueia nós dependentes
                activeNodes.forEach(n => {
                    if (n.blocked) {
                        // Se era bloqueado por este, agora fica livre
                        n.blocked = false;
                        remainingFree++;
                    }
                });

                remainingFree--;
                if (remainingFree <= 0) {
                    setTimeout(completeLevel, 450);
                }
            }
        });
    });

    DOM.levelContent.appendChild(wrap);
}

function renderUnimplementedLevel(number, level) {
    const wrap = document.createElement("div");
    wrap.style.cssText = "text-align: center; width: 100%;";
    wrap.innerHTML = `
        <div class="level-question">
            ${level.name}
        </div>
        <div style="font-size: 12px; opacity: .5; margin-top: 20px; letter-spacing: .12em;">
            MECÂNICA RESERVADA
        </div>
        <button class="blue-choice" style="display:block; width:180px; margin:30px auto 0;">
            TESTAR
        </button>
    `;
    DOM.levelContent.appendChild(wrap);
    wrap.querySelector("button").addEventListener("pointerup", completeLevel);
}

function finishGame() {
    clearLevelTimers(); GAME.finished = true; soundVictory(); vibrate([80, 60, 80, 60, 180]);
    showOverlay("PARABÉNS", "Você concluiu o MEMORY TRAP com sucesso!", "REINICIAR", () => { closeOverlay(); goHome(); });
}

function updateSettingsUI() {
    DOM.soundButton.textContent = CONFIG.SOUND_ENABLED ? "ON" : "OFF";
    DOM.vibrationButton.textContent = CONFIG.VIBRATION_ENABLED ? "ON" : "OFF";
}

DOM.soundButton.addEventListener("pointerup", () => { CONFIG.SOUND_ENABLED = !CONFIG.SOUND_ENABLED; updateSettingsUI(); });
DOM.vibrationButton.addEventListener("pointerup", () => { CONFIG.VIBRATION_ENABLED = !CONFIG.VIBRATION_ENABLED; updateSettingsUI(); if (CONFIG.VIBRATION_ENABLED) vibrate(30); });
DOM.startButton.addEventListener("pointerup", () => { const ctx = getAudioContext(); if (ctx && ctx.state === "suspended") ctx.resume().catch(() => {}); startGame(); });
DOM.menuButton.addEventListener("pointerup", () => { showScreen(DOM.settingsScreen); });
DOM.backButton.addEventListener("pointerup", () => { showScreen(DOM.homeScreen); startHallAnimation(); });

document.addEventListener("contextmenu", e => e.preventDefault());
document.addEventListener("gesturestart", e => e.preventDefault());
document.addEventListener("touchmove", e => { if (e.cancelable) e.preventDefault(); }, { passive: false });

function init() {
    GAME.lives = CONFIG.STARTING_LIVES;
    updateLives();
    renderHall();
    updateSettingsUI();
    startHallAnimation();
}
init();
</script>
</body>
</html>
