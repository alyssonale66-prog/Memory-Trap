<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    >

    <meta name="theme-color" content="#000000">

    <title>MEMORY TRAP</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
            touch-action: none;
            position: fixed;
            inset: 0;
        }

        button {
            font: inherit;
            color: inherit;
            border: 0;
            outline: 0;
            background: none;
            touch-action: none;
        }

        #app {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        .screen {
            position: absolute;
            inset: 0;
            display: none;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .screen.active {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #homeScreen {
            justify-content: center;
            align-items: center;
            gap: 24px;
            padding:
                calc(env(safe-area-inset-top) + 25px)
                20px
                calc(env(safe-area-inset-bottom) + 20px);
        }

        .logo {
            text-align: center;
            line-height: 1.1;
            pointer-events: none;
            margin: 0;
        }

        .logo-main {
            display: block;
            font-size: clamp(38px, 11vw, 64px);
            font-weight: 900;
            letter-spacing: .10em;
            line-height: .90;
        }

        .logo-sub {
            display: block;
            margin-top: 14px;
            font-size: clamp(14px, 3.8vw, 22px);
            font-weight: 700;
            letter-spacing: .55em;
            padding-left: .55em;
            line-height: 1;
        }

        .logo-line {
            width: min(200px, 50vw);
            height: 1px;
            margin: 18px auto 0;
            background: rgba(255, 255, 255, .45);
        }

        .lives {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        .heart {
            position: relative;
            width: 22px;
            height: 22px;
            transform: rotate(-45deg);
            border-radius: 3px;
            background: #ff3b30;
        }

        .heart::before,
        .heart::after {
            content: "";
            position: absolute;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #ff3b30;
        }

        .heart::before {
            top: -11px;
            left: 0;
        }

        .heart::after {
            top: 0;
            left: 11px;
        }

        .heart.empty,
        .heart.empty::before,
        .heart.empty::after {
            background: #333;
        }

        .start-button {
            position: relative;
            width: min(320px, 82vw);
            min-height: 68px;
            padding: 12px 20px;
            border: 1px solid rgba(255, 255, 255, .75);
            border-radius: 6px;
            background: #050505;
        }

        .start-title {
            display: block;
            font-size: 22px;
            font-weight: 900;
            letter-spacing: .15em;
        }

        .start-subtitle {
            display: block;
            margin-top: 3px;
            font-size: 10px;
            letter-spacing: .25em;
            opacity: .55;
        }

        .hall {
            position: relative;
            width: min(370px, 90vw);
            height: 110px;
            overflow: hidden;
            border-top: 1px solid rgba(255, 255, 255, .12);
            border-bottom: 1px solid rgba(255, 255, 255, .12);
        }

        .hall-title {
            position: absolute;
            top: 6px;
            left: 0;
            right: 0;
            z-index: 3;
            text-align: center;
            font-size: 10px;
            letter-spacing: .25em;
            opacity: .5;
        }

        .hall-mask {
            position: absolute;
            inset: 0;
            overflow: hidden;
            padding-top: 24px;
        }

        .hall-list {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .hall-name {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: .12em;
            opacity: .82;
        }

        .hall-empty {
            margin-top: 20px;
            font-size: 10px;
            letter-spacing: .15em;
            opacity: .28;
        }

        .home-menu {
            position: absolute;
            right: 20px;
            bottom: calc(env(safe-area-inset-bottom) + 10px);
            width: 40px;
            height: 40px;
            border: 1px solid rgba(255, 255, 255, .22);
            border-radius: 50%;
            font-size: 18px;
            opacity: .7;
        }

        #gameScreen {
            justify-content: flex-start;
            background: #000;
        }

        .game-header {
            position: relative;
            width: 100%;
            text-align: center;
            padding-top: calc(env(safe-area-inset-top) + 15px);
            z-index: 20;
        }

        .level-number {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: .15em;
        }

        .level-question {
            width: 90%;
            margin: 8px auto 0;
            text-align: center;
            font-size: clamp(15px, 3.8vw, 19px);
            font-weight: 700;
            line-height: 1.3;
        }

        .level-content {
            position: relative;
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px 12px 70px;
            gap: 15px;
        }

        .game-lives {
            position: absolute;
            left: 0;
            right: 0;
            bottom: calc(env(safe-area-inset-bottom) + 15px);
            z-index: 30;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
            width: min(380px, 94vw);
            margin: 0 auto;
        }

        .blue-choice {
            min-height: 65px;
            background: #246bff;
            border: 1px solid rgba(255, 255, 255, .25);
            border-radius: 14px;
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            text-align: center;
        }

        .broken-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            width: 100%;
            justify-content: flex-start;
            padding-top: 10px;
        }

        .broken-top {
            width: min(42vw, 165px);
            height: min(28vw, 110px);
            background: #246bff;
            border-radius: 8px 8px 4px 4px;
            clip-path: polygon(
                0% 0%,
                100% 0%,
                100% 52%,
                88% 100%,
                76% 62%,
                63% 100%,
                51% 60%,
                37% 100%,
                25% 60%,
                12% 100%,
                0% 52%
            );
            transition: all 0.3s ease;
            box-shadow: 0 0 0 1px rgba(255, 255, 255, .15) inset;
        }

        .broken-top.filled {
            clip-path: none;
        }

        .broken-pieces-pool {
            display: grid;
            grid-template-columns: 1
